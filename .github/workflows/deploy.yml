name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A project site is served from /<repo>, so the built asset paths need
      # that prefix. A user or org page is served from the root and needs none.
      # The origin goes with it: social cards need absolute URLs, and a
      # scraper cannot resolve a relative one. Pages serves the owner in
      # lower case, so the host is folded before it is used.
      - name: Work out the base path
        id: base
        run: |
          if [[ "${{ github.event.repository.name }}" == "${{ github.repository_owner }}.github.io" ]]; then
            echo "path=" >> "$GITHUB_OUTPUT"
          else
            echo "path=/${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"
          fi
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "origin=https://$owner.github.io" >> "$GITHUB_OUTPUT"

      - run: npm run build
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}
          SITE_ORIGIN: ${{ steps.base.outputs.origin }}

      # No .nojekyll is needed: a site deployed by this workflow is served as
      # uploaded and never passes through Jekyll, so _next/ survives. The
      # upload action leaves dotfiles out of the artifact in any case.
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
