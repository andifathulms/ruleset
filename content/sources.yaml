# Every source cited by id. Rule 2: never invent a citation.
#
# `standing` records how far the citation has actually been checked against the
# document, and it is rendered, not hidden:
#
#   primary-checked   the named edition and article were read
#   primary-named     the document exists and is the right one, but the article
#                     number here has not been confirmed against the text
#   secondary         a governing-body statement, circular, or press release
#   absent            no source found; the entry renders as incomplete
#
# Entries below are seeded at `primary-named` unless stated. Promoting one to
# `primary-checked` means opening the document — see the content workflow in
# CLAUDE.md. Nothing is promoted from memory.

- id: bwf-laws-of-badminton
  standing: primary-named
  title: Laws of Badminton
  publisher: Badminton World Federation
  kind: rulebook
  url: https://corporate.bwfbadminton.com/statutes/
  note: >
    BWF publishes the Laws as Part II, Section 1A of its Statutes, revised at
    each Annual General Meeting. Cite the AGM year of the edition.

- id: bwf-agm-2005
  standing: secondary
  title: BWF Annual General Meeting decisions, 2005
  publisher: Badminton World Federation
  kind: minutes
  note: >
    The rally-scoring decision was taken by the membership in 2005 for trial and
    confirmed for general use in 2006. Minutes not yet obtained.

- id: wa-technical-rules
  standing: primary-named
  title: World Athletics Technical Rules (Book C, C2.1)
  publisher: World Athletics
  kind: rulebook
  url: https://worldathletics.org/about-iaaf/documents/book-of-rules
  note: >
    Published as the IAAF Competition Rules until the 2019 rename. Javelin
    specification sits in the throwing-implement rule; cite the rule number of
    the edition in force, which has been renumbered more than once.

- id: wa-record-progressions
  standing: primary-named
  title: World Athletics world record progressions
  publisher: World Athletics
  kind: record-book
  url: https://worldathletics.org/records/by-category/world-records

- id: ifab-laws-of-the-game
  standing: primary-named
  title: Laws of the Game
  publisher: International Football Association Board
  kind: rulebook
  url: https://www.theifab.com/laws-of-the-game-documents/
  note: >
    IFAB publishes an annual edition plus a circular listing that season's
    amendments. Cite the season (e.g. 1992/93) and the Law number.

- id: ifab-circulars
  standing: primary-named
  title: IFAB annual Law amendment circulars
  publisher: International Football Association Board
  kind: circular
  url: https://www.theifab.com/documents/

- id: fig-code-of-points
  standing: primary-named
  title: Code of Points
  publisher: Fédération Internationale de Gymnastique
  kind: rulebook
  url: https://www.gymnastics.sport/site/rules/
  note: >
    Published per quadrennium and per apparatus group. The 2006–2008 edition is
    the one that removed the 10.0 maximum.

- id: world-aquatics-rules
  standing: primary-named
  title: Competition Rules
  publisher: World Aquatics (formerly FINA)
  kind: rulebook
  url: https://www.worldaquatics.com/rules
  note: >
    The swimwear rules sit in the SW and BL sections. The 2009 Rome congress
    decision is recorded in FINA congress minutes under the former name.

- id: fina-dubai-charter-2009
  standing: secondary
  title: FINA Bureau decision on swimwear (Dubai Charter)
  publisher: FINA
  kind: circular
  note: >
    The decision to permit textile-only suits from 2010 while allowing records
    set in non-textile suits to stand. Full text not yet obtained.

- id: olympedia
  standing: secondary
  title: Olympedia
  publisher: OlyMADMen / International Olympic Committee
  kind: database
  url: https://www.olympedia.org/
  note: Used for the skeleton layer only, never for a cause or a rule citation.

- id: ioc-olympic-charter
  standing: primary-named
  title: Olympic Charter
  publisher: International Olympic Committee
  kind: charter
  url: https://olympics.com/ioc/olympic-charter
  note: Source of the sport / discipline / event vocabulary used throughout.

- id: bunker-thorpe-1982
  standing: secondary
  title: A model for the teaching of games in secondary schools
  publisher: Bulletin of Physical Education
  kind: paper
  note: >
    Bunker and Thorpe, 1982. The origin of the invasion / net and wall /
    striking and fielding / target grouping used by the game-category lens.

# ---- Added with the second wave of sports. Same standing rules apply: the
# document is named and real, the article is not confirmed until it is read.

- id: ittf-handbook
  standing: primary-named
  title: ITTF Handbook
  publisher: International Table Tennis Federation
  kind: rulebook
  url: https://www.ittf.com/handbook/
  note: >
    The Laws of Table Tennis are Chapter 2 of the Handbook, which is reissued
    annually. Cite the year of the edition and the numbered law.

- id: fiba-official-rules
  standing: primary-named
  title: Official Basketball Rules
  publisher: FIBA
  kind: rulebook
  url: https://www.fiba.basketball/documents
  note: >
    Reissued every four years with interpretations published between editions.
    The NBA keeps a separate rulebook, and the two differ on the three-point
    distance and the shot clock reset, so a basketball rule must say which body
    it belongs to.

- id: nba-rulebook
  standing: primary-named
  title: Official Rules of the National Basketball Association
  publisher: NBA
  kind: rulebook
  url: https://official.nba.com/rulebook/
  note: >
    A league rulebook, not an international federation's. Included because the
    shot clock and the three-point line were both NBA rules years before FIBA
    adopted anything comparable.

- id: uci-regulations
  standing: primary-named
  title: UCI Cycling Regulations
  publisher: Union Cycliste Internationale
  kind: rulebook
  url: https://www.uci.org/regulations/
  note: >
    Part 1 covers general organisation and Part 3 track racing; the equipment
    articles are the ones that matter for the hour record.

- id: uci-hour-record
  standing: primary-named
  title: UCI Hour Record progression
  publisher: Union Cycliste Internationale
  kind: record-book
  note: >
    The UCI has maintained more than one hour record list at once. Any figure
    must say which list it belongs to and under which equipment rules it was
    set.

- id: ijf-sor
  standing: primary-named
  title: Sport and Organisation Rules
  publisher: International Judo Federation
  kind: rulebook
  url: https://www.ijf.org/ijf/documents
  note: >
    Revised at the start of most Olympic cycles, which is why judo's scoring has
    changed shape several times in twenty years.

- id: world-archery-rulebook
  standing: primary-named
  title: World Archery Rulebook
  publisher: World Archery Federation
  kind: rulebook
  url: https://www.worldarchery.sport/rulebook
  note: Book 3 covers target archery, including the match and set systems.

- id: fivb-rules
  standing: primary-named
  title: Official Volleyball Rules
  publisher: FIVB
  kind: rulebook
  url: https://www.fivb.com/volleyball/the-game/
  note: Reissued per quadrennium.

- id: itf-rules-of-tennis
  standing: primary-named
  title: Rules of Tennis
  publisher: International Tennis Federation
  kind: rulebook
  url: https://www.itftennis.com/en/about-us/governance/rules-and-regulations/
  note: >
    Published annually. The four Grand Slam tournaments set some of their own
    conditions on top of the Rules, which is why final-set formats differed
    between them for decades.

# ---- Third wave.

- id: iwf-technical-rules
  standing: primary-named
  title: IWF Technical and Competition Rules and Regulations
  publisher: International Weightlifting Federation
  kind: rulebook
  url: https://iwf.sport/weightlifting_/rules/
  note: >
    Contains the bodyweight categories, which is where this sport's
    comparability problem lives: the categories have been redrawn twice and
    the record list annulled both times.

- id: uipm-rules
  standing: primary-named
  title: UIPM Competition Rules
  publisher: Union Internationale de Pentathlon Moderne
  kind: rulebook
  url: https://www.uipmworld.org/rules
  note: >
    Published per discipline. The 2022 decision to replace riding is recorded
    in UIPM Congress minutes rather than in the rulebook of the time.

- id: mcc-laws-of-cricket
  standing: primary-named
  title: The Laws of Cricket
  publisher: Marylebone Cricket Club
  kind: rulebook
  url: https://www.lords.org/mcc/the-laws-of-cricket
  note: >
    MCC owns the Laws; the ICC runs the international game and issues playing
    conditions on top of them. The same split as football's, and it means a
    cricket rule must say whether it is a Law or a playing condition.

- id: icc-playing-conditions
  standing: primary-named
  title: ICC Standard Playing Conditions
  publisher: International Cricket Council
  kind: circular
  url: https://www.icc-cricket.com/about/cricket/rules-and-regulations/playing-conditions
  note: Format-specific, and reissued far more often than the Laws themselves.

- id: mlb-official-rules
  standing: primary-named
  title: Official Baseball Rules
  publisher: Major League Baseball
  kind: rulebook
  url: https://www.mlb.com/official-information/rules-regulations
  note: >
    A league rulebook. Baseball's international federation is the WBSC, but the
    rule changes that matter to this site were made by MLB, and for forty-nine
    years its two leagues did not use the same ones.

- id: wbsc-rules
  standing: primary-named
  title: WBSC Baseball Rules
  publisher: World Baseball Softball Confederation
  kind: rulebook
  url: https://www.wbsc.org/

- id: wt-competition-rules
  standing: primary-named
  title: World Taekwondo Competition Rules
  publisher: World Taekwondo
  kind: rulebook
  url: https://www.worldtaekwondo.org/rules/
  note: >
    Revised almost every year since the electronic scoring system arrived,
    largely to keep pace with what the sensors made possible.

- id: iba-aiba-rules
  standing: secondary
  title: AIBA and IBA Technical and Competition Rules
  publisher: AIBA, later IBA
  kind: rulebook
  note: >
    The governing body that made most of the rule changes recorded here lost
    IOC recognition in 2023. Its documents remain the source for decisions
    taken while it governed, which is an unusual citation problem.

- id: world-boxing-rules
  standing: primary-named
  title: World Boxing Technical and Competition Rules
  publisher: World Boxing
  kind: rulebook
  url: https://www.worldboxing.org/
  note: Recognised by the IOC for the 2028 Games.

# ---- Fourth wave.

- id: fei-rules
  standing: primary-named
  title: FEI Rules for Equestrian Events
  publisher: Fédération Equestre Internationale
  kind: rulebook
  url: https://inside.fei.org/fei/regulations
  note: >
    Published per discipline — jumping, dressage, eventing — plus Veterinary
    Regulations, which in this sport are competition rules rather than
    administrative ones.

- id: fie-rules
  standing: primary-named
  title: FIE Technical Rules
  publisher: Fédération Internationale d'Escrime
  kind: rulebook
  url: https://fie.org/fie/documents/rules
  note: >
    The material rules and the technical rules are separate books, which
    matters here: fencing's largest changes were changes to the apparatus, not
    to the conduct of a bout.

- id: world-rowing-rules
  standing: primary-named
  title: World Rowing Rule Book
  publisher: World Rowing
  kind: rulebook
  url: https://worldrowing.com/technical/rules-regulations/
  note: >
    Contains the provision this site cares about most in any rulebook: rowing
    recognises world best times rather than world records, because a course's
    conditions cannot be standardised.

- id: world-sailing-rrs
  standing: primary-named
  title: The Racing Rules of Sailing
  publisher: World Sailing
  kind: rulebook
  url: https://www.sailing.org/inside-world-sailing/rules-regulations/
  note: Reissued every four years. Sailing instructions per event sit on top of it.

- id: randa-rules-of-golf
  standing: primary-named
  title: The Rules of Golf
  publisher: R&A and USGA
  kind: rulebook
  url: https://www.randa.org/rog
  note: >
    Two bodies jointly own one rulebook and divide the world between them —
    another variant of the ownership split football and cricket have. The World
    Handicap System is a separate document.

- id: ifsc-rules
  standing: primary-named
  title: IFSC Rules
  publisher: International Federation of Sport Climbing
  kind: rulebook
  url: https://www.ifsc-climbing.org/index.php/world-competition/rules
  note: Reissued annually, and the Olympic format has been rewritten between every Games so far.

- id: uww-rules
  standing: primary-named
  title: International Wrestling Rules
  publisher: United World Wrestling
  kind: rulebook
  url: https://uww.org/organisation/documents
  note: >
    Published separately for freestyle, Greco-Roman and women's wrestling. The
    2013 revisions were made under an explicit deadline set by the IOC.

- id: issf-rules
  standing: primary-named
  title: ISSF Official Statutes, Rules and Regulations
  publisher: International Shooting Sport Federation
  kind: rulebook
  url: https://www.issf-sports.org/theissf/rules.ashx
  note: >
    Contains the finals procedures, which the federation has rewritten more
    often than any other part of the book and which are the source of this
    sport's comparability problem.

