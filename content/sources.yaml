    Named, not opened. The 2022 Hangzhou roster here was entered from general
    reference and has not been read line by line off the OCA's own listing.

- id: iwga-world-games
  standing: primary-named
  title: The World Games sport programme
  publisher: International World Games Association
  kind: programme listing
  url: https://www.theworldgames.org/
  note: >
    Named, not opened. The 2025 Chengdu roster here was entered from general
    reference and has not been read line by line off the IWGA's own listing.

- id: ifaf-flag-rules
  standing: primary-named
  title: IFAF Flag Football Competition Rules
  publisher: International Federation of American Football
  kind: rulebook
  url: https://americanfootball.sport/

- id: wbsc-softball-rules
  standing: primary-named
  title: WBSC Softball Playing Rules
  publisher: World Baseball Softball Confederation
  kind: rulebook
  url: https://www.wbsc.org/

- id: world-skate-rules
  standing: primary-named
  title: World Skate Skateboarding Rulebook
  publisher: World Skate
  kind: rulebook
  url: https://www.worldskate.org/skateboarding/about/rulebook.html
  note: Judging criteria have been revised between every Olympic cycle so far.

- id: isa-rules
  standing: primary-named
  title: ISA Rule Book
  publisher: International Surfing Association
  kind: rulebook
  url: https://isasurf.org/about-isa/rule-book/

- id: wkf-rules
  standing: primary-named
  title: WKF Competition Rules
  publisher: World Karate Federation
  kind: rulebook
  url: https://www.wkf.net/structure-statutes-rules

- id: wdsf-breaking-rules
  standing: primary-named
  title: WDSF Breaking Competition Rules and the Trivium judging system
  publisher: World DanceSport Federation
  kind: rulebook
  url: https://www.worlddancesport.org/Rule/Athlete/Breaking
  note: >
    The Trivium system is documented separately from the competition rules and
    is the only judging system on this site invented for a single Games.

- id: world-lacrosse-rules
  standing: primary-named
  title: World Lacrosse Rules
  publisher: World Lacrosse
  kind: rulebook
  url: https://worldlacrosse.sport/about-world-lacrosse/rules/
  note: Sixes has its own rulebook, written in 2021 for Olympic inclusion.

- id: world-squash-rules
  standing: primary-named
  title: World Squash Rules of Singles Squash
  publisher: World Squash Federation
