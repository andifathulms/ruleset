# One of several programmes under content/programmes. Skeleton layer (PRD §2):
# status per edition, structured data rather than research. Rule 6 — the
# skeleton layer never borrows the deep layer's authority, and a programme
# does not borrow the authority of the one beside it in the switcher.
#
# `entered` names the editions whose rosters have actually been checked. Only
# 2022 is entered here. The earlier columns are not a record of absence.

id: asian-games
label: Asian Games
short: Asian Games
organiser: Olympic Council of Asia
blurb: >
  The largest multi-sport games after the Olympics, and the one that carries
  the most sports the Olympic programme has never held. Kabaddi, sepak takraw,
  wushu, dragon boat, kurash and esports are contested here for medals, by
  populations for which this is the pinnacle event and the Games is not.
source: oca-asian-games
standing: primary-named
caveat: >
  The 2022 Hangzhou roster was entered from general reference and has not been
  read off the OCA's own listing. Treat it as indicative of the programme's
  shape, not as a checked record of which sports were contested.
last_reviewed: 2026-09

