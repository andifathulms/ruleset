# One of several programmes under content/programmes. Skeleton layer (PRD §2):
# status per edition, structured data rather than research. Rule 6 — the
# skeleton layer never borrows the deep layer's authority, and a programme
# does not borrow the authority of the one beside it in the switcher.
#
# `entered` names the editions whose rosters have actually been checked. Only
# 2025 is entered here. The earlier columns are not a record of absence.

id: world-games
label: The World Games
short: World Games
organiser: International World Games Association
blurb: >
  The multi-sport games for sports that are not on the Olympic programme, held
  the year after each Summer Games since 1981. It is the closest thing that
  exists to a register of what the Olympic movement left out, and several
  sports have used it as a waiting room — squash was here for decades before
  being selected for 2028.
source: iwga-world-games
standing: primary-named
caveat: >
  The 2025 roster was entered from general reference and has not been read off
  the IWGA's own listing. Treat it as indicative of the programme's shape, not
  as a checked record of which sports were contested.
last_reviewed: 2026-09

entered: [2025]

editions:
  - { year: 1981, city: Santa Clara }
  - { year: 1985, city: London, note: London, Ontario. }
  - { year: 1989, city: Karlsruhe }
