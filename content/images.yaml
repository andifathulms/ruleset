- id: archery-sambodromo-2016
  sport: archery
  file: /images/archery/sambodromo-2016.jpg
  width: 1200
  height: 704
  alt: "The archery range in the Sambódromo, Rio de Janeiro, August 2016."
  shows: >
   Four years later the range went into Rio's carnival parade ground. Two
   Games in a row, the sport was staged in a landmark built for crowds and
   cameras rather than on an archery field.
  title: "Archery at Sambódromo (Rio de Janeiro, BRA) 2016.jpg"
  author: "Jorge mello ej"
  licence: "CC BY-SA 4.0"
  licence_url: "https://creativecommons.org/licenses/by-sa/4.0"
  source_url: "https://commons.wikimedia.org/wiki/File:Archery_at_Samb%C3%B3dromo_(Rio_de_Janeiro,_BRA)_2016.jpg"

- id: archery-line-cutters
  sport: archery
  file: /images/archery/line-cutters-2012.jpg
  width: 1200
  height: 800
  alt: "Officials checking line cutters at a 70-metre target, London 2012."
  shows: >
   The photographer titled it "Scoring line cutters". The one hard call in
   the sport is settled like this: people walk up to the target and look at
   the arrow where it landed.
  title: "Scoring line cutters (7745211872).jpg"
  author: "Andy Rogers"
  licence: "CC BY-SA 2.0"
  licence_url: "https://creativecommons.org/licenses/by-sa/2.0"
  source_url: "https://commons.wikimedia.org/wiki/File:Scoring_line_cutters_(7745211872).jpg"

- id: archery-korea-2012
