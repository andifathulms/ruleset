- id: air-rhon-1924-flight
  sport: air-sports
  file: /images/air-sports/rhon-1924-flight.jpg
  width: 800
  height: 564
  alt: "A glider fifty metres above the Rhön, August 1924."
  shows: >
   From the same competition; the archive's caption names the pilot as
