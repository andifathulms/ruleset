# Air sports. Placed inline in the MDX by id where a photograph belongs to one
# paragraph; `slot` only where it belongs to a structured section (the laws,
# the events) or closes a section as a whole.

- id: air-rhon-1922
  sport: air-sports
  file: /images/air-sports/rhon-1922.jpg
  width: 1200
  height: 675
  alt: "Akaflieg Berlin's glider Charlotte at the Rhön competition on the Wasserkuppe, August 1922."
  shows: >
   A student club's aircraft at one of the Wasserkuppe contests, fifteen
   years before the federation's first world gliding championships. The
   launch point is a hillside and the ground crew is whoever is standing
   nearby: competition existed before anybody governed it.
  title: "Akaflieg Berlin Charlotte Rhoen 1922.tif"
  author: "Members of Akaflieg Berlin"
  licence: "Public domain"
  licence_url: ""
  source_url: "https://commons.wikimedia.org/wiki/File:Akaflieg_Berlin_Charlotte_Rhoen_1922.tif"

- id: air-fai-medal
  sport: air-sports
  file: /images/air-sports/fai-medal-lindbergh.jpg
  width: 1200
  height: 800
  alt: "The FAI gold medal presented to Charles Lindbergh, awarded on 5 January 1928."
  shows: >
   An award rather than a ratified record, so it is evidence of the
   federation's standing and not of its certifying work: twenty-three years
   after its founding, its recognition was something to present after the
   first solo crossing of the Atlantic. Lindbergh gave the medal to the
   Missouri Historical Society in 1933.
  title: "Gold Medal From Federation Aeronautique Internationale Presented to Charles A. Lindbergh - DPLA - 37c1dc56fc6d9cc357c0ad1ff08375ce (page 1).jpg"
  author: "Missouri Historical Society (medal by Le Médaillier)"
  licence: "No known copyright restrictions"
  licence_url: ""
  source_url: "https://commons.wikimedia.org/wiki/File:Gold_Medal_From_Federation_Aeronautique_Internationale_Presented_to_Charles_A._Lindbergh_-_DPLA_-_37c1dc56fc6d9cc357c0ad1ff08375ce_(page_1).jpg"

- id: air-grunau-baby
  sport: air-sports
  file: /images/air-sports/grunau-baby.jpg
  width: 1200
  height: 798
  alt: "A Grunau Baby III in the German Gliding Museum on the Wasserkuppe."
  shows: >
   Wood, with the grain showing. The Grunau Baby was a common club glider of
   its era, and the museum dates this one 1943/52. Set beside the eta, it is
   the distance gliding equipment travelled in a lifetime.
  title: "Grunau \"Baby III\" D-4303 1943-52 Original (8666288864).jpg"
  author: "Aleksandr Markin"
  licence: "CC BY-SA 2.0"
  licence_url: "https://creativecommons.org/licenses/by-sa/2.0"
  source_url: "https://commons.wikimedia.org/wiki/File:Grunau_%22Baby_III%22_D-4303_1943-52_Original_(8666288864).jpg"

- id: air-eta
  sport: air-sports
  file: /images/air-sports/eta.jpg
  width: 1200
  height: 900
  alt: "The eta, an open-class two-seat sailplane, taxiing in 2012."
  shows: >
   Composite construction and a span of almost thirty-one metres, the
   largest sailplane built. Open class sets no limit on span, which is the
   only reason an aircraft like this has a class to compete in.
  title: "Eta (glider).jpg"
  author: "Eta-fliegen"
  licence: "CC BY-SA 3.0"
  licence_url: "https://creativecommons.org/licenses/by-sa/3.0"
  source_url: "https://commons.wikimedia.org/wiki/File:Eta_(glider).jpg"

- id: air-hang-glider
  sport: air-sports
