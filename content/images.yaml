- id: archery-beijing-range
  sport: archery
  slot: "play:field"
  file: /images/archery/beijing-2008-range.jpg
  width: 1200
  height: 891
  alt: "The Olympic Green Archery Field during the men's individual event, Beijing 2008."
  shows: >
   The field from behind the shooting line: archers in the foreground, the
   targets at the far end, the scoreboard above them. It is flat, open and
   exposed to whatever wind there is, which the sport chooses not to
   regulate.
  title: "Archery at Beijing 2008 (Olympic Green Archery Field).JPG"
  author: "Shizhao"
  licence: "CC BY-SA 3.0"
  licence_url: "https://creativecommons.org/licenses/by-sa/3.0"
  source_url: "https://commons.wikimedia.org/wiki/File:Archery_at_Beijing_2008_(Olympic_Green_Archery_Field).JPG"

