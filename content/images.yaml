# Images used on this site, and what each one is evidence of.
#
# Every entry is a citation in the same sense as sources.yaml: it names the
# author, the licence, and the page it came from, and its `shows` line says
# what the photograph is actually evidence of. A photograph of a person is
# evidence of the person, not of the rule change beside it, and the captions
# are written to say so rather than let the placement imply otherwise.

- id: athletics
  sport: athletics
  slot: series
  file: /images/athletics.jpg
  width: 540
  height: 788
  alt: "Uwe Hohn in 1984, the year he threw 104.80 m."
  shows: >
   A portrait of the thrower, not of the throw. The record it refers to was
   set on 20 July 1984 in Berlin; two years later the implement was
   redesigned and the list restarted, which is why this mark has no
   successor.
  title: "Bundesarchiv Bild 183-1984-0603-003, Uwe Hohn.jpg"
  author: "Wolfgang Kluge"
  licence: "CC BY-SA 3.0 de"
  licence_url: "https://creativecommons.org/licenses/by-sa/3.0/de/deed.en"
  source_url: "https://commons.wikimedia.org/wiki/File:Bundesarchiv_Bild_183-1984-0603-003,_Uwe_Hohn.jpg"

