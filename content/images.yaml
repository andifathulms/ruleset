- id: air-canopy-swoop
  sport: air-sports
  file: /images/air-sports/canopy-swoop.jpg
  width: 1200
  height: 800
  alt: "A canopy pilot skimming a pond, January 2008."
  shows: >
   A ram-air canopy is a wing, and this is what that makes possible: a
   descent turned into a fast, flat pass over water, which is canopy piloting
   in miniature. The spectators on the far bank are the reason it is one of
   the disciplines the World Games carries.
  title: "Swoop (2178757373).jpg"
  author: "Oskari Kettunen"
  licence: "CC BY 2.0"
  licence_url: "https://creativecommons.org/licenses/by/2.0"
  source_url: "https://commons.wikimedia.org/wiki/File:Swoop_(2178757373).jpg"

- id: air-racing-drone
  sport: air-sports
  file: /images/air-sports/racing-drone.jpg
