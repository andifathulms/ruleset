- id: air-ridge-soaring
  sport: air-sports
  slot: "play:field"
  file: /images/air-sports/ridge-soaring.jpg
  width: 1200
  height: 899
  alt: "A DG-505 two-seater ridge soaring in Pennsylvania, 2007."
  shows: >
   The field of play made visible. Wind meeting the ridge is forced upward,
   and the glider holds itself in that band of rising air just above the
   trees — lift that exists only while the wind blows from the right
   direction.
