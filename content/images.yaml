- id: air-wave-pyrenees
  sport: air-sports
  file: /images/air-sports/wave-pyrenees.jpg
  width: 1200
  height: 900
  alt: "Mountain wave cloud over the Pyrenees, photographed from a glider at 5,320 m."
  shows: >
   Wind crossing a range sets up standing waves in the air downwind, and a
   glider that finds one can climb far above the peaks and run along it.
   This is the Pyrenees, not the Andes where the great distance records are
   flown, but it is the same air — and the reason the record book follows
   the mountains.
  title: "Moazagotl sur les Pyrénées.jpg"
  author: "Robert Prat"
  licence: "CC BY-SA 4.0"
  licence_url: "https://creativecommons.org/licenses/by-sa/4.0"
  source_url: "https://commons.wikimedia.org/wiki/File:Moazagotl_sur_les_Pyr%C3%A9n%C3%A9es.jpg"

- id: air-barograph
  sport: air-sports
  file: /images/air-sports/barograph-1930.jpg
  width: 1200
  height: 883
  alt: "A French barograph of 1930, in the National Air and Space Museum."
  shows: >
   A clockwork drum turning under a pen moved by air pressure, so the trace
   it leaves is height against time. Instruments of this kind were how a
   pilot proved a climb, or that they had not landed on the way, before the
   GPS logger replaced them.
  title: "Barograph (France, 1930).jpg"
  author: "Votpuske"
  licence: "CC BY 4.0"
  licence_url: "https://creativecommons.org/licenses/by/4.0"
  source_url: "https://commons.wikimedia.org/wiki/File:Barograph_(France,_1930).jpg"

- id: air-accuracy-landing
  sport: air-sports
  file: /images/air-sports/accuracy-landing.jpg
  width: 900
  height: 1200
  alt: "Accuracy landing at the Skydive World Cup Series, Belluno, 2025."
  shows: >
   A competitor on final approach to the target pad in the middle of the
   field. The first point of contact is measured electronically from its
   centre, which is why this is among the least disputable results the
   federation produces.
