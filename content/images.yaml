- id: air-rhon-1924-crowd
  sport: air-sports
  file: /images/air-sports/rhon-1924-crowd.jpg
  width: 800
  height: 557
  alt: "The launch site at the Rhön gliding competition, August 1924."
  shows: >
   The archive's original caption remarks on the colossal crowd. In 1924
   gliders were launched off the hill in front of it; once pilots learned to
   soar away across country, the contest left its audience behind.
  title: "Bundesarchiv Bild 102-00625, Rhön, Segelflug-Wettbewerbe.jpg"
  author: "Bundesarchiv, Bild 102-00625 (photographer unknown)"
  licence: "CC BY-SA 3.0 de"
