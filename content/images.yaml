- id: archery-field
  sport: archery
  slot: events
  file: /images/archery/field-archery.jpg
  width: 1200
  height: 803
  alt: "A field archer at the Yorkshire Field Archery Championships, 2008."
  shows: >
   The target is in woodland, at a distance the archer has to judge. Field
   archery keeps the ring and the arrow but drops the flat, measured range
   that the Olympic discipline is built on.
  title: "Field archery freestyle recurve.jpg"
  author: "Mr Barndoor"
  licence: "CC BY 3.0"
  licence_url: "https://creativecommons.org/licenses/by/3.0"
  source_url: "https://commons.wikimedia.org/wiki/File:Field_archery_freestyle_recurve.jpg"
