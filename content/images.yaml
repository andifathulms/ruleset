- id: air-top-of-atmosphere
  sport: air-sports
  slot: contested
  file: /images/air-sports/top-of-atmosphere.jpg
  width: 1200
  height: 797
  alt: "The top of the atmosphere, photographed from the International Space Station in 2006."
  shows: >
   The station orbits far above the 100-kilometre line, and nothing in the
   picture marks where that line falls: the atmosphere thins out rather than
   ending. That is why a boundary had to be defined at all, and why defining
   it fell to the body that certifies records on either side of it.
  title: "Top of Atmosphere.jpg"
  author: "NASA Earth Observatory"
  licence: "Public domain"
  licence_url: ""
  source_url: "https://commons.wikimedia.org/wiki/File:Top_of_Atmosphere.jpg"

# Archery.

- id: archery-morella
