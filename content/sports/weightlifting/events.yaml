sport: weightlifting
as_of: 2026-09
source: iwf-technical-rules
standing: primary-named
summary: >
  Bodyweight categories, and the number of them has been cut repeatedly. The
  entry worth noticing is that the categories contested at the Games and the
  categories in which world records are recognised are no longer the same set,
  so a lifter can hold a world record in a division that is not on the
  programme.
disciplines:
  - id: olympic
    label: Contested at the Games
    blurb: Five categories per sex from 2024, reduced from seven and before that from eight.
    events:
      - { id: m, label: "Men's categories", at: [olympic], count: 5 }
      - { id: w, label: "Women's categories", at: [olympic], count: 5 }
  - id: records
    label: Categories recognised for world records
    counts: false
    blurb: >
      A larger set than the Olympic programme uses. Records exist in divisions
      nobody can win a medal in.
    events:
      - { id: rm, label: "Men's record categories", context: true }
      - { id: rw, label: "Women's record categories", context: true }
  - id: lifts
    label: The lifts themselves
    counts: false
    events:
      - { id: snatch, label: Snatch, context: true }
      - { id: cj, label: Clean and jerk, context: true }
      - { id: press, label: Clean and press, note: "Contested until 1972. Removed because it could not be judged consistently.", context: true }
