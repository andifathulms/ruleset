summary: >
  No federation on this site has destroyed its own record book as
  comprehensively or as often. Weightlifting abolished one of its three lifts
  in 1972, redrew its bodyweight categories in 1993 and annulled every world
  record in the sport, and did the same again in 2018. Three total resets in
  fifty years — and unlike the javelin or the supersuits, the second and third
  had nothing to do with equipment.
