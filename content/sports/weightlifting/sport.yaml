summary: >
  A lifter stands alone on a four-metre platform and lifts a barbell from the
  floor to overhead. There are two lifts. In the snatch the bar goes up in one
  movement. In the clean and jerk it goes to the shoulders first and then
  overhead. Each lifter has three attempts at each lift, and the weight on the
  bar can never go down. The best snatch and the best clean and jerk are added
  into a total, and the highest total in a bodyweight category wins. Three
  referees judge how the bar was lifted, so a heavy lift done the wrong way
  counts for nothing.
