sport: baseball
as_of: 2026-09
source: wbsc-rules
standing: primary-named
summary: >
  One Olympic event, and an unusually complicated relationship between the
  sport's international governing body and the competition that actually
  matters. Baseball and softball are administered together by the WBSC and
  appear on the programme together, which is the only case on this site of two
  distinct sports sharing one Olympic listing.
disciplines:
  - id: olympic
    label: On the 2028 programme
    events:
      - { id: baseball, label: "Baseball, men's tournament", at: [olympic] }
      - { id: softball, label: "Softball, women's tournament", at: [olympic], note: "A separate sport under the same federation and the same Olympic listing." }
  - id: professional
    label: Where the sport is actually played
    counts: false
    blurb: >
      Listed because the rule changes recorded on this page were made by a
      league rather than by a federation, which is the same situation as
      basketball's and more extreme.
    events:
      - { id: mlb, label: Major League Baseball, note: "Made every rule change on this page. Two leagues under different batting rules from 1973 to 2022.", at: [professional] }
      - { id: npb, label: Nippon Professional Baseball, at: [professional] }
      - { id: kbo, label: KBO League, at: [professional] }
      - { id: wbc, label: World Baseball Classic, note: The international tournament that draws the professional players., at: [world-championship] }
