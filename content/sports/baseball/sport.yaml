summary: >
  Baseball is played by two teams of nine on a field built around a square of
  four bases. One team bats while the other fields, and they swap after three
  outs. A pitcher throws the ball to a batter, who tries to hit it and run from
  base to base. A runner who gets all the way round to home scores one run.
  Each team bats nine times, and the team with more runs wins. The game has no
  clock and no draw, so it goes on until one team is ahead. The heart of it is
  one pitcher against one batter, again and again.
