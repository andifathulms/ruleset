summary: >
  A shooter stands still at a firing point and tries to put every shot in the
  centre of a target. In rifle and pistol events the target is fixed and has
  ten rings. In shotgun events it is a clay disc thrown into the air.
  Electronic targets measure each rifle or pistol shot to a tenth of a ring.
  A competition has two parts. In qualification every shooter fires a long
  series of shots and the leaders go through. The final then starts again from
  zero, and shooters drop out one at a time until two are left to shoot for
  gold. No shooter can affect another's shot. The whole skill is to stay still
  and repeat the same action under pressure.
