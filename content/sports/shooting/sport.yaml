id: shooting
label: Shooting
tagline: Threw away the qualification score before every final, so the sport's own results stop counting at the moment they matter most.
governing_body: International Shooting Sport Federation
founded: International Shooting Union founded 1907; ISSF in its present form from 1998.
coverage: deep
family_colour: pool
classification:
  official: shooting
  game-category: target
  adjudication: measured
summary: >
  Shooting is the most precisely measured sport on this site — scores to a
  tenth of a ring, decided by where a hole is — and it has spent thirty years
  making those numbers matter less. Finals were added in 1988 with the
  qualification score carried forward, changed in 2013 so finals start from
  zero, and rebuilt as elimination formats after that. The measurement got more
  precise as the competition got further from it.
