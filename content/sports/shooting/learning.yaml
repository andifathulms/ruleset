sport: shooting
standing: editorial
summary: >
  A sport where a beginner can produce a respectable score in an afternoon and
  the difference at the top is measured in tenths of a ring — and where the
  competition format has been rearranged three times so that those tenths
  matter less to the result.

entry:
  verdict: moderate
  claim: A club and supervision. The physical demand is close to zero; the legal one is not.
  why: >
    Shooting asks almost nothing physically. There is no strength, speed or
    endurance requirement of any consequence, and it is one of very few sports
    here where age, size and physical condition are largely irrelevant — which
    is why it has one of the widest age ranges in Olympic competition.

    The barriers are legal and institutional. Firearms are regulated, ranges
    are supervised facilities, and in many countries participation requires
    licensing and club membership before a beginner can hold a rifle. That is
    a genuine barrier and it varies enormously by country in a way no other
    sport's does.

    Air events lower it substantially — 10 m, indoors, low-powered — and are
    the route most competitors take in.
