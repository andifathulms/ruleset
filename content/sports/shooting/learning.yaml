    - { label: Physical requirement, value: Minimal, basis: judgement }
    - { label: Facility, value: A supervised range, basis: observation }
    - { label: Legal barrier, value: Varies by country, basis: observation, note: The only sport here whose entry depends on national firearms law. }
    - { label: Kit to start, value: Club equipment, basis: observation }
