summary: >
  A boat tows one competitor at a time across still water on a rope that does
  not stretch. In slalom the skier swings from side to side round six buoys.
  Each time they finish a pass the boat goes faster, and then the rope gets
  shorter, until they miss. In tricks the skier scores points for moves made
  in two passes of twenty seconds. In jump the skier leaves a ramp and is
  measured for distance. Wakeboarders ride one board sideways and are judged
  on tricks thrown off the boat's wake. Riders can also be towed by an overhead
  cable, with no boat at all. Behind a boat, the driver matters: the boat must
  hold an exact line and speed, or the pass does not count.
