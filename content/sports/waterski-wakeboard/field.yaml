# The slalom course, from the measurements in play.yaml. The course is 259 m
# long and only 23 m wide, so the length is compressed here: the drawing is
# schematic, and the page says so.
sport: waterski-wakeboard
title: Six buoys and a straight line
caption: >
  The slalom course. The boat drives straight down the middle. The skier
  swings from side to side and must pass round the outside of all six buoys.
  The shaded strip is as far as a 10.75 metre rope can reach to each side.
  The buoys lie outside it, so at that rope length the skier has to lean and
  stretch beyond the rope to get round them.
alt: >
  A long slalom course with the boat's straight path down the middle and six
  buoys set alternately on either side of it, 11.5 metres out, with a zigzag
  line showing the skier's path round them.
scale: schematic
view: [-9, -19, 74, 21]
