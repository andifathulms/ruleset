    - { label: Cable towing, value: No boat, no driver, session pricing, basis: rule, rule: waterski-1961-cable, note: The sport's accessibility answer. }
    - { label: Time to be towed upright, value: One session, basis: judgement }
    - { label: Water per competitor, value: The whole course, basis: observation }
    - { label: Time to a first tournament, value: A season, basis: judgement }

mastery:
  verdict: very-high
  claim: Reaching a buoy the rope is too short to reach, on a run that ends at the first mistake.
  why: >
    Slalom at the top is one of the strangest technical problems in sport.
    Beyond a certain shortening, the rope is literally shorter than the
    distance from the boat's path to the buoy — so the skier cannot be pulled
    to it. They have to generate so much angle and speed across the wake that
    their body swings wider than the rope's length permits, arriving at the
    buoy on momentum they created.

    Getting it wrong ends the run. There is no second attempt and no way to
    recover a missed buoy, so a season's form is expressed in a few seconds.

    **Tricks** requires a memorised, sequenced routine of scored manoeuvres
    executed inside two twenty-second passes, with each trick counting once —
    so a repeated trick is a wasted second.

    **Jump** is the highest-risk discipline in the federation, and elite jumpers
    travel distances that make the landing the difficulty rather than the
    flight.

    And through all of it, the boat. A driver a fraction off line or speed
    changes what the athlete is being asked to do, and the athlete has no
    control over that at all.
