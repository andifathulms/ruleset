sport: waterski-wakeboard
standing: editorial
summary: >
  Getting up on skis takes an afternoon; competing needs a boat, a driver, a
  stretch of private water and a season's fuel. It is one of the most
  facility-bound sports on this site, and cable parks are its answer to that.

entry:
  verdict: high
  claim: A boat, a driver, still water and fuel — unless there is a cable park nearby, in which case an afternoon.
  why: >
    The physical skill is not the barrier. Most people can be towed upright
    within a session, and wakeboarding is easier to start than skiing because
    both feet are fixed to one board.

    The barrier is everything around it. Tournament skiing needs a boat with
    approved speed control, someone qualified to drive it, a surveyed course on
    still water, and fuel — and each skier occupies the whole lake for the
    duration of their run. That is a facility and cost profile closer to
    equestrian or sailing than to anything else here.

    **Cable parks change the arithmetic completely.** An overhead cable tows
    riders continuously around a lake with no boat, no driver and no fuel, at a
    session price comparable to a lift pass. Where a cable park exists, the
    sport's entry barrier collapses — and cable riding has grown into its own
    competitive discipline as a result.
