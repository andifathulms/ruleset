gap: >
  High to very high, and this is one of the few sports here whose entry barrier
  is genuinely close to its ceiling in cost terms.

  Most sports on this site are cheap to start and expensive to pursue.
  Tournament water skiing is expensive to start, because the boat, the driver
  and the water are required before anybody does anything, and a beginner
  consumes the same resources as a champion.

  The cable park is the sport's own answer, and it is the same shape of answer
  that drone racing gave air sports: when the vehicle became cheap and the
  operator was no longer required, the barrier collapsed and a new competitive
  discipline grew inside the same federation.

  The other distinctive thing is the driver. Sailing has conditions nobody
  controls and equestrian has a partner with its own mind, but this is the only
  sport covered here where a competitor's score depends on the precision of a
  person who is not competing, judged separately, and able to void the run.

