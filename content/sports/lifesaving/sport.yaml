summary: >
  Every lifesaving event is one part of a rescue, made into a race. In the
  pool, competitors swim under obstacles, dive for a manikin on the bottom and
  carry or tow it to the wall. On a surf beach they race by swimming, on
  rescue boards and on surf skis, and sprint for batons buried in the sand.
  The fastest time wins, but only if the rescue was done properly. A manikin
  carried with its face under the water means disqualification, however fast
  the swim was.
