summary: >
  A fleet of identical boats starts together and sails around a course marked
  by buoys, which is laid out fresh for the wind of the day. Nobody records a
  time. A boat scores its finishing place, one point for first and two for
  second, and the lowest total over about ten races wins. Each boat drops its
  worst race, and the top ten then sail a final medal race that counts double.
  When boats meet, right-of-way rules taken from ordinary seamanship say which
  one must keep clear. The skill is in reading wind that no one can control.
