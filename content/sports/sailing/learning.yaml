sport: sailing
standing: editorial
summary: >
  Two barriers, both structural. You need water and a boat, which is expensive
  and geographically fixed. And you need to learn a right-of-way code before you
  can race safely, which is a rulebook problem more than a physical one — the
  same shape as fencing's priority, and about as hard to see from outside.

entry:
  verdict: high
  claim: A boat, water, a club, and a collision-avoidance code you must know before you start.
  why: >
    Sailing cannot be improvised and cannot be self-taught safely. Boats are
    expensive, need storage on or near water, and racing puts several of them
    on converging courses at speed — which is why the rulebook is mostly about
    who must keep clear of whom.

    Club dinghy sailing genuinely lowers this: shared boats, sheltered water,
    and a beginner racing within a season. But the access question is
    geographic and absolute in the way rowing's is. No suitable water, no sport.

    The rules are the other half. A beginner must understand port and starboard,
    windward and leeward, and mark-rounding rights before they can race without
    being a hazard, and none of it is visible to a spectator.
  evidence:
    - { label: Facility, value: Water and a club, basis: observation }
    - { label: Kit to start, value: A club dinghy, basis: observation, note: Individually, a boat is among the most expensive equipment on this site. }
    - { label: Rules to learn first, value: Right of way, basis: observation }
    - { label: Time to first race, value: A season, basis: judgement }

mastery:
  verdict: very-high
  claim: Reading water and wind that nobody controls, in a boat that may not exist next cycle.
  why: >
    Elite sailing is a perception problem before a physical one. The decisive
    skill is reading the water for wind that has not arrived yet and choosing a
    side of the course accordingly, and it is close to invisible from outside
    the boat. The physical demands are real and class-dependent, and foiling
    classes have raised them sharply.

    What is distinctive here is the instability of the event itself. Olympic
    classes are reselected between cycles: a sailor may spend a decade
    specialising in a boat and find the event removed. Judo removed techniques,
    weightlifting redrew categories, modern pentathlon deleted a discipline —
    sailing changes the equipment its events are defined by, on a schedule, as
    a matter of routine.

    And the medal race concentrates the luck the whole format exists to spread
    out, in the one race where a medal is decided.
