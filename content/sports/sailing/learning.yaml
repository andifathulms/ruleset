gap: >
  Sailing is high at both ends and the reasons are money, water and a rulebook
  you must learn before you can participate safely.

  Its interest on this board is what it shares with rowing and how it differs.
  Both face conditions nobody controls. Rowing kept timing its races and
  refused to call the times records. Sailing stopped producing times at all and
  built a scoring system — aggregate the positions, discard the worst — that is
  a century-old statement that its results are noisy and must be averaged.

  Then in 2008 it doubled the points of the final race for broadcast, which
  undoes a good deal of that. It is the clearest case on this site of a
  federation contradicting its own epistemics for a camera, and the sailors
  have said so continuously ever since.

