id: cheerleading
label: Cheerleading
tagline: "Invented to support other sports and became one — and it began as an all-male activity before the war reversed it."
governing_body: International Cheer Union
founded: >
  Organised cheering dates from American universities in the 1890s; the
  International Cheer Union was formed in 2004 and received full IOC
  recognition in 2021.
coverage: deep
family_colour: gold
classification:
  official: cheerleading
  game-category: outside-taxonomy
  adjudication: judged
summary: >
  A judged team sport of stunts, pyramids, tosses and tumbling, performed to a
  routine of about two and a half minutes. It is the only sport covered here
  that was created to be an audience for something else, and one of very few
  whose participation flipped from almost entirely male to overwhelmingly
  female. Its safety rules exist because throwing people into the air produces
  one of the highest catastrophic injury rates in any sport.
