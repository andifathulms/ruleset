summary: >
  A cheerleading team performs one routine of about two and a half minutes on
  a matted floor. In the Cheer division the routine is made of stunts,
  pyramids, tosses and tumbling: some athletes lift and throw, others are
  lifted and thrown, and others stand ready to catch. Judges mark how
  difficult the skills were and how cleanly they were done, and take marks
  off for falls and for breaking the safety rules. Nobody wears protective
  equipment, so the rules limit what each age and level may attempt. The
  second division, Performance Cheer, is dance with no stunts.
