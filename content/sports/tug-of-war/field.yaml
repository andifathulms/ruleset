# The rope and its marks, from the measurements in play.yaml. Shapes are in metres.
sport: tug-of-war
title: The rope, its marks and the line
caption: >
  The rope has a centre mark and a side mark four metres either side of it.
  At the start the centre mark sits over a line on the ground. A team wins the
  end when it has pulled its opponents' side mark to that line. The dots show
  eight pullers a side with the anchor last. Where each puller stands is for
  illustration only.
alt: >
  A rope at least 33.5 metres long, with a mark at its centre over a line on
  the ground and a mark four metres to each side. Eight pullers hold each half
  of the rope, with the anchor at the end.
scale: to-scale
view: [-19.5, -5.2, 19.5, 6]
