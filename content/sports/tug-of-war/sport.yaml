summary: >
  Eight people take one end of a rope and eight take the other. On the
  judge's call both teams pull, and the team that drags the other four metres
  wins the end. A match is the best of three ends. There are no points and no
  clock. Players may touch the ground only with their feet, so they may not
  sit down or lock the rope against the body, and a judge watches for this
  through the whole pull. Teams are grouped by the combined weight of all
  eight members. The sport is played outdoors on grass and indoors on a mat.
