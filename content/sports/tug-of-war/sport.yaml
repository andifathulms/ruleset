id: tug-of-war
label: Tug of war
tagline: "Thrown off the Olympic programme in the 1920s and a fixture of the World Games since it began — the clearest case here of a sport outliving its expulsion."
governing_body: Tug of War International Federation
founded: >
  Ancient as a contest and codified by British athletics bodies in the
  nineteenth century; the Tug of War International Federation was formed in
  1960.
coverage: deep
family_colour: pool
classification:
  official: tug-of-war
  game-category: outside-taxonomy
  adjudication: decided-by-score
summary: >
  Eight people pull a rope four metres and the other eight try to stop them.
  It was on the Olympic programme for five consecutive Games and was cut in the
  1920s, and it is the only sport this site covers that has been a fixture of
  the World Games since the first one in 1981. Its distinctive rule is that
  teams are classified by combined weight rather than by individual weight,
  which makes team selection a constrained arithmetic problem no other sport has.
