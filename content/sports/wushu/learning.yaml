sport: wushu
standing: editorial
summary: >
  Two sports with two different curves. Taolu is a gymnastic discipline that
  must be started in childhood; sanda is a striking sport an adult can take up.
  Both sit at the top of a national system that produces most of the winners.

entry:
  verdict: moderate
  claim: Clubs exist worldwide, but competitive taolu is a childhood sport and you cannot start it at twenty.
  why: >
    Recreational wushu is widely available — Chinese community schools, martial
    arts clubs and university societies teach it across most of the world — and
    the equipment is a uniform and, eventually, a competition weapon.

    But the two disciplines diverge immediately. **Sanda** is enterable as an
    adult: it is a striking sport with throws, and someone with a combat
    background can compete in a couple of years.

    **Taolu** cannot realistically be started late. It requires gymnastic
    flexibility, aerial rotation and landing control of a kind that is
    developed in childhood or not at all, and the difficulty elements a
    competitive routine now declares are beyond an adult beginner's reach. In
    China the pathway runs through specialist sports schools from a young age.
