    - { label: Taolu, value: Requires a childhood gymnastic base, basis: rule, rule: wushu-nandu-scoring }
    - { label: Sanda, value: Enterable as an adult, basis: observation }
    - { label: Clubs, value: Widely available worldwide, basis: observation }
    - { label: Time to a first competition, value: A year for sanda; years for taolu, basis: judgement }

mastery:
  verdict: very-high
  claim: Declared aerial difficulty judged on landing, or a fight where the edge of the platform is a weapon.
  why: >
    **Taolu** at the top is a gymnastic discipline in martial dress. Since the
    difficulty component was introduced, athletes declare jumps with high
    rotation counts and prescribed landings, and a routine is marked on
    delivering them cleanly on the first and only attempt, inside a time window,
    with a weapon in hand for half the events. The failure modes are the same as
    gymnastics' — a landing that travels, a rotation short of its count — and
    there is no second run.

    **Sanda** adds to an ordinary striking-and-throwing sport a spatial problem
    nothing else here has. The platform is 8 metres square with no ropes, its
    edge scores, and two exits in a round lose it. So a sanda fighter is
    managing distance against an opponent and against a drop, and the best of
    them use the edge deliberately.

    Above both sits the Chinese system. Specialist sports schools, full-time
    training from childhood and a very deep domestic field mean the world
    standard is set by one country, and international competition is largely a
    contest for the places China does not take.
