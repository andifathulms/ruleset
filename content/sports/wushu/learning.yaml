gap: >
  Moderate to very high, and the sport is really two curves reported as one.

  Sanda's shape is ordinary for a combat sport: accessible in adulthood, hard at
  the top, with a distinctive spatial rule. Taolu's is gymnastics' shape — a
  childhood entry window, a declared-difficulty scoring system, and a ceiling
  set by aerial skill on a single attempt.

  What they share is the institutional half. Wushu was designed by a state,
  is taught through that state's specialist school system, and its elite
  standard is set there. A country that wants to compete has to build a
  comparable pathway or accept a ceiling, which is a more explicit version of
  the concentration this site records for kabaddi in India and sepak takraw in
  Thailand.

