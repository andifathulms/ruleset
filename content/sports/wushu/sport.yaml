summary: >
  Wushu is contested in two ways that have little in common. In taolu, one
  athlete performs a routine on a carpet, barehanded or with a sword, a staff
  or a spear. Judges mark the quality of the movements, the difficult jumps
  the athlete declared in advance, and the performance as a whole. The highest
  score wins. In sanda, two fighters in the same weight category punch, kick
  and throw each other on a raised platform with no ropes. Pushing or throwing
  the opponent off the platform scores, and the first fighter to win two
  rounds wins the bout.
