summary: >
  Two wrestlers wearing only a heavy belt crouch facing each other in a ring
  of clay 4.55 metres across. They charge at the same moment, with no signal
  from the referee. A wrestler loses by touching the ground with anything
  except the soles of the feet, or by touching anything outside the ring.
  There are no rounds, no points and no time limit, and most bouts are over
  in under ten seconds. The ring is too small to retreat in, so a bout is one
  collision, settled by weight, balance and a grip on the belt.
