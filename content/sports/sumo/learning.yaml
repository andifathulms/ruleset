gap: >
  Low to very high, and the sport is the site's clearest case of a gap that is
  institutional rather than technical.

  Nothing about sumo's laws is hard to learn, and amateur sumo is one of the
  more welcoming competitive structures covered here — weight classes, women's
  divisions, and clubs that will put a beginner in a ring on day one. The
  ceiling is high because the top of the sport is a closed Japanese
  professional system with an age limit, a residential apprenticeship, and no
  weight classes to protect anybody.

  Compare it with judo, elsewhere on this site: a Japanese combat sport that
  internationalised so completely that its Olympic competition is unambiguously
  its highest level, and whose weight classes have been redrawn repeatedly.
  Sumo kept its apex at home. The World Games event is real sumo and it is not
  the best sumo, and no athlete outside Japan can change that by training
  harder.

