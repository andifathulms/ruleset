mastery:
  verdict: very-high
  claim: A closed professional system entered in your teens, with no weight classes and a body built to suit.
  why: >
    Professional sumo is a career decided very early. Recruits enter a stable
    in their teens, live in it, and progress through a ranking ladder that
    determines everything about their life including whether they are paid at
    all — the lower divisions are effectively unpaid apprenticeships. The
    entry age limit means the door closes in the early twenties.

    The absence of weight classes shapes the athlete more than any rule on this
    site. Mass is a direct competitive advantage in a 4.55-metre ring, so
    wrestlers eat and train to be enormous, and the sport's known health
    outcomes — diabetes, joint failure, shortened life expectancy — follow from
    a competitive structure that rewards it.

    Technically the ceiling is higher than the two-second bouts suggest. The
    tachi-ai — the initial collision, timed by mutual consent rather than a
    signal — decides a large share of professional bouts before any technique
    is applied, and reading it is a craft.

    And the international competition a foreign athlete can reach is not the
    top of the sport. The best wrestlers in the world are in the Japanese
    professional system and do not enter the world championships.
