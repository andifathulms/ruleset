sport: sumo
standing: editorial
summary: >
  The rules take thirty seconds to learn and amateur clubs will take anyone.
  The professional sport is one of the most closed and physically punishing
  careers in any sport on this site, and you cannot enter it after about
  twenty-three.

entry:
  verdict: low
  claim: Two rules, a ring drawn on the ground, and amateur clubs with weight classes for everyone.
  why: >
    Sumo's laws are the simplest of any combat sport here — touch the ground or
    leave the ring and you have lost — so a beginner understands what is
    happening immediately, which is not true of judo scoring or of a boxing
    decision.

    Amateur sumo, as governed internationally, is genuinely open: weight
    classes from lightweight upwards, men's and women's divisions, university
    and club structures in Japan, Mongolia, Brazil, Eastern Europe and the
    United States. A person of ordinary size can compete properly rather than
    being a novelty.

    Bouts last seconds, so a beginner's first session involves a large number
    of complete contests rather than one exhausting round.

    It is low rather than very low because the sport needs a proper ring and a
    club, and there are not many outside Japan.
