summary: >
  A gymnast builds a routine from elements listed in the Code of Points, the
  sport's rulebook, and performs it once. Men compete on six apparatus and
  women on four. Two panels of judges score every routine. One adds up the
  difficulty of what was performed, and that number has no upper limit. The
  other starts from 10 and takes points off for faults in form, control and
  landing. The two numbers are added and the highest total wins. Almost
  nothing is forbidden outright: nearly every mistake has a price in points.
