sport: gymnastics
as_of: 2026-09
source: fig-code-of-points
standing: primary-named
summary: >
  Three Olympic disciplines under one federation, and they share a scoring
  philosophy rather than any apparatus. Artistic is split into men's and
  women's programmes that have four apparatus in common between them only in
  the loosest sense — vault and floor — and are otherwise different sports.
disciplines:
  - id: artistic-men
    label: "Artistic, men"
    blurb: Six apparatus, plus the all-around and the team event.
    events:
      - { id: m-team, label: Team all-around, at: [olympic] }
      - { id: m-aa, label: Individual all-around, at: [olympic] }
      - { id: m-floor, label: Floor exercise, at: [olympic] }
      - { id: m-pommel, label: Pommel horse, at: [olympic] }
      - { id: m-rings, label: Rings, at: [olympic] }
      - { id: m-vault, label: Vault, at: [olympic] }
      - { id: m-pbars, label: Parallel bars, at: [olympic] }
      - { id: m-hbar, label: Horizontal bar, at: [olympic] }
  - id: artistic-women
    label: "Artistic, women"
    blurb: Four apparatus, plus the all-around and the team event.
    events:
      - { id: w-team, label: Team all-around, at: [olympic] }
      - { id: w-aa, label: Individual all-around, at: [olympic] }
      - { id: w-vault, label: Vault, at: [olympic] }
      - { id: w-ubars, label: Uneven bars, at: [olympic] }
      - { id: w-beam, label: Balance beam, at: [olympic] }
      - { id: w-floor, label: Floor exercise, at: [olympic] }
  - id: rhythmic
    label: Rhythmic
    blurb: Women only on the Olympic programme, with hand apparatus.
    events:
      - { id: r-aa, label: Individual all-around, at: [olympic] }
      - { id: r-group, label: Group all-around, at: [olympic] }
  - id: trampoline
    label: Trampoline
    events:
      - { id: t-men, label: "Men's individual", at: [olympic] }
      - { id: t-women, label: "Women's individual", at: [olympic] }
  - id: non-olympic
    label: Contested by the federation but not at the Games
    counts: false
    blurb: >
      The FIG also governs disciplines that have never been on the Olympic
      programme, which is why its rulebook is larger than the Games suggests.
    events:
      - { id: acro, label: Acrobatic gymnastics, at: [world-championship, world-games] }
      - { id: aerobic, label: Aerobic gymnastics, at: [world-championship, world-games] }
      - { id: parkour, label: Parkour, at: [world-championship, world-games] }
