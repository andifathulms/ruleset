sport: korfball
standing: editorial
summary: >
  Very easy to start — no contact, no dribble, one point per goal — and
  deceptively hard at the top, because a sport that has banned every physical
  way of winning the ball leaves only the hard way.

entry:
  verdict: very-low
  claim: A ball, a post and eight people. Nothing about it hurts and there is no dribble to master.
  why: >
    Korfball removes almost every skill barrier a beginner meets in an invasion
    sport. There is no dribble, so the ball-handling requirement is catching
    and passing. There is no contact, so a beginner is never physically
    overwhelmed. Every goal is worth one, so there is nothing tactical to learn
    before you can play.

    It was designed for a school class in 1902 and it still behaves like it:
    mixed ability, mixed sex and mixed age teams work, and the same-sex
    defending rule means a beginner is matched against someone comparable
    rather than against whoever is biggest.

    The barrier is finding a game. Outside the Netherlands and Belgium, clubs
    are scarce.
