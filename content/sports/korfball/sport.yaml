id: korfball
label: Korfball
tagline: "The only team sport whose laws require men and women on the same court, and the only one where you may not shoot when you are being defended."
governing_body: International Korfball Federation
founded: >
  Devised in Amsterdam in 1902 by the schoolteacher Nico Broekhuysen; the
  International Korfball Federation followed in 1933.
coverage: deep
family_colour: pitch
classification:
  official: korfball
  game-category: invasion
  adjudication: decided-by-score
summary: >
  Korfball was written in 1902 to be played by boys and girls together, and
  every distinctive law follows from holding that requirement rather than from
  the game itself. You may only defend an opponent of your own sex. You may not
  shoot when a defender has you covered. There is no dribbling and no physical
  contact — because a code that permits either stops being playable by a mixed
  team on equal terms. It has never been on the Olympic programme, and has
  been on the World Games one since the 1980s.
