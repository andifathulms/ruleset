summary: >
  Korfball is played by two teams of eight, four women and four men each. The
  court is divided into two zones. Half of each team attacks in one zone and
  the other half defends in the other, and they change roles after every two
  goals. Players pass the ball and try to throw it through the korf, a
  basket with no bottom and no backboard on a post 3.5 metres high. A player
  may not run with the ball, bounce it, or touch an opponent, and may only
  defend an opponent of the same sex. A player who is closely defended may
  not shoot, so the whole game is a search for a free shot.
