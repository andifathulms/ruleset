label: Korfball
tagline: "Two mixed teams of four women and four men pass a ball and shoot at a basket on a tall post, with no dribbling, no contact and no shot while a defender has you covered."
governing_body: International Korfball Federation
founded: >
  Devised in Amsterdam in 1902 by the schoolteacher Nico Broekhuysen; the
  International Korfball Federation followed in 1933.
