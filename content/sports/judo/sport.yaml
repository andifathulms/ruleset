id: judo
label: Judo
tagline: Rewrote its scoring three times in twenty years, and banned a whole class of technique to stop looking like wrestling.
governing_body: International Judo Federation
founded: >
  Kodokan judo founded by Jigoro Kano in 1882; the International Judo
  Federation formed in 1951.
coverage: deep
family_colour: clay
classification:
  official: judo
  game-category: outside-taxonomy
  adjudication: combat
summary: >
  The only combat sport on this site, and the one that shows most clearly what
  a rule change costs when the rules are the sport. Judo has removed scores,
  removed techniques and removed the time limit inside two decades, and the
  most contested of those — banning direct leg grabs in 2013 — was defended on
  grounds of identity rather than safety or fairness. It is also the only sport
  here whose founder wrote down what the sport was for.
