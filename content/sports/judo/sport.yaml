summary: >
  Two contestants of the same weight category face each other on a square mat.
  Each takes a grip on the other's jacket and tries to throw the other onto
  their back. A clean throw with control, speed and force is ippon, and it
  ends the contest at once. So does a pin held for twenty seconds, or a
  strangle or armlock that makes the opponent give up. A contest lasts four
  minutes and has no draw: if the score is level, it goes on until somebody
  scores. Judo is a fight for a grip first and a throw second, and one
  perfect throw is worth more than everything else put together.
