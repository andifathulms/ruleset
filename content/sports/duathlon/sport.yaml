id: duathlon
label: Duathlon
tagline: "Triathlon with the swim taken out — which removes the sport's entry barrier and adds a second run on legs that have already run."
governing_body: World Triathlon
founded: >
  Emerged in the 1980s from the triathlon boom as a format for athletes and
  venues without open water; world championships have been held since 1990,
  under the federation founded in 1989.
coverage: deep
family_colour: pool
classification:
  official: duathlon
  game-category: performance
  adjudication: measured
summary: >
  Run, bike, run. Removing the swim from triathlon takes away the discipline
  that keeps most people out of the sport — open-water swimming is the barrier,
  not the cycling — and puts something back that triathlon does not have: a
  final run begun on legs that have already run hard. It is governed by a
  federation named after the sport it is not, and has no Olympic prospect for
  the same reason.
