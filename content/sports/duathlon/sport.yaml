summary: >
  A duathlon is a run, a bicycle ride and a second run, done one after the
  other without a break. A common championship race is about 10 kilometres of
  running, 40 kilometres of cycling and 5 more kilometres of running, and takes
  roughly two hours. The clock never stops, so the two changes between the
  legs, called transitions, are part of the race, and the first athlete across
  the line wins. It is a triathlon without the swim. What it has in its place
  is a last run on legs that have already run hard once.
