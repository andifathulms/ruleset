summary: >
  Racquetball is played by two or four people inside a sealed court forty feet
  long, twenty wide and twenty high. The players hit a lively rubber ball with
  short racquets. Each shot must reach the front wall before the ball bounces
  twice on the floor, and it may go there by any route: off the side walls,
  the back wall or the ceiling. There is no out of bounds, so a rally is
  almost always lost by failing to reach the ball. Only the server can score.
  A game goes to 15 points, and a match is the best of three games. Both sides
  share the same floor, and many of the rules are about keeping out of each
  other's way.
