id: racquetball
label: Racquetball
tagline: "A wall sport with no out of bounds: the ceiling and every wall are in play, and the only way to lose the ball is to let it bounce twice."
governing_body: International Racquetball Federation
founded: >
  Invented in 1950 by Joe Sobek at a YMCA in Greenwich, Connecticut, by adding
  a strung racquet to handball; the International Racquetball Federation was
  formed in 1979.
coverage: deep
family_colour: clay
classification:
  official: racquetball
  game-category: net-and-wall
  adjudication: decided-by-score
summary: >
  Played in a sealed box forty feet by twenty by twenty, in which every surface
  including the ceiling is in play and the front wall has no tin. Squash, its
  nearest relative, defines a court by where the ball may not go; racquetball
  removed almost all of those lines. The two sports also answered the broadcast
  question differently — squash rewrote its scoring and is on the 2028 Olympic
  programme, racquetball kept its and is at the World Games.
