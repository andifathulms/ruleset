id: muaythai
label: Muaythai
tagline: "Eight striking surfaces, a clinch you are allowed to hit from, and a mandatory ritual dance before the bell."
governing_body: International Federation of Muaythai Associations
founded: >
  Descended from Siamese battlefield and festival fighting, professionalised in
  Thai stadium boxing through the twentieth century; the International
  Federation of Muaythai Associations was formed in 1993.
coverage: deep
family_colour: clay
classification:
  official: muaythai
  game-category: outside-taxonomy
  adjudication: combat
summary: >
  The art of eight limbs: fists, elbows, knees and shins, with a clinch that is
  not broken up but fought in. It is the most permissive striking code covered
  on this site, and its international amateur version is markedly less
  permissive than the professional Thai one — protective equipment, restricted
  elbows, and a different way of scoring a round. As in sumo, the sport's
  competitive summit sits in one country, outside the federation that holds the
  Olympic recognition.
