summary: >
  Two fighters meet in a roped ring, one against one, in weight categories.
  They may strike with fists, elbows, knees and shins, eight surfaces in all.
  When they grip each other in a clinch the referee lets them fight on, with
  knees, elbows and sweeps. Rounds last three minutes. A bout is won by
  knockout, by a stoppage or on the judges' decision. Before the first bell
  each fighter performs a ritual to music, the wai kru ram muay, and the rules
  require it. International amateur bouts add a headguard, shin guards and
  elbow pads and are usually three rounds. Professional bouts in Thailand have
  five rounds and none of the padding.
