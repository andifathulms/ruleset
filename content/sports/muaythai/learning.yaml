sport: muaythai
standing: editorial
summary: >
  Gyms are everywhere and the first class is pads and fitness, which is why so
  many people do it. Competing is a different proposition, and the summit of
  the sport is a Thai professional culture you effectively have to move to.

entry:
  verdict: low
  claim: A gym, wraps and gloves. Most people who train it never intend to fight.
  why: >
    Muaythai has one of the largest recreational participation bases of any
    combat sport, because the training is unusually accessible: pad work, bag
    work and conditioning give a complete session with no sparring, and gyms
    exist in most cities worldwide.

    A beginner needs wraps, gloves and a gym. Nothing about a first class
    involves being hit.

    The ladder into competition is also graded honestly. Junior and lower
    amateur categories restrict or remove elbows, require headguards and shin
    guards, and shorten the bouts, so a first competition is a long way from
    the professional sport in what it permits.
