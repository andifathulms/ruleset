gap: >
  Low to very high, and the shape of it is closest to sumo's on this site — a
  sport whose ceiling is a national professional institution outside its
  international federation.

  Sumo's professional association governs the best wrestlers and enters no world
  championships. Muaythai's summit is the Thai stadium system, which has its
  own scoring conventions and does not use the amateur code's protective
  equipment or restrictions. In both cases the internationally recognised
  federation runs a real competition that is not the top of the sport.

  What muaythai has that sumo does not is an enormous recreational base
  worldwide, most of which never competes at all. The gap between the number of
  people who train it and the number who fight professionally is probably the
  widest of any combat sport here, and the training culture is a large part of
  why: you can do muaythai for a decade and never be hit.

