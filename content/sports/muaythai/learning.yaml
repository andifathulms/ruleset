mastery:
  verdict: very-high
  claim: Eight weapons, a clinch you must fight in, and a summit that is in one country.
  why: >
    The technical breadth is the largest in any striking sport covered here.
    Fists, elbows, knees and shins, thrown and defended, plus a clinch that is a
    complete grappling-striking discipline in itself — neck control, sweeps,
    knees from a grip — which is the phase that most often decides bouts between
    good fighters and is the least visible to a casual viewer.

    The conditioning demand is severe and specific: shins that can block a kick,
    a body that can absorb repeated low kicks, and the capacity to work in a
    clinch, which is exhausting in a way nothing in boxing is.

    The institutional ceiling is the hard part. The sport's competitive summit
    is the Thai stadium system — a professional culture with its own scoring
    conventions, its own fight economy and its own gambling structure — and it
    is not the padded, restricted amateur code that holds the international
    recognition. Reaching the top of muaythai has historically meant fighting
    in Thailand, under different rules from the ones your national federation
    prepared you for.
