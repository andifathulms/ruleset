summary: >
  Underwater hockey and underwater rugby are team games in which nobody
  carries air. Players wear a mask, a snorkel and fins, take a breath at the
  surface, dive, play for as long as the breath lasts, and come up again. In
  hockey, six a side push a lead puck along the pool floor with short sticks
  towards a trough at the far end. In rugby, the ball sinks, the goals are
  baskets on the bottom of a deep pool, and play goes over and under
  defenders as well as around them. The side with more goals wins.
