# The underwater hockey floor at the start of play, from the facts in
# play.yaml. The size is approximate and the goals are not measured there, so
# the drawing is schematic.
sport: underwater-sports
title: The hockey floor at the start
eyebrow: Underwater hockey, seen from above
caption: >
  Underwater hockey is played on the flat floor of a pool about two metres
  deep. Play starts with the puck in the middle and each team of six touching
  its own end wall. A team scores by pushing the puck into the trough at the
  other end. Underwater rugby uses a deeper pool, and the whole depth of it
  is in play.
alt: >
  A rectangular pool floor about 25 metres long and 15 metres wide, with a
  goal trough at each end, a puck in the centre and six players lined up on
  each end wall.
scale: schematic
view: [-4, -3.5, 33, 20]
