sport: volleyball
as_of: 2026-09
source: fivb-rules
standing: primary-named
summary: >
  Two Olympic disciplines that share a federation and a name and very little
  else. Indoor volleyball is six a side on a hard court; beach volleyball is
  two a side on sand with a different court size, a different scoring target
  and no substitutions at all. The IOC counts them as one sport.
disciplines:
  - id: indoor
    label: Indoor
    events:
      - { id: men, label: "Men's tournament", at: [olympic] }
      - { id: women, label: "Women's tournament", at: [olympic] }
  - id: beach
    label: Beach
    blurb: >
      Two players, no substitutions, a smaller court, and sets to 21. A
      separate rulebook, not a variant.
    events:
      - { id: bm, label: "Men's tournament", at: [olympic] }
      - { id: bw, label: "Women's tournament", at: [olympic] }
  - id: other
    label: Contested away from the Games
    counts: false
    events:
      - { id: snow, label: Snow volleyball, at: [federation-only] }
      - { id: sitting, label: Sitting volleyball, note: Paralympic, governed by World ParaVolley., at: [paralympic] }
