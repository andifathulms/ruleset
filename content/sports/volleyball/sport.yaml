summary: >
  Volleyball is played by two teams of six on a court divided by a high net. A
  rally starts with a serve. Each team then has three touches to send the ball
  back, and no player may touch it twice in a row. The ball may not be caught
  or held, so every touch is a rebound, and almost every rally follows the
  same pattern: pass, set, attack. Every rally scores a point. A set goes to
  25, and a match is the best of five sets. The two teams never touch each
  other. The whole contest is for the ball.
