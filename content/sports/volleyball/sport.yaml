id: volleyball
label: Volleyball
tagline: The third sport in the broadcast wave, and the only one that invented a new position to fix what its rules had broken.
governing_body: FIVB
founded: >
  Invented by William G. Morgan in Holyoke, Massachusetts, in 1895. FIVB
  founded 1947.
coverage: deep
family_colour: pitch
classification:
  official: volleyball
  game-category: net-and-wall
  adjudication: decided-by-score
summary: >
  Badminton, table tennis and volleyball all replaced side-out scoring with
  rally scoring within eight years of each other, for the same stated reason,
  and volleyball went first. Its 1999 change is the cleanest example on this
  site of a federation altering the arithmetic of its sport so that a match
  would fit a broadcast slot — and it severed every set and match statistic
  the sport had.
