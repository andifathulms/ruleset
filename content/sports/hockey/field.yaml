# The pitch, from the measurements in play.yaml. Shapes are in metres. The
# shooting circle is two quarter circles of 14.63 m centred on the goalposts,
# joined by a straight line in front of the goal.
sport: hockey
title: A long pitch with two circles
caption: >
  The pitch is 91.4 metres long and 55 metres wide. In front of each goal is
  the shooting circle. A goal counts only if an attacker plays the ball inside
  it, so most of the game is a fight to get there. The circle reaches 14.63
  metres out from the goal line. The dot in the right-hand circle is the
  penalty stroke spot, 6.4 metres from goal.
alt: >
  A hockey pitch 91.4 metres long and 55 metres wide, with a centre line, a
  line 22.9 metres from each end, and a shaded shooting circle of 14.63 metres
  in front of each goal.
