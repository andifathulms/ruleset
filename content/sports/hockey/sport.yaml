summary: >
  Hockey is played eleven a side on an artificial-turf pitch. Players move a
  hard ball with a stick that may touch it only with its flat face, and
  they may not play it with the body. A goal counts only if an attacker plays
  the ball inside the shooting circle, so the game is a long build-up towards
  two small, crowded areas. There is no offside, so attackers may stand
  anywhere. Fouls by defenders in their circle give the penalty corner, the
  set piece that produces many of the goals.
