label: Hockey
tagline: The only major invasion sport to abolish offside outright, and the only one whose surface change priced half the world out.
governing_body: International Hockey Federation
founded: Fédération Internationale de Hockey founded 1924.
coverage: deep
family_colour: pitch
classification:
