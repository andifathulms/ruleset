sport: hockey
standing: editorial
summary: >
  A sport whose entry barrier moved sharply in one direction in 1976 and has
  stayed there. Hockey used to be playable on any grass field; it is now
  played on a surface that costs more to build than most clubs have, and its
  competitive map narrowed to match.

entry:
  verdict: moderate
  claim: A stick, a ball and a pitch you probably do not have.
  why: >
    The skills are learnable and the sport is well organised through schools in
    the countries that play it. A stick and a ball are cheap and the basic
    actions are approachable.

    The barrier is the surface. Since 1976 competitive hockey has been played
    on artificial turf, which is a facility rather than a field. A water-based
    pitch is expensive to build and to irrigate, and a country or a club either
    has one or plays a different game on grass that no longer prepares anyone
    for the real one.

    That is the same shape as swimming's pool problem and gymnastics' hall
    problem, and it arrived suddenly rather than being inherent to the sport.
