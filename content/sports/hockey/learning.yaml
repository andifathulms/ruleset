    - { label: Kit to start, value: A stick and a ball, basis: observation }
    - { label: Facility, value: Artificial turf, basis: rule, rule: fih-1976-artificial-turf, note: A grass pitch no longer prepares a player for the competitive game. }
    - { label: Players needed, value: "22", basis: observation }
    - { label: Time to a real game, value: Weeks, basis: judgement }

mastery:
  verdict: very-high
  claim: A fast ball, one usable stick face, and a sport reshaped three times in thirty years.
  why: >
    Elite hockey demands stick skill at a speed few sports match, on a surface
    that removes the excuse of a bad bounce, using a stick with only one legal
    face — so half the natural movements are illegal and the reverse-stick
    technique has to be built from nothing.

    The tactical demand changed fundamentally in 1998 when offside was removed.
    Defences had to be reinvented, and the sport that a player trained for in
    1996 is not the one they played in 1999.

    The penalty corner is the specialist's problem: a set piece producing a
    large share of international goals, defended by players running at a drag
    flick struck from fifteen metres.
