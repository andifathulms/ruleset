gap: >
  Hockey's gap is moderate to very high, and what makes it worth recording is
  that its entry barrier was raised by a decision rather than inherited from
  the sport.

  Football's Laws are loose precisely so the game works on packed earth. Hockey
  went the other way: it standardised its surface, gained a faster and better
  game, and priced out the countries that could not build one. India and
  Pakistan dominated hockey for half a century on grass and have never fully
  recovered from the switch.

  That is the clearest case on this site of a rule change redistributing a
  sport geographically, and nobody legislated for it.

