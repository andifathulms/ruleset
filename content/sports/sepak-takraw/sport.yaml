id: sepak-takraw
label: Sepak takraw
tagline: "Volleyball with no hands, on a badminton court — and one player may take all three touches, which is the rule that makes it a different sport."
governing_body: International Sepaktakraw Federation
founded: >
  Codified in 1965 in Kuala Lumpur from Malay sepak raga and Thai takraw, whose
  two names were combined to make the sport's; a full Asian Games medal sport
  from 1990.
coverage: deep
family_colour: clay
classification:
  official: sepak-takraw
  game-category: net-and-wall
  adjudication: decided-by-score
summary: >
  Three a side over a net, playing a woven ball with feet, knees, chest and
  head and never with the hands or arms. It is played on a badminton doubles
  court, which is small enough that the spike — a bicycle kick from above net
  height — is the sport's ordinary attacking shot rather than its highlight.
  Three touches a side, as in volleyball, except one player may take all of
  them.
