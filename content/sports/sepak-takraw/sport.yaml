summary: >
  Sepak takraw is played three against three over a net, on a court the size
  of a badminton doubles court. Players use their feet, knees, chest and head,
  and never their hands or arms. A side has three touches to return the ball,
  and one player may take all three. The court is small and the net is low
  enough for a leg to reach above it, so the usual way to win a rally is a
  spike: a jumping kick that sends the ball down from above the net. Every
  rally scores a point. A set goes to 21, and a match is the best of three.
