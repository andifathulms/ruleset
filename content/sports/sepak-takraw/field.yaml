# The court, from the measurements in play.yaml. Shapes are in metres.
sport: sepak-takraw
title: A small court with three marked places
caption: >
  The court is the size of a badminton doubles court. The serving side is shown
  on the left. The server, the tekong, keeps one foot in the service circle,
  and the two team-mates stand in the quarter circles at the net until the
  ball is kicked. One of them tosses the ball to the tekong.
alt: >
  A sepak takraw court 13.4 metres long and 6.1 metres wide, divided by a net.
  Each half has a small service circle near the back line and a quarter circle
  at each end of the net.
