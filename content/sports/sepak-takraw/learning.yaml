      rule: takraw-1965-codification
      note: The technical wall — the striking surfaces are ones most people never train.
    - label: All three touches by one player
      value: Permitted
      basis: rule
      rule: takraw-three-touches-one-player
      note: Volleyball forbids it; here the best players do the whole sequence alone.
    - { label: Spike height, value: Above a 1.52 m net, with the foot, basis: observation }
