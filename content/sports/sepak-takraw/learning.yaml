gap: >
  Low to very high, and the pairing to look at is volleyball, which this site
  also covers.

  The two sports share a net, a three-touch limit, a small team and a spike as
  the scoring shot. Sepak takraw removes the hands and permits consecutive
  touches by one player. Removing the hands raises the technical floor
  enormously — a beginner can dig a volleyball on day one and cannot control a
  takraw ball with a foot — and permitting consecutive touches raises the
  ceiling, because the best players are allowed to do everything themselves.

  So one sport made both ends harder than its relative, with two rules. It is
  the sharpest example on this site of technical difficulty being designed in
  rather than inherited, and it is why sepak takraw has never spread far beyond
  the region that invented it despite needing almost no equipment.

