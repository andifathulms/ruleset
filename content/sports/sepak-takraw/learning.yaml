sport: sepak-takraw
standing: editorial
summary: >
  A ball and a circle of friends gets you playing immediately, and the
  competitive game has one of the steepest technical walls on this site: you
  must strike a ball above head height with your foot, accurately, repeatedly.

entry:
  verdict: low
  claim: One woven ball. The traditional form is a circle of people keeping it up.
  why: >
    The ancestral game — keeping a ball airborne in a circle without hands — is
    still how most people meet the sport across Southeast Asia, and it needs a
    ball and nothing else. No net, no court, no teams, no officials.

    That circle form is a genuine on-ramp rather than a folk curiosity: it
    trains exactly the first touch the competitive game needs, and it can be
    played by two people or twelve.

    The competitive game raises the barrier immediately. It needs a net, a
    marked court and six players, and it requires you to control a ball with
    surfaces most people have never used deliberately. Anyone can start; very
    few can rally on the first day.
  evidence:
    - { label: Kit to start, value: A woven ball, basis: observation }
    - { label: Traditional form, value: A circle, no net or court, basis: observation }
    - { label: Players needed for a match, value: "6", basis: rule, rule: takraw-1965-codification }
    - { label: Court, value: A badminton doubles court, basis: observation, note: Widely available across the sport's region. }
