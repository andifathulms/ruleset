mastery:
  verdict: very-high
  claim: A bicycle-kick spike from above net height, as the ordinary way to end a rally.
  why: >
    The elite attacking shot is an inverted or rotating kick striking a ball
    above 1.5 metres, downward, into a court 6.1 metres wide, at speed — and it
    is not the highlight of the sport but its standard method of scoring.
    Nothing else covered here requires an acrobatic inversion as routine
    technique.

    The permission for one player to take all three touches raises the ceiling
    rather than lowering it. A killer can control, set and spike alone, which
    means the very best players are asked to do the whole sequence rather than
    specialise, and the sport's tactical variety comes from choices volleyball's
    rules would forbid.

    The court is small and the ball is fast, so defence is anticipation rather
    than coverage. A blocker in sepak takraw is often airborne and inverted
    too.

    The ceiling is also geographically capped. Thailand and Malaysia have the
    professional and semi-professional structures; almost everywhere else, the
    elite ceiling is a national team place.
