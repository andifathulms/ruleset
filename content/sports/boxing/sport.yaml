summary: >
  Two boxers of the same weight category fight in a square, roped ring. Each
  tries to land clean punches on the other with the knuckle part of a closed
  glove, above the belt, and to avoid being hit. An Olympic-style bout is
  three rounds of three minutes. Five judges score every round, ten points to
  the boxer who won it and nine or fewer to the other. A bout can also end at
  once, by knockout or when the referee stops it. A boxer who is knocked down
  must be ready to go on before the referee finishes the count.
