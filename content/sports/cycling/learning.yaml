sport: cycling
standing: editorial
summary: >
  Most people on earth can already do the thing. Cycling is the only sport here
  whose basic skill is a form of transport, learned in childhood by people with
  no interest in racing, which makes its entry barrier close to zero and its
  competitive barrier almost entirely about equipment and physiology.

entry:
  verdict: very-low
  claim: If you can ride a bike, you can enter a race this weekend.
  why: >
    There is no technique to acquire before competing. A club road race, a
    time trial or a sportive will accept a rider who has never trained, and the
    sport's entry-level events are genuinely continuous with commuting.

    What stands between a beginner and the sport is money rather than skill. A
    competitive road bicycle costs more than the equipment of every other sport
    on this site combined, and the difference between a cheap bicycle and an
    expensive one is measurable in a way that a cheap racket and an expensive
    one mostly is not.
