summary: >
  The hour record is the most instructive series on this site. Faced with
  equipment that had made old marks unreachable, the UCI did not reset the list
  and did not leave it alone — it split it, running an equipment-restricted
  record alongside an unrestricted one for seventeen years, and then reunified
  them in 2014. Athletics reset, swimming retained, cycling did both at once
  and then changed its mind. Nowhere else can those three answers be compared
  against the same problem.
