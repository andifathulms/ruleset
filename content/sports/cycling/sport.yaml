summary: >
  Cycling is racing on a bicycle. On the road, riders start together and the
  first across the line wins, after one day or after three weeks of daily
  stages added together. On the track, they race on a banked wooden oval, 250
  metres around. A rider who follows closely behind another saves a great deal
  of energy, so road racers ride in groups and in teams, and most of a team
  works to shelter one leader until the last kilometres. The bicycle itself is
  tightly defined by the rules, because so much of a rider's speed comes from
  the machine.
