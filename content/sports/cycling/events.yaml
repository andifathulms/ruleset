sport: cycling
as_of: 2026-09
source: uci-regulations
standing: primary-named
summary: >
  Five Olympic disciplines under one federation, which is unusual: road, track,
  mountain bike, BMX racing and BMX freestyle share a governing body and almost
  nothing else. The IOC counts them as one sport, and this is the clearest case
  on the site of the official taxonomy grouping things that have very little in
  common.
disciplines:
  - id: road
    label: Road
    events:
      - { id: rr, label: Road race, at: [olympic], count: 2 }
      - { id: itt, label: Individual time trial, at: [olympic], count: 2 }
  - id: track
    label: Track
    blurb: >
      The discipline the hour record belongs to, though the record itself is
      not an Olympic event.
    events:
      - { id: sprint, label: Sprint, at: [olympic], count: 2 }
      - { id: team-sprint, label: Team sprint, at: [olympic], count: 2 }
      - { id: keirin, label: Keirin, at: [olympic], count: 2 }
      - { id: team-pursuit, label: Team pursuit, at: [olympic], count: 2 }
      - { id: omnium, label: Omnium, at: [olympic], count: 2 }
      - { id: madison, label: Madison, at: [olympic], count: 2 }
  - id: mtb
    label: Mountain bike
    events:
      - { id: xco, label: Cross-country, at: [olympic], count: 2 }
  - id: bmx
    label: BMX
    events:
      - { id: bmx-race, label: BMX racing, at: [olympic], count: 2 }
      - { id: bmx-free, label: BMX freestyle park, at: [olympic], count: 2, note: "Judged, not measured — a judged event inside a measured sport." }
  - id: non-olympic
    label: Contested away from the Games
    counts: false
    events:
      - { id: hour, label: The hour record, note: "A ratified world record, contested whenever a rider chooses. Not an event at any championship.", at: [federation-only] }
      - { id: cx, label: Cyclo-cross, at: [world-championship] }
      - { id: track-endurance, label: Individual pursuit, note: "Dropped from the Olympic programme after 2008; still a world championship event.", at: [world-championship] }
