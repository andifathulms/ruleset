gap: >
  Fencing's gap is high-to-very-high rather than low-to-very-high, and the
  reason is that its beginner's version is not simpler than its elite version,
  only slower. There is no informal fencing.

  What it shares with taekwondo is the instrument, and the comparison is the
  point of having both. Taekwondo automated its scoring in one act in 2009 and
  has spent fifteen years chasing the consequences. Fencing automated in three
  acts across fifty-two years and had the same experience three times, weapon
  by weapon. Both sports discovered that once a machine decides what scores,
  athletes optimise for the machine — and both responded by adjusting the
  machine rather than the rules.

