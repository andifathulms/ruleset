summary: >
  Two fencers face each other on a strip fourteen metres long and try to hit
  the opponent's target area with a blade. Each hit is one point, and a bout
  goes to fifteen hits. There are three weapons, and each is close to a sport
  of its own. In épée the whole body is the target, and if both fencers hit
  together both score. In foil the target is the torso, and in sabre it is
  everything above the waist. In those two weapons, when both fencers hit,
  the referee gives the point to the one who had right of way. A scoring
  machine shows whether a hit landed. Only the referee can say whose hit
  counts.
