# The piste, from the measurements in play.yaml. Shapes are in metres.
sport: fencing
title: The piste
caption: >
  A bout is fenced on a strip fourteen metres long. The fencers start at the
  on-guard lines, two metres either side of the centre. The last two metres at
  each end are a warning zone: a fencer who retreats past the end of the piste
  has a hit scored against them. The piste is between 1.5 and 2 metres wide,
  and it is drawn here at 2 metres.
alt: >
  A long narrow fencing piste, 14 metres by 2 metres, with a centre line, two
  on-guard lines 2 metres from the centre and a shaded warning zone 2 metres
  long at each end.
scale: to-scale
view: [-1.6, -3.2, 17, 5]
shapes:
