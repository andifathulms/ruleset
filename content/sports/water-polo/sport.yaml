summary: >
  Water polo is played in a pool at least two metres deep, so every player
  swims or treads water for the whole match. Seven players a side, one of them
  usually a goalkeeper, pass the ball and throw it at a goal three metres
  wide. A team has 28 seconds to shoot. Contact is allowed and never stops,
  and a player who holds, sinks or pulls back an opponent without the ball is
  sent out for 18 seconds, which leaves the other team a player up. Much of
  the struggle for position happens under the surface, where it is hard to
  see.
