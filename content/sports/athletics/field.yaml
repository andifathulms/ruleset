# The track, drawn from the facts in play.yaml: 400 m around the inside lane,
# lanes 1.22 m wide. The lengths of the straights and the radius of the bends
# are not facts in play.yaml, so the drawing is marked schematic.
sport: athletics
title: The track and the infield
caption: >
  One lap of the inside lane is 400 metres. The 100 metres is run along one
  straight, in lanes, to the finish line that every track race shares. Races
  that go around a bend start from staggered positions, so that the outer
  lanes are no longer than the inner one. The jumps and throws take place on
  the ground inside and beside the track.
alt: >
  An oval running track with two straights and two bends, a finish line at
  the end of one straight, a 100 metres start at the other end of it, and the
  infield for jumps and throws in the middle.
scale: schematic
