summary: >
  Athletics is a programme of events held in one stadium under one rulebook.
  Runners race over a set distance on a 400-metre track or on the road.
  Jumpers and throwers take turns, and each one's best attempt is measured.
  Nobody scores points against an opponent. The result is a time, a height or
  a distance, so most of the rules are about conditions: the lane, the start,
  the wind, the clock and the exact weight and shape of what is thrown. Those
  rules let a mark made today be compared with a mark made in another stadium
  in another year.
