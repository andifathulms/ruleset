id: athletics
label: Athletics
tagline: The sport that redesigned an implement to bring the record book back inside the stadium.
governing_body: World Athletics
founded: >
  International Amateur Athletic Federation founded 1912; renamed International
  Association of Athletics Federations in 2001 and World Athletics in 2019.
coverage: deep
family_colour: pool
classification:
  official: athletics
  game-category: performance
  adjudication: measured
summary: >
  A measured sport keeps a number, which means it is the family where a rule
  change and a comparability break are most obviously the same event. Athletics
  has done this deliberately and more than once: the men's javelin was
  redesigned in 1986 and the record book restarted, and the same operation was
  performed on the women's implement in 1999. It has also declined to do it —
  shoe technology from 2017 onwards produced a wave of records that were all
  allowed to stand.
