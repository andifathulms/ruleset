sport: polo
standing: editorial
summary: >
  The highest entry barrier on this site, because the equipment is a string of
  horses — and a handicap system that nonetheless lets a beginner take the
  field in a real match on day one, which almost nothing else here can offer.

entry:
  verdict: high
  claim: You need horses. Several. Or a club that will hire them to you by the chukka.
  why: >
    Nothing else covered here has an entry cost like this. A player needs
    several horses for a single match, each requiring stabling, feed,
    veterinary care, transport and a groom, and the horses are the sport's
    decisive variable rather than an accessory to it.

    Club chukkas and polo schools hire ponies by the chukka, which is the only
    realistic route in and still expensive. It is a sport you enter through
    money or through employment — a substantial proportion of professional
    players began as grooms.

    What pulls the verdict back from very high is the **handicap**. A beginner
    rated at −2 is not excluded from real competition; they are a valued team
    member, because their low rating buys goals for their side. Very few sports
    on this site let a novice play a meaningful part in a serious match, and
    polo's rating system is designed to make exactly that happen.
