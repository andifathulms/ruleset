id: polo
label: Polo
tagline: "Played on the largest field in organised sport, with a right of way rule borrowed from navigation and a string of horses rotated through the match like equipment."
governing_body: Federation of International Polo
founded: >
  An ancient Central Asian horseback game, codified by British officers and tea
  planters in India from the 1850s; the first English rules were written in
  1874 and the international federation was formed in 1982.
coverage: deep
family_colour: pitch
classification:
  official: polo
  game-category: invasion
  adjudication: decided-by-score
summary: >
  Four a side on a field three hundred yards long — the largest playing area in
  organised sport — with the fundamental rule not about the ball but about the
  **line** it is travelling along, and right of way granted to whoever is
  following it most closely. Contested at five Olympic Games to 1936 and never
  since, and the only sport on this site in which competitors have played
  cloned animals.
