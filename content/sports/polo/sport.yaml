summary: >
  Polo is played by two teams of four riders on a grass field three hundred
  yards long, the largest in organised sport. Each rider carries a long mallet
  in the right hand and tries to hit a small ball between the other team's
  goalposts. The main rule is about the path of the ball, called the line of
  the ball. The rider who follows that line most closely has right of way, and
  nobody may cross in front of them. A match is divided into chukkas of seven
  and a half minutes, and riders change horses between them, because no horse
  can gallop for a whole match.
