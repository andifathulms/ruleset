# The boarded field, from the measurements in play.yaml. Shapes are in yards.
sport: polo
title: Three hundred yards of grass
caption: >
  The full-size boarded field, measured in yards. The goalposts stand eight
  yards apart with no crossbar, so the goal is a small target on a very large
  field. The dashed lines are 30, 40 and 60 yards from each goal line, and
  free hits for fouls are taken from those distances. Without boards the field
  is 200 yards wide.
alt: >
  A polo field 300 yards long and 160 yards wide, with a narrow goal in the
  middle of each end and lines 30, 40 and 60 yards from each goal line.
scale: to-scale
view: [-36, -34, 342, 196]
shapes:
  - { type: rect, x: 0, y: 0, w: 300, h: 160, fill: area }
  - { type: rect, x: 0, y: 0, w: 60, h: 160, fill: zone, line: none }
  - { type: rect, x: 240, y: 0, w: 60, h: 160, fill: zone, line: none }
  - { type: line, x1: 30, y1: 0, x2: 30, y2: 160, line: dashed }
  - { type: line, x1: 40, y1: 0, x2: 40, y2: 160, line: dashed }
  - { type: line, x1: 60, y1: 0, x2: 60, y2: 160, line: dashed }
  - { type: line, x1: 270, y1: 0, x2: 270, y2: 160, line: dashed }
  - { type: line, x1: 260, y1: 0, x2: 260, y2: 160, line: dashed }
  - { type: line, x1: 240, y1: 0, x2: 240, y2: 160, line: dashed }
  - { type: line, x1: 150, y1: 0, x2: 150, y2: 160, line: faint }
  - { type: line, x1: 0, y1: 76, x2: 0, y2: 84, line: heavy }
  - { type: line, x1: 300, y1: 76, x2: 300, y2: 84, line: heavy }
  - { type: label, x: -5, y: 80, text: "goal", anchor: end, tone: muted }
  - { type: label, x: 26, y: -9, text: "30", tone: muted }
  - { type: label, x: 43, y: -9, text: "40", tone: muted }
  - { type: label, x: 62, y: -9, text: "60 yd", anchor: start, tone: muted }
  - { type: label, x: 180, y: -9, text: "boards along both sides", tone: muted }
  - { type: dim, x1: 0, y1: 178, x2: 300, y2: 178, text: "300 yd" }
  - { type: dim, x1: 322, y1: 0, x2: 322, y2: 160, text: "160 yd" }
legend:
  - { swatch: zone, label: "within 60 yd of goal" }
  - { swatch: dashed, label: "free-hit lines" }
  - { swatch: heavy, label: "goal, 8 yd wide" }
