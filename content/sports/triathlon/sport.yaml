id: triathlon
label: Triathlon
tagline: Legalised drafting in 1995 and turned three time trials into one race.
governing_body: World Triathlon
founded: >
  International Triathlon Union founded 1989; renamed World Triathlon in 2020.
coverage: deep
family_colour: pool
classification:
  official: triathlon
  game-category: performance
  adjudication: measured
summary: >
  One rule change did almost everything to this sport. Until 1995, riding in
  another competitor's slipstream was forbidden, so the bike leg was a time
  trial and a triathlon was three individual efforts added together. Legalising
  drafting turned it into a pack race in which tactics, positioning and a
  sprint finish decide the result — and it severed every bike split the sport
  had recorded.
