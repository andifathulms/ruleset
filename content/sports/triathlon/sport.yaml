summary: >
  A triathlon is a swim in open water, a bicycle ride and a run, done one after
  the other without a break. At the Olympic distance that is 1500 metres, 40
  kilometres and 10 kilometres, finished in under two hours. The clock never
  stops, so the two changes between the legs, called transitions, are part of
  the race. The first athlete across the finish line wins. Professionals may
  ride close behind each other on the bicycle and so they race in packs.
  Everyone else must keep a gap and ride alone.
