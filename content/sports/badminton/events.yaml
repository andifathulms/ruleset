sport: badminton
as_of: 2026-09
source: bwf-laws-of-badminton
standing: primary-named
summary: >
  One discipline and five events, a small programme: men's and women's
  singles, men's and women's doubles, and mixed doubles, in which a man and a
  woman play as a pair.
disciplines:
  - id: badminton
    label: Badminton
    blurb: >
      The IOC treats badminton as a single discipline; the five events are
      distinguished by who is on court, not by any change in the laws.
    events:
      - { id: ms, label: "Men's singles", at: [olympic] }
      - { id: ws, label: "Women's singles", at: [olympic] }
      - { id: md, label: "Men's doubles", at: [olympic] }
      - { id: wd, label: "Women's doubles", at: [olympic] }
      - { id: xd, label: Mixed doubles, at: [olympic], note: "A man and a woman play as a pair." }
