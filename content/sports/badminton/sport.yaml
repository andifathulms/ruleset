summary: >
  Badminton is played across a high net on a court about half the length of a
  tennis court. Players hit a shuttlecock, a cork base with sixteen feathers,
  back and forth until it lands on the floor or someone makes a fault. Every
  rally scores a point, a game goes to 21, and a match is the best of three
  games. The shuttle is what makes the sport: it slows so sharply in the air
  that it cannot be hit long from anywhere, so the court is small and the
  game is played close, fast and overhead.
