gap: >
  Low to high, and the interesting part is that the ceiling is lowered by
  fragmentation rather than raised by difficulty.

  Muaythai, sitting right beside it, permits elbows and fights in the clinch,
  and its summit is a single identifiable place. Kickboxing bars elbows, breaks
  the clinch, and spreads its athletes across six disciplines and several
  federations — so being the best kickboxer in the world is not a
  well-defined achievement in the way being the best muaythai fighter is.

  The minimum kick rule is the sport's most honest self-assessment. A code
  assembled by adding kicks to boxing discovered that its competitors would
  drop them if allowed, and rather than accept that, it made throwing them
  compulsory. Very few sports on this site have had to legislate that their
  athletes use the technique the sport is named after.

