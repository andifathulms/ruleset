sport: kickboxing
standing: editorial
summary: >
  Among the easiest combat sports to start, because the lightest disciplines are
  genuinely light and gyms are everywhere — and the ceiling is fragmented across
  disciplines and federations that do not agree on what the sport is.

entry:
  verdict: low
  claim: A gym, gloves and shin guards, and a discipline where nobody is trying to hurt you.
  why: >
    The federation's spread of disciplines is an entry ramp whether or not it
    was designed as one. Point fighting and light contact are contested on a
    tatami with restrained contact, headguards and foot protectors, and a
    beginner can compete properly in them without ever being hit hard.

    Recreationally, kickboxing is one of the largest fitness activities in the
    world: bag and pad classes in commercial gyms everywhere, most of whose
    participants never intend to compete.

    Equipment is gloves, wraps, mouthguard and shin guards. Nothing about the
    first months requires taking a punch.
