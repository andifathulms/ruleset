mastery:
  verdict: high
  claim: Six disciplines that reward different fighters, and several federations that will not recognise each other's champions.
  why: >
    The technical ceiling is real but not the highest here. Elbows are barred
    throughout, the clinch is broken rather than fought in, and the throwing and
    grappling that muaythai and ju-jitsu demand are absent — so kickboxing asks
    for excellence in a narrower range than either.

    What raises it is the fragmentation. Full contact bars leg kicks; low kick
    permits them; K-1 style permits knees as well. These are not variations of
    emphasis — a fighter's whole defensive structure changes when the legs
    become a target — and a champion in one discipline can be uncompetitive in
    another.

    Then the institutional half. Kickboxing has many international sanctioning
    bodies, each with its own world titles, and IOC recognition went to one of
    them. An athlete's standing depends on which body's belt they hold, and no
    mechanism exists to reconcile them. It is the same shape of problem this
    site records in powerlifting.

    And full contact has the minimum kick rule, which means an elite fighter is
    solving the bout while also meeting a technique quota.
