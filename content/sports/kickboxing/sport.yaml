summary: >
  Two fighters in gloves punch and kick each other, one against one, in weight
  categories. Kickboxing is a family of six disciplines, and they do not share
  one set of rules. Full contact, low kick and K-1 style are fought at full
  force in a roped ring, scored round by round, and can end by knockout. They
  differ on whether the legs may be kicked and whether knees are allowed.
  Point fighting, light contact and kick light are fought on mats with
  controlled contact, and point fighting stops after every score. Elbows are
  banned in all of them. In full contact a fighter must throw a minimum number
  of kicks in every round.
