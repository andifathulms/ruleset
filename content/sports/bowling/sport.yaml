summary: >
  Ten pins stand in a triangle at the end of a lane, sixty feet from the
  bowler. A game is ten frames, and in each frame the bowler has two
  deliveries to knock the pins down. All ten with the first ball is a strike,
  and all ten with two is a spare. Both earn bonus pins from the deliveries
  that follow, so the highest possible score is 300, which takes twelve
  strikes in a row. The lane is coated with oil in a pattern the bowler cannot
  see. The ball slides on the oil and hooks where the lane is dry, and the
  oil moves as the game goes on. Reading that change is the skill of the
  sport.
