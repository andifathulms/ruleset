# The lane, from the measurements in play.yaml. Lengths are in feet. The lane
# is drawn much wider than it is, so the drawing is schematic.
sport: bowling
title: A long, narrow lane
caption: >
  The lane runs sixty feet from the foul line to the headpin and is 41.5
  inches wide, so it is drawn here far wider than it really is. The first
  part of the lane carries oil, and the ball slides there. Near the pins the
  lane is dry, and the ball grips and hooks. Where the oil ends depends on the
  pattern, which the bowler cannot see. A gutter runs along each side.
alt: >
  A bowling lane seen from above, with the foul line at the left, ten pins in
  a triangle at the right, a gutter along each side, and the path of a ball
  that runs straight over the oiled part and curves towards the pins on the
  dry part.
scale: schematic
view: [-11, -5, 77, 14]
