summary: >
  Kabaddi is played by two teams of seven on a small court split by a line.
  The teams take turns to send one player, the raider, into the other half.
  The raider tries to touch defenders and get back over the line, chanting
  "kabaddi" all the time on a single breath. Each defender touched is out,
  and if the defenders catch and hold the raider, the raider is out. There is
  no ball and nothing to carry. The chant is the heart of the game: it limits
  every raid to one breath, and the umpires judge it by ear.
