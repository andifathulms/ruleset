# The dressage arena, from the measurement in play.yaml. Shapes are in metres.
sport: equestrian
title: The dressage arena
caption: >
  Dressage is ridden in a rectangle 60 metres long and 20 metres wide.
  Lettered markers stand round the outside, and each movement of the test
  begins or ends at a marker. Only five of the letters are shown here.
  Jumping and cross-country have no fixed layout: a new course is designed
  for each competition.
alt: >
  A dressage arena 60 metres long and 20 metres wide, with the letters A and
  C at the middle of the short sides, E and B at the middle of the long sides
  and X at the centre.
scale: to-scale
