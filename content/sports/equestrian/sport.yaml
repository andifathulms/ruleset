summary: >
  Equestrian sport is contested by a rider and a horse together, and it has
  three Olympic disciplines. In jumping the pair rides a course of fences that
  fall when touched, and the fewest faults wins. In dressage the pair performs
  a set sequence of movements in a marked arena, and a panel of judges gives
  each movement a mark out of ten. Eventing has both, with a cross-country
  ride over fixed fences between them. Men and women compete against each
  other in every event. The horse is a competitor too: it has its own
  passport, a vet inspects it, and many of the rules exist to protect it.
