id: flying-disc
label: Flying disc
tagline: "The only sport at this level with no referee: the players call their own fouls, and the rulebook says why."
governing_body: World Flying Disc Federation
founded: >
  The modern plastic disc dates from 1948 and Wham-O's Frisbee from 1957;
  ultimate was codified by students in Maplewood, New Jersey, in 1968, and the
  World Flying Disc Federation was formed in 1985.
coverage: deep
family_colour: pitch
classification:
  official: flying-disc
  game-category: invasion
  adjudication: self-officiated
summary: >
  Ultimate is an invasion sport played with a disc, in which the person holding
  it may not run. What makes it structurally unlike everything else on this
  site is that it has no referee — players call their own fouls, resolve
  their own disputes, and the obligation to do so honestly is written into the
  rules as Spirit of the Game. Elite competition has spent thirty years
  arguing about whether that can survive being taken seriously.
