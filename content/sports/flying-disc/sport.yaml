summary: >
  Ultimate is the best-known sport played with a flying disc. Two teams of
  seven play on a long, narrow field with an end zone at each end. A player
  holding the disc may not run, so the disc moves only by passes. A team
  scores a point when one of its players catches a pass in the end zone it is
  attacking. If a pass is dropped, blocked or caught by the other team, that
  team takes the disc at once. Players may not touch each other. There is no
  referee: the players call their own fouls, under a rule named Spirit of the
  Game. The first team to 15 points wins.
