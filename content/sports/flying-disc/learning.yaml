sport: flying-disc
standing: editorial
summary: >
  Almost nothing stops you starting — a disc costs less than any other piece of
  equipment on this site — and the top of the sport asks for something no other
  sport asks for: to compete at full intensity while also officiating the
  person you are competing against.

entry:
  verdict: very-low
  claim: One disc, some cones, fourteen people. No referee to find and nothing to hurt you.
  why: >
    The entry cost is a disc. There are no goals, no posts, no nets, no
    protective equipment, and the field can be marked with cones on any flat
    grass — so a game requires people and nothing else.

    It also needs no officials, which is a bigger deal than it sounds: most
    invasion sports cannot be played competitively at a beginner level without
    someone willing to referee, and this one is designed to run without one.

    The skill barrier is a real but shallow one. A backhand throw is learnable
    in minutes; a forehand takes longer and is the thing beginners actually
    struggle with. Because the thrower cannot run, a new player is never
    required to beat anyone physically.
