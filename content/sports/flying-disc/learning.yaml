gap: >
  Very low to high, on the smallest equipment budget of any sport on this site.

  The interesting comparison is with flag football, which arrives at a similar
  gap by deliberately subtracting from an existing sport. Ultimate never had
  the parts to subtract: it was written in 1968 by students who were reacting
  against organised sport, and the absence of contact, referees and equipment
  is original rather than engineered.

  The gap's top half is unusual in kind rather than in size. Most sports get
  harder at the top because the physical and technical demands rise. Ultimate's
  do too, and then it adds an obligation — officiate honestly against your own
  interest, in front of a crowd, in a final — that is a different category of
  difficulty and cannot be trained the way a throw can.

