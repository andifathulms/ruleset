    - { label: Players needed, value: "14", basis: rule, rule: disc-1968-ultimate-codified }
    - { label: Kit to start, value: A disc and cones, basis: observation }
    - { label: Officials needed, value: None, basis: rule, rule: disc-spirit-of-the-game }
    - { label: Contact, value: Prohibited, basis: rule, rule: disc-1968-ultimate-codified }
    - { label: Time to a real game, value: One session, basis: judgement }

mastery:
  verdict: high
  claim: Elite endurance and disc skill, plus refereeing your opponent in the middle of the point.
  why: >
    The physical demand is genuine and underestimated. Ultimate is played in
    repeated maximal sprints with the disc in the air for long periods, on a
    hundred-metre field, in tournaments of several matches a day. Elite
    cutters cover distances comparable to other invasion sports at higher
    intensity per point.

    The disc adds a skill no other sport has: it flies on an aerodynamic curve
    that the thrower shapes at release, so throwing into wind, around a marker
    and to a moving receiver is a genuinely deep technical craft. The defence's
    equivalent — reading a disc in flight and timing a block — is harder still,
    because a disc decelerates and can be caught up with.

    What lifts the ceiling above comparable sports is the officiating burden.
    An elite player must call fouls against an opponent, accept calls made
    against them, and argue accurately about contact they were part of, at the
    exact moment they are least disinterested. No other sport at this level
    asks its athletes to do that, and the sport's own long-running argument
    about observers is evidence of how hard it is.
  evidence:
