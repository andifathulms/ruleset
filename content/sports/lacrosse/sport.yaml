id: lacrosse
label: Lacrosse
tagline: Invented a whole new format in 2021 to get into the Games, and is the only sport whose founding nation had to fight for the right to enter.
governing_body: World Lacrosse
founded: >
  Indigenous to the Haudenosaunee and other First Nations; codified in Montreal
  in 1867. World Lacrosse in its present form from 2019.
coverage: deep
family_colour: pitch
classification:
  official: lacrosse
  game-category: invasion
  adjudication: decided-by-score
summary: >
  Two things put lacrosse on this site. It invented a format — Sixes — in 2021
  specifically to meet Olympic requirements, which is the same move rugby made
  with sevens and the most explicit case of a sport designing a version of
  itself for admission. And it is the only sport here whose originating nation
  competes as a nation: the Haudenosaunee Nationals, whose people invented the
  game, have had to fight repeatedly for recognition and for the right to
  travel on their own passports.
