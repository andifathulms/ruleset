summary: >
  Lacrosse is played with a crosse, a stick with a net at its head. Players
  carry the ball in the net, pass it through the air and shoot at a goal
  guarded by a goalkeeper. A defender may knock the ball out of the net with a
  legal check, so no player holds it safely for long, and play can go from one
  goal to the other in seconds. The game has several forms. Field lacrosse is
  ten a side on a large pitch, box lacrosse is played indoors on a rink, and
  Sixes, the Olympic form, is six a side on a smaller field with a shot clock.
