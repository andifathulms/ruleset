    - { label: Players needed, value: "10", basis: rule, rule: fistball-1960-ifa }
    - { label: Kit to start, value: A ball and a tape, basis: observation }
    - { label: Bounce permitted, value: Once before each touch, basis: rule, rule: fistball-one-bounce, note: Removes the diving defence that makes volleyball hard to begin. }
    - { label: Field needed, value: 50 × 20 m, basis: observation }
    - { label: Time to a real game, value: One session, basis: judgement }

mastery:
  verdict: high
  claim: Precision from a closed fist, across a field twice the depth of a volleyball court.
  why: >
    The fist is the constraint that raises the ceiling. A volleyball setter
    shapes a ball with ten fingers; a fistball setter must place it accurately
    with a curved, unyielding surface the size of a fist, and the margin for
    error is far smaller. Elite setting in this sport is genuinely difficult
    and almost invisible to a spectator.

    The attack is a strike with a straight arm at a ball dropping out of the
    air, aimed into twenty-five metres of defended ground. Power alone achieves
    nothing on a field that size, so the attacker is solving an angle problem
    at speed.

    And the bounce that makes the sport easy to begin makes it harder to
    finish: a defence that is allowed one bounce can retrieve balls that would
    end a volleyball rally, so points must be won rather than merely started.

    The ceiling is flattened by the sport's size. There is a strong club
    structure in a handful of countries and effectively no professional layer.
