gap: >
  Low to high, and the sport is the cleanest natural experiment on this site
  for a single rule's effect on a learning curve.

  Fistball and volleyball are close relatives: a net sport, three touches, five
  or six a side, and a scoring system both rewrote within a year of each other.
  The one substantive difference is that fistball lets the ball bounce. That
  single permission moves the entry barrier down a full step, because the
  diving defence that makes volleyball punishing for beginners is simply not
  required — and it does not lower the ceiling at all, because retrievable
  defence means rallies have to be won outright.

  If you want evidence that a sport's accessibility is a property of its laws
  rather than of its culture, this is the pair to look at.

