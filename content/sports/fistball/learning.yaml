      value: No open hand
      basis: rule
      rule: fistball-fist-or-forearm
      note: The setting surface is small and curved, which is the sport's technical bottleneck.
    - label: Field depth
      value: 25 m per side
      basis: observation
      note: More than twice a volleyball court, so power alone does not win a rally.
    - label: Rally scoring
      value: Since 2000
      basis: rule
      rule: fistball-rally-scoring
      note: Every rally is a point, which raised the cost of a technical error.
