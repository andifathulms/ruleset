sport: fistball
standing: editorial
summary: >
  Much easier to start than volleyball, because the ball is allowed to land and
  nobody has to dive — and correspondingly hard at the top, because a closed
  fist is a poor instrument for precision and the field is enormous.

entry:
  verdict: low
  claim: A ball and a rope between two posts. The floor is not your enemy.
  why: >
    The bounce rule removes the single hardest thing about starting a net
    sport. In volleyball a beginner who fails to reach the ball has lost the
    rally, so the sport demands a diving, sprawling defence from the first
    session. In fistball the ball may land once, which converts defence from a
    reaction test into a positioning problem.

    Striking with a fist is also more intuitive than a volleyball dig or set:
    it is closer to hitting something than to controlling it.

    What holds the verdict at low rather than very low is the field. Twenty-five
    metres of depth per side needs a large piece of grass and ten people, which
    is a real organisational barrier outside the countries where clubs exist.
