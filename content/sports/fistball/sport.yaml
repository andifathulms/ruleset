summary: >
  Fistball is played five a side on a long grass field, split in the middle
  by a tape two metres up. Each side may touch the ball three times before it
  goes back over, and every touch must be with one closed fist or one forearm.
  The ball may bounce once before each touch. That bounce makes the game:
  defence is about being in the right place, not about diving, and the field
  can be fifty metres long because a ball that lands is still alive. Every
  rally scores a point, and a set goes to eleven.
