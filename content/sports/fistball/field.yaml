# The outdoor field, from the measurements in play.yaml. Shapes are in metres.
sport: fistball
title: A long field and a tape
caption: >
  The outdoor field is 50 metres long and 20 metres wide, with a tape across
  the middle. Each half is 25 metres deep, room for a ball that is allowed to
  bounce. The server must stand behind the service line, three metres from the
  centre line.
alt: >
  A fistball field 50 metres long and 20 metres wide, divided by a tape at the
  centre line, with a service line 3 metres from the centre on each side.
scale: to-scale
view: [-3, -3.5, 56, 26]
shapes:
  - { type: rect, x: 0, y: 0, w: 50, h: 20, fill: area }
  - { type: rect, x: 22, y: 0, w: 3, h: 20, fill: zone, line: none }
  - { type: rect, x: 25, y: 0, w: 3, h: 20, fill: zone, line: none }
  - { type: line, x1: 22, y1: 0, x2: 22, y2: 20, line: dashed }
  - { type: line, x1: 28, y1: 0, x2: 28, y2: 20, line: dashed }
  - { type: line, x1: 25, y1: -0.8, x2: 25, y2: 20.8, line: heavy }
  - { type: label, x: 25, y: -1.9, text: "tape", tone: muted }
  - { type: label, x: 21.5, y: 18.6, text: "service line", anchor: end, tone: muted }
  - { type: dot, x: 19.5, y: 7 }
  - { type: label, x: 19, y: 9.6, text: "server", anchor: end, tone: chalk }
  - { type: dim, x1: 0, y1: 21.8, x2: 25, y2: 21.8, text: "25 m" }
  - { type: dim, x1: 0, y1: 24.3, x2: 50, y2: 24.3, text: "50 m" }
  - { type: dim, x1: 53, y1: 0, x2: 53, y2: 20, text: "20 m" }
legend:
  - { swatch: zone, label: "the 3 m in front of the tape, where the server may not stand" }
  - { swatch: dashed, label: service line }
