standing: primary-named
summary: >
  Two Olympic events, contested once, at Paris in 2024. Breaking is not on the
  2028 programme, and the decision to leave it off was taken in October 2023 —
  before its only Games had been held.
disciplines:
  - id: breaking
    label: Breaking
    blurb: One against one, to music selected live.
    events:
      - { id: bboys, label: B-Boys, olympic: true, note: Contested at 2024 only. }
      - { id: bgirls, label: B-Girls, olympic: true, note: Contested at 2024 only. }
  - id: outside
    label: The form outside competition
    counts: false
    blurb: >
      Listed because breaking's competitive circuit is a small part of it, and
      the part the community is most ambivalent about.
    events:
      - { id: battles, label: Crew and solo battles, note: "The form's own competitive tradition, judged by respected practitioners without stated criteria." }
      - { id: cyphers, label: Cyphers and jams, note: Where the form is actually transmitted. }
      - { id: yog, label: Youth Olympic Games 2018, note: "Breaking's first appearance under Olympic governance." }
