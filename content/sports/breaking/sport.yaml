id: breaking
label: Breaking
tagline: A judging system invented for one Games, used once, and dropped before the next.
governing_body: World DanceSport Federation
founded: >
  Emerged in the Bronx in the early 1970s. Governed for Olympic purposes by the
  World DanceSport Federation from 2017.
coverage: deep
family_colour: gold
classification:
  official: breaking
  game-category: outside-taxonomy
  adjudication: judged
summary: >
  Breaking was contested at one Olympic Games and is not on the next programme.
  What it leaves behind is the Trivium: a judging system built from nothing for
  a dance form that had never been scored, using comparative sliders rather
  than absolute marks. It is the only scoring system on this site designed for
  a single Games, and the only sport here whose community substantially did not
  want the Olympic recognition it received.
