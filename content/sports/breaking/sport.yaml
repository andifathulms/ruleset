summary: >
  A breaking contest is called a battle. Two dancers face each other on a
  flat, smooth floor and take turns, in short rounds that usually last under
  a minute. A DJ chooses the music and the dancers have not heard it before,
  so nothing can be planned. Every round is made up on the spot from
  footwork, power moves and freezes. The judges give no marks out of ten. On
  each of five criteria they say which of the two dancers was better, and
  the result is a percentage split between the two.
