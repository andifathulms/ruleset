sport: breaking
standing: editorial
summary: >
  The cheapest sport on this site to begin and one of the most physically
  punishing to be good at. Breaking needs a floor and a speaker, which is
  almost nothing, and its elite movements load the wrists, shoulders and neck
  in ways the body is not built for.

entry:
  verdict: very-low
  claim: A flat surface and music. Nothing else is required at all.
  why: >
    Breaking has the lowest material barrier of anything here. There is no
    equipment, no facility beyond a smooth floor, no opponent needed to
    practise, no coach required and no governing structure to join. It grew in
    public spaces precisely because it needed none of those.

    It is also learned socially rather than institutionally. The form's
    transmission has always been through crews, jams and cyphers, which are
    free and open, and that has not changed because a federation now runs a
    competition.

    That combination — no cost, no facility, no gatekeeper — is unique on this
    board.
