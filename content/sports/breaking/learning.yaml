gap: >
  Breaking has the widest gap available on this board — very low to very high —
  and it is the only sport here whose entry barrier is genuinely zero.

  What makes it worth recording is the shape of the top. Every other judged
  sport on this site gives its athletes a standard: gymnastics has difficulty
  values, diving has a table, figure skating has elements. Breaking has none,
  by design, because the form had none to codify. A dancer's ceiling is not a
  score but the other dancers in the room.

  And uniquely here, the ceiling was removed. Breaking was dropped from the
  2028 Olympic programme in October 2023, ten months before it was first
  contested. Whatever the athletes did at their only Games could not have
  affected the decision — which is a fact about a sport's relationship with the
  Olympic movement, not about the sport.

