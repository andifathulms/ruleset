    - { label: Kit to start, value: None, basis: observation }
    - { label: Facility, value: A flat floor, basis: observation }
    - { label: Coach needed, value: "No", basis: judgement, note: The form is transmitted through crews rather than coaching structures. }
    - { label: Partner required, value: "No", basis: observation }
    - { label: Time to participate, value: Immediate, basis: judgement }

mastery:
  verdict: very-high
  claim: Improvised to music nobody warned you about, on joints the movements are not kind to.
  why: >
    Elite breaking demands power moves that load the wrists, shoulders and
    cervical spine in ways few activities do — headspins and airflares are
    performed on structures not designed to bear them — and career-shortening
    injury is common and under-discussed.

    The distinctive demand, though, is improvisation. A dancer does not hear
    the music in advance, so nothing can be choreographed. Every other judged
    sport on this site performs a prepared routine; breaking's competitors must
    generate material in real time, respond to a track chosen by a DJ, and
    avoid repeating themselves because vocabulary is a scored criterion.

    And the ceiling itself has no fixed shape. Trivium is comparative, so there
    is no score to chase, no personal best and no standard to reach — only
    other dancers.
