label: Air sports
tagline: A family of flying contests, from gliders and balloons to parachutes and racing drones, in which pilots are scored on speed, distance, accuracy or style.
governing_body: Fédération Aéronautique Internationale
founded: >
  The Fédération Aéronautique Internationale was founded in 1905 to certify
  aeronautical records, before the aeroplane was a practical machine.
