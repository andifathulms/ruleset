summary: >
  Air sports are many different contests held in the air under one
  federation. A glider pilot flies a course round turning points with no
  engine, staying up on rising air. A parachutist lands on a target, and the
  miss is measured to the centimetre. An aerobatic pilot flies a set sequence
  of figures for a panel of judges. A drone pilot stands on the ground and
  races a small aircraft through gates in about a minute. What the disciplines
  share is the air itself, which nobody can standardise: the weather on the
  day decides what is possible.
