id: flag-football
label: Flag football
tagline: "American football with the tackle removed — which turns out to change almost everything else."
governing_body: IFAF
founded: >
  Played in the United States military from the 1940s as a non-contact form of
  American football; codified internationally by IFAF, with world championships
  from 2002 and Olympic inclusion for 2028.
coverage: deep
family_colour: pitch
classification:
  official: flag-football
  game-category: invasion
  adjudication: decided-by-score
summary: >
  Removing the tackle from American football was supposed to make it safe.
  It also removed the offensive line, the punt, the run-first playbook and the
  two-hundred-pound body type, and what is left is a five-a-side passing game
  that fits in a fraction of the space. Flag football is the newest sport on the
  2028 programme and the only one whose founding rule is a subtraction.
