summary: >
  Flag football is played five a side on a small field with an end zone at
  each end. Every player wears a belt with a flag on each hip. The team with
  the ball has four plays to reach the halfway line and four more to reach the
  end zone, mostly by passing. A defender stops the ball carrier by pulling off
  one of their flags, and nobody may tackle, block or kick. A touchdown is
  worth six points. With no contact, size counts for little, and the game is
  about speed, catching and quick decisions.
cover: flag-football-the-pull
