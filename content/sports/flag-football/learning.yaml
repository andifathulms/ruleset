mastery:
  verdict: high
  claim: A passing game with no line to hide behind, decided in about two seconds.
  why: >
    Take away the tackle and you take away the offensive line, which is the
    thing that buys an American football quarterback time. In flag football the
    rush arrives almost immediately, the read must be made before it does, and
    there is no version of the play where a passer survives by being protected.

    The defensive equivalent is that a flag pull is a precision act performed at
    a sprint by someone who is not allowed to touch the ball carrier's body. It
    is harder than a tackle, not easier: a tackle can be imprecise and still
    work.

    The no-run zones and the tiered conversion make the game unusually
    strategic for its length — the choice of a one, two or three-point
    conversion is a live decision several times a match.

    The ceiling is lower than most sports here for one reason: the elite
    competitive history is short. The international format dates from 2002 and
    the sport has never been at a Games.
