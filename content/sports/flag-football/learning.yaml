gap: >
  Very low to high — the widest ratio on this site between how easy a sport is
  to start and how demanding it is at the top, and the only case where that gap
  was engineered rather than inherited.

  Every other sport here arrived at its entry barrier by accident of history.
  Flag football's low barrier is the product: the tackle, the equipment, the
  field size, the squad size and the kicking game were removed deliberately so
  that people could play. What remained turned out to be a fast, spatial,
  read-and-react game that rewards a different athlete entirely from the one
  American football rewards.

  It is also the sport with the shortest professional pathway on this site,
  which flattens the top of the curve. That will change if the 2028 Games do
  what its federation expects.

