sport: flag-football
standing: editorial
summary: >
  The easiest sport on this site to start, because it was designed to be, and
  much harder than it looks at the top, because with the collision removed the
  game becomes almost entirely about reading space in the first two seconds.

entry:
  verdict: very-low
  claim: A belt, a ball, a small field, ten people. No equipment and nothing that hurts.
  why: >
    Flag football exists because American football's barriers were removed one
    at a time. There is no protective equipment to buy, no contact to be
    frightened of, no full-size field to find, and a match takes forty minutes.

    Five a side means ten people make a game, and rolling substitution means an
    uneven number still does. Every player is an eligible receiver, so a
    beginner is never assigned to a position whose job is to be hit.

    What stops it being trivially easy is that the offence runs plays: even at
    a casual level someone must call something and four people must know what
    it means.
