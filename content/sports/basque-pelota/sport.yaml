id: basque-pelota
label: Basque pelota
tagline: "One specialty throws a ball at three hundred kilometres an hour; another is played with the bare hand, and ends careers through it."
governing_body: Federación Internacional de Pelota Vasca
founded: >
  Descended from medieval European handball games, codified across the Basque
  Country and beyond through the nineteenth century; the international
  federation was formed in 1929.
coverage: deep
family_colour: clay
classification:
  official: basque-pelota
  game-category: net-and-wall
  adjudication: decided-by-score
summary: >
  Not one game but a family of them, played against walls of three different
  lengths, in enclosed courts, with the bare hand, wooden bats, stringed
  rackets or a long curved wicker basket. The basket version, cesta punta,
  produces the fastest ball in any sport. The bare-hand version is the one the
  Basque Country actually watches, and it is played for money in front of
  bookmakers calling odds during the rally.
