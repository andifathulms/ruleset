summary: >
  Basque pelota is a family of games with one principle. Players strike a ball
  against a front wall in turn, and a player who cannot return it before it
  bounces twice loses the point. Everything else changes from one game to the
  next. The court may be an open one with a front wall and a long left wall,
  30, 36 or 54 metres long, or a closed one with a sloping roof inside it. The
  ball may be struck with the bare hand, a wooden bat, a stringed racket or a
  curved wicker basket. Each combination is a separate specialty with its own
  competition. Every rally scores a point, and a match is played to a target
  score with no clock.
