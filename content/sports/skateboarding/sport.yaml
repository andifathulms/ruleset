id: skateboarding
label: Skateboarding
tagline: A judged sport that refuses to publish a difficulty table, because the culture it came from does not agree there is one.
governing_body: World Skate
founded: >
  Emerged in California in the 1950s and 1960s. Governed for Olympic purposes
  by World Skate, which absorbed the roller sports federation in 2017.
coverage: deep
family_colour: gold
classification:
  official: skateboarding
  game-category: performance
  adjudication: judged
summary: >
  Skateboarding arrived at the Games in 2020 with the same problem breaking had
  four years later: a culture with its own competitive traditions, no absolute
  scoring scale, and an external federation asked to invent one in a hurry. It
  answered differently — holistic impression scores rather than a difficulty
  table — and it kept its Olympic place where breaking did not.
