summary: >
  A skater rides a wooden board on four small wheels and makes it jump, flip,
  slide and grind. Contests have two forms. Street is held on a course built
  like a piece of a city, with stairs, handrails and ledges. Park is held in a
  bowl of steep curved walls. Skaters go one at a time, and a panel of judges
  gives each run or single trick one score out of 100. There is no list of
  what each trick is worth, no required moves and no penalty for a fall beyond
  losing that score, so skaters try the hardest things they can do.
