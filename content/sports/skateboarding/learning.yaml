      rule: worldskate-2024-criteria-revision
    - label: Best scores count
      value: Failed attempts cost nothing
      basis: rule
      rule: worldskate-2020-format
      note: Encourages attempting the hardest available trick.
    - { label: Typical peak age, value: 18–26, basis: judgement, note: Among the youngest here, and the injury profile is why. }

gap: >
  Skateboarding has the widest gap available — very low to very high — and it
  shares that shape with breaking, for the same reasons: no equipment barrier,
  no facility barrier, no gatekeeper, and an elite standard set by cultural
  consensus rather than by a published document.

  The two sports diverge on what they did about it. Breaking built Trivium, a
  comparative system that avoids assigning absolute values. Skateboarding kept
  absolute scores and refused to publish what they are made of.

  Both are refusals to invent a difficulty table, arrived at independently, by
  the two sports on this site whose cultures most resemble each other. One kept
  its Olympic place and one did not, and nothing about the scoring explains
  which.

