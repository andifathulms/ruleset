summary: >
  Two competitors in the same weight category fight on an eight-sided mat for
  up to three rounds of two minutes. They score by kicking the opponent's
  trunk protector or head. A kick to the head is worth more than a kick to the
  body, and a spinning kick is worth more again. A punch to the body scores
  one point and a punch to the head is forbidden. Sensors in the protectors
  and in the fighters' socks register every kick that lands hard enough, so
  the equipment counts most of the points. The first competitor to win two
  rounds wins the contest.
