summary: >
  Softball is played by two teams of nine on a diamond of four bases set 60
  feet apart. One team bats while the other fields, and they swap after three
  outs. The pitcher throws underhand from a flat circle, and the batter tries
  to hit the ball and run round the bases to score a run. A game lasts seven
  innings, and the team with more runs wins. The pitcher stands very close to
  the batter, so the batter has little time to decide, and the ball can rise
  as it arrives. Runs are few, and one run often decides a game.
