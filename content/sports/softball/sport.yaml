id: softball
label: Softball
tagline: Invented the tie-breaker rule baseball adopted eighty years later, and shares an Olympic listing with the sport it is not.
governing_body: World Baseball Softball Confederation
founded: >
  Invented in Chicago in 1887 as an indoor version of baseball; the
  international federation formed in 1952, merging with baseball's in 2013.
coverage: deep
family_colour: pitch
classification:
  official: softball
  game-category: striking-and-fielding
  adjudication: decided-by-score
summary: >
  Softball is not small baseball. The pitch is underhand from forty-three feet,
  which gives a batter about the same reaction time as a baseball thrown from
  sixty — so the sport's central confrontation is comparably hard and looks
  nothing like it. It also solved extra innings decades before baseball did,
  with a rule baseball eventually copied, and it appears on the Olympic
  programme as half of a listing shared with a different sport.
