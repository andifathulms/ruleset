summary: >
  Each runner is handed a map at the start line and has never seen the ground
  before. The map shows a course of control points, and the runner must visit
  every one in order, using only the map and a compass. The route between two
  controls is the runner's own choice, and that choice decides most races.
  Runners start at intervals and navigate alone. An electronic chip records
  each control, the fastest time wins, and missing a control means
  disqualification. The race may be in forest, on moorland or dunes, or
  through the streets of a town.
