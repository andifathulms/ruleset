sport: finswimming
standing: editorial
summary: >
  If you can already swim, the first length in a monofin is exhilarating and
  immediate. Everything after that is a whole-body undulation trained over
  years, in a sport with clubs in relatively few countries.

entry:
  verdict: moderate
  claim: You must already swim, find a club that owns monofins, and get pool time.
  why: >
    The prerequisite is real: this is not a sport you can begin without being a
    competent swimmer, and it needs a lane in a pool, which is the most
    contested facility in amateur sport almost everywhere.

    The equipment is the second barrier. A monofin is a specialised item that
    beginners borrow from a club rather than buy, and clubs exist in a limited
    set of countries — mostly those with a CMAS-affiliated diving federation
    that runs racing.

    What makes it moderate rather than high is that the first experience is
    genuinely easy and genuinely thrilling. A swimmer putting on a monofin moves
    faster than they ever have under their own power, immediately, and the
    basic dolphin kick is intuitive enough to produce that on the first
    attempt.
