id: finswimming
label: Finswimming
tagline: "The fastest a human can move through water, and a sport that could never ban its equipment because the equipment is the sport."
governing_body: CMAS
founded: >
  Governed since 1959 by CMAS, the world underwater federation founded with
  Jacques Cousteau as its first president; the first finswimming world
  championships were held in 1976.
coverage: deep
family_colour: pool
classification:
  official: finswimming
  game-category: performance
  adjudication: measured
summary: >
  Racing in a pool with a monofin — a single large fin worn on both feet, driven
  by a dolphin kick — and, in the surface events, a snorkel. It is substantially
  faster than swimming over the same distances, which makes it the quickest
  form of human-powered movement in water. It also occupies the opposite corner
  from swimming on this site's central question: swimming banned the supersuits
  and kept the records, while finswimming cannot ban its equipment at all.
