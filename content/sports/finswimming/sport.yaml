summary: >
  Finswimming is racing in a fifty-metre pool, in lanes, against the clock.
  The swimmer wears a monofin, a single large blade on both feet, and drives
  it with a dolphin kick of the whole body. The same distances are raced in
  three ways: on the surface with a snorkel, under the water on one breath,
  and under the water with a cylinder of compressed air. A fourth discipline
  uses two ordinary fins. The fastest time wins, and each discipline keeps
  its own records.
