    caused_by: finswimming-1976-disciplines
    kind: scoped
    note: >
      Surface, apnea and immersion codified as separate disciplines. Times
      across them are not comparable.
  - at: 1976
    caused_by: finswimming-monofin-regulation
    kind: scoped
    note: >
      Monofin and bi-fins records are kept apart, because the equipment defines
      the event rather than assisting it.
