summary: >
  Golf is played over a course of eighteen holes laid out across open land.
  On each hole the player hits the ball from a starting point towards a small
  hole in the ground, and counts every stroke. The ball is played from
  wherever it comes to rest, in long grass or sand as well as on short turf,
  and that one principle is why the rulebook is long. The lowest total of
  strokes wins. No two courses are alike, and the players do not interfere
  with each other, so the real opponent is the course. Players are expected
  to call penalties on themselves.
