summary: >
  Soft tennis is played on a tennis court with a hollow rubber ball that
  weighs about thirty grams, half as much as a tennis ball. The ball loses
  speed quickly, so a hard shot does not get past a good opponent. Players
  win points with angle, depth and changes of pace, and rallies are long.
  Doubles is the main form of the game. One partner plays forward at the net
  and the other plays back at the baseline. A game is the first to four
  points, and a match is the best of five, seven or nine games, with no sets.
