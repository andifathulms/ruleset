id: soft-tennis-stats
label: Match statistics
unit: points per game
higher_is_better: true
absence_kind: unpublished
cannot_exist: >
  Soft tennis's numbers are not comparable with tennis's and were never meant to
  be, which this site notes only because the two sports share a court, a net and
  a name.

  A soft tennis game is four points, not fifteen-thirty-forty. There is no set.
  The serve is not a weapon, so there is no service-hold structure and nothing
  that corresponds to a break point. Rallies are much longer, because a
  thirty-gram ball cannot be hit through anybody. Every rate statistic in the
  sport describes a different game.

  Internally, the sport has had no scoring rewrite of the kind that severed
  badminton, volleyball, table tennis and fistball between 1999 and 2006. Its
  four-point game predates international codification and has not been changed
  — so a continuous series is genuinely conceivable here, which is more than
  most racket sports on this site can say.

  Nothing is entered because nothing has been taken from a cited source. The
  competitive record lives in Japanese, Korean and Taiwanese domestic
  competition and has not been assembled internationally.
