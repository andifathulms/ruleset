sport: soft-tennis
title: The court, with a doubles pair in place
caption: >
  Soft tennis uses a court the size of a tennis doubles court. In doubles,
  the main form of the game, each pair has a forward player close to the net
  and a back player near the baseline. Singles uses the narrower court inside
  the side strips.
