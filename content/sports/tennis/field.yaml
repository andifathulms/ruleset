# The court, from the measurements in play.yaml. Shapes are in metres.
sport: tennis
title: One court, two widths
caption: >
  The whole rectangle is the doubles court. In singles the two strips at the
  sides, the tramlines, are out. A serve must land in the service box
  diagonally opposite the server, between the net and the service line.
