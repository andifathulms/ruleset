summary: >
  Tennis is played with a strung racket and a rubber ball on a court divided
  by a low net. A player serves the ball into the opposite service box, and
  the two sides hit it back and forth until one of them misses. The ball may
  bounce once on each side. Points are counted 15, 30, 40 and game. Six games
  win a set, and two or three sets win the match. There is no clock, so a
  match lasts as long as the scoring takes. The court can be grass, clay or
  a hard surface, and the ball bounces differently on each.
