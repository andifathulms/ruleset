# The boards and the water, seen from the side. Heights and depths are the
# facts in play.yaml. Widths and the shape of the pool floor are not, so the
# drawing is marked schematic.
sport: diving
title: The boards and the water, from the side
caption: >
  The platform is 10 metres above the water. The springboards are at 3 metres
  and 1 metre, and each is at least 4.8 metres long. The water must be deep
  enough to stop a diver who enters at speed: at least 4.5 metres under the
  platform and 3.7 metres under the 3-metre board. Heights and depths are
  shown in proportion. Widths are not.
alt: >
  A side view of a diving pool. A platform stands 10 metres above the water on
  the left, with water 4.5 metres deep below it. Springboards 3 metres and 1
  metre above the water are on the right, with water 3.7 metres deep below
  them.
scale: schematic
view: [-7, -3.5, 41, 17]
