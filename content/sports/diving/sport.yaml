summary: >
  A diver leaves a springboard at one or three metres, or a fixed platform at
  ten, performs somersaults and twists in the air, and enters the water.
  Every dive is chosen and declared before the competition. Its difficulty is
  a published number, worked out by formula. Seven judges mark how well the
  dive was done, from 0 to 10. The two highest and two lowest marks are thrown
  away, the middle three are added, and the sum is multiplied by the
  difficulty. So what a diver attempts is fixed in advance, and only the
  quality of the dive is judged. The highest total over five or six dives
  wins.
