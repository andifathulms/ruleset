sport: wrestling
title: A circle with a warning band
caption: >
  The contest area is a circle nine metres across. Its outer metre is the
  passivity zone, which tells the wrestlers that the edge is close. Stepping
  out of the circle gives a point to the opponent. The protection area
  around the circle is there for safety.
alt: >
  A square wrestling mat with a contest circle 9 metres across. The outer
  1 metre of the circle is a coloured band, the passivity zone, and a
  protection area 1.5 metres wide surrounds the circle.
