summary: >
  Two wrestlers of the same weight category meet on a circular mat and try to
  take each other down and control each other. Pinning both of the opponent's
  shoulders to the mat ends the bout at once. Otherwise points decide it:
  points for a takedown, for turning the opponent onto their back, for a high
  throw, and when the opponent steps off the mat. A bout is two periods of
  three minutes. There are two styles. In freestyle the legs may be attacked
  and used. In Greco-Roman every hold must be above the waist. A wrestler who
  will not attack is put on a clock and must score or give up a point.
