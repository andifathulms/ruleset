id: wrestling
label: Wrestling
tagline: Voted off the Olympic programme in 2013, and rewrote its rules and its governance in seven months to get back on.
governing_body: United World Wrestling
founded: >
  International federation founded 1912 as the IAWF; became FILA, and renamed
  United World Wrestling in 2014.
coverage: deep
family_colour: clay
classification:
  official: wrestling
  game-category: outside-taxonomy
  adjudication: combat
summary: >
  Every other sport on this site changed its rules because of an incident, a
  technology or an audience. Wrestling changed its rules because it had been
  voted off the Olympic programme and had seven months to persuade the IOC to
  reverse the decision. It rewrote its scoring, its bout structure, its
  leadership and its event programme inside that window, and it worked.
