summary: >
  Basketball is played by two teams of five on a hard indoor court with a
  basket at each end. Players move the ball by passing it or by bouncing it as
  they go, and score by dropping it through the other team's hoop: two points
  from close in, three from beyond a painted arc, one for a free throw. A team
  with the ball has 24 seconds to shoot, so the game never stops moving. The
  basket is what makes the sport. It lies flat and sits above everyone's
  head, so nobody can stand in front of it, and height, timing and position
  decide the game.
