# The FIBA court, from the measurements in play.yaml. Shapes are in metres.
sport: basketball
title: The court and the three-point arc
caption: >
  The international (FIBA) court. A shot from inside the arc scores two points
  and a shot from beyond it scores three. The arc is 6.75 metres from the
  centre of the basket and runs straight along the sidelines in the corners.
  The rectangle under each basket is the key, where an attacker may stay for
  three seconds at most. The small semi-circle under the basket is the
  no-charge semi-circle.
alt: >
  A basketball court 28 metres long and 15 metres wide, with a basket, a
  rectangular key and a three-point arc at each end, and a centre circle on
  the halfway line.
