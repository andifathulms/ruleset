summary: >
  Twenty paddlers sit in pairs on ten fixed benches, facing forwards, each
  with a single-bladed paddle. A drummer sits at the front, facing them, and
  beats the rhythm of the stroke. A steerer stands at the back with a long
  oar. Boats race in lanes on flat water over 200, 500 or 2000 metres, and the
  first across the line wins. The boat is wide and steady, so a beginner can
  join a crew on the first day. The hard part is at the top: twenty people
  have to put their paddles in and take them out at exactly the same moment.
