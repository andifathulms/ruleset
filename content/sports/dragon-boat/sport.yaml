id: dragon-boat
label: Dragon boat
tagline: "Twenty-two people in the boat, two of whom are not paddling: a drummer beating time at the bow and a steerer at the stern."
governing_body: International Dragon Boat Federation
founded: >
  A Chinese festival tradition more than two thousand years old, raced
  competitively in Hong Kong from 1976; the International Dragon Boat
  Federation was formed in 1991.
coverage: deep
family_colour: pool
classification:
  official: dragon-boat
  game-category: performance
  adjudication: measured
summary: >
  Twenty paddlers on ten benches, a drummer facing them at the bow, and a
  steerer standing at the stern. The drummer is a competitor whose entire
  function is rhythm — no other racing sport covered here carries someone whose
  job is to keep time. It is also the only sport on this site with a
  medical-rehabilitation constituency written into its world championships.
