summary: >
  A surfer paddles into a breaking wave, stands up on a board and rides along
  it, turning and sometimes leaving the water altogether. Contests are run in
  heats of two to four surfers that last twenty to thirty-five minutes. Five
  judges score every ride out of ten, and a surfer's two best waves are added
  to make the heat total. The sea is what makes the sport: no two waves are
  the same, one wave carries one surfer, and nobody knows when the next good
  one will come. A priority rule decides who may choose a wave first.
