id: surfing
label: Surfing
tagline: Judged on waves that arrive by chance, and about to be able to standardise them for the first time.
governing_body: International Surfing Association
founded: International Surfing Federation founded 1964; ISA in its present form from 1976.
coverage: deep
family_colour: gold
classification:
  official: surfing
  game-category: performance
  adjudication: judged
summary: >
  Rowing and sailing decided their conditions could not be standardised and
  changed what their numbers claim. Surfing has the same problem in its most
  extreme form — competitors are scored on waves that arrive by chance, and two
  surfers in the same heat do not get the same waves — and it is the only sport
  on this site about to acquire the ability to remove the variable. Wave pools
  can produce an identical wave on demand, which would make surfing comparable
  for the first time and would change what the sport is.
