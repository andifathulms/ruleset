sport: surfing
as_of: 2026-09
source: isa-rules
standing: primary-named
summary: >
  Two Olympic events, on shortboards, and a venue question that no other sport
  on the programme faces: the competition has to be held where the waves are,
  which in 2024 meant fifteen thousand kilometres from the host city, and in
  2028 means a machine.
disciplines:
  - id: shortboard
    label: Shortboard
    blurb: The Olympic discipline.
    events:
      - { id: men, label: "Men's shortboard", olympic: true }
      - { id: women, label: "Women's shortboard", olympic: true }
  - id: other
    label: Governed by the federation, not on the programme
    counts: false
    events:
      - { id: longboard, label: Longboard, note: Judged on different criteria — style and nose-riding rather than power manoeuvres. }
      - { id: sup, label: Stand-up paddle }
      - { id: bigwave, label: Big wave, note: "Contested by invitation when conditions allow; no fixed calendar at all." }
      - { id: para, label: Para surfing, olympic: false }
