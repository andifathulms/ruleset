sport: surfing
as_of: 2026-09
source: isa-rules
standing: primary-named
summary: >
  Two Olympic events, on shortboards, and a venue question that no other sport
  on the programme faces: the competition has to be held where the waves are,
  which in 2024 meant fifteen thousand kilometres from the host city, and in
  2028 means a machine.
disciplines:
  - id: shortboard
    label: Shortboard
    blurb: The Olympic discipline.
    events:
      - { id: men, label: "Men's shortboard", at: [olympic] }
      - { id: women, label: "Women's shortboard", at: [olympic] }
  - id: other
    label: Contested away from the Games
    counts: false
    events:
      - { id: longboard, label: Longboard, note: Judged on different criteria — style and nose-riding rather than power manoeuvres., at: [world-championship] }
      - { id: sup, label: Stand-up paddle, at: [world-championship] }
      - { id: bigwave, label: Big wave, note: "Contested by invitation when conditions allow; no fixed calendar at all.", at: [professional] }
      - { id: para, label: Para surfing, at: [world-championship] }
