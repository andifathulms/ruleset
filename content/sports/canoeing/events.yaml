sport: canoeing
as_of: 2026-09
source: icf-rules
standing: primary-named
summary: >
  Two disciplines and sixteen Olympic events, with the programme rebalanced
  repeatedly for gender parity within a fixed quota — which is how women's
  canoe events finally arrived in 2021, by removing men's events to make room.
disciplines:
  - id: sprint
    label: Sprint
    blurb: Flat water, buoyed lanes, timed to a thousandth.
    events:
      - { id: k1-1000, label: "K-1 1000 m", at: [olympic], count: 2 }
      - { id: k1-500, label: "K-1 500 m", at: [olympic], count: 2 }
      - { id: k2-500, label: "K-2 500 m", at: [olympic], count: 2 }
      - { id: k4-500, label: "K-4 500 m", at: [olympic], count: 2 }
      - { id: c1, label: "C-1", at: [olympic], count: 2, note: "Women's C-1 added for 2021." }
      - { id: c2, label: "C-2 500 m", at: [olympic], count: 1 }
  - id: slalom
    label: Slalom
    blurb: Whitewater, hanging gates, time plus penalties.
    events:
      - { id: k1-slalom, label: "K-1 slalom", at: [olympic], count: 2 }
      - { id: c1-slalom, label: "C-1 slalom", at: [olympic], count: 2, note: "Women's C-1 slalom added for 2021." }
      - { id: kayak-cross, label: Kayak cross, at: [olympic], count: 2, note: "Added 2024. Four boats, contact permitted, a required roll." }
  - id: other
    label: Contested away from the Games
    counts: false
    events:
      - { id: marathon, label: Canoe marathon, at: [world-championship, world-games] }
      - { id: polo, label: Canoe polo, at: [world-championship, world-games] }
      - { id: freestyle, label: Freestyle kayak, note: Judged, on a single whitewater feature., at: [world-championship, world-games] }
      - { id: para, label: Paracanoe, at: [paralympic] }
