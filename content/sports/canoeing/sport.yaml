id: canoeing
label: Canoeing
tagline: One federation, two boats, and two disciplines that share nothing but a paddle.
governing_body: International Canoe Federation
founded: International Representation for Canoeing founded 1924; ICF from 1946.
coverage: deep
family_colour: pool
classification:
  official: canoeing
  game-category: performance
  adjudication: measured
summary: >
  Canoeing is two sports under one name. Sprint is a straight-line race on flat
  water, timed to a thousandth. Slalom is a technical descent of a whitewater
  course against a clock with time penalties for touching gates. They share a
  paddle and a federation, and for a long time they did not share the same
  events for men and women — canoe classes were closed to women at the Games
  until 2020, which is the latest such exclusion of any sport on this site.
