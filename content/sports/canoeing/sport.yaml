summary: >
  There are two boats and two main kinds of race. A kayak is paddled sitting
  down with a paddle that has a blade at each end. A canoe is paddled kneeling
  with a single blade. In sprint, boats race side by side in straight lanes on
  flat water and the first across the line wins. In slalom, one boat at a time
  goes down a whitewater course through a set of hanging gates. Touching a
  gate adds two seconds and missing one adds fifty, and the lowest total wins.
  In kayak cross, four boats go down the whitewater together.
