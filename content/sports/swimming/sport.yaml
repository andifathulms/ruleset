id: swimming
label: Swimming
tagline: Same problem as the javelin. Opposite decision. The records stand.
governing_body: World Aquatics
founded: >
  Fédération Internationale de Natation founded 1908; renamed World Aquatics
  in 2023.
coverage: deep
family_colour: pool
classification:
  official: aquatics
  game-category: performance
  adjudication: measured
summary: >
  The reference case for this whole site. Polyurethane suits were banned with
  effect from 2010, and the records set in them were allowed to stand — which
  is why several are still unbeaten more than fifteen years later. Athletics
  faced the same situation with the javelin in 1986 and reset the record book.
  Two governing bodies, the same facts, opposite rulings, and both are visible
  here on the same page.
