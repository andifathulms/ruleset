summary: >
  Swimmers race side by side in a pool, each in a separate lane, and the first
  to touch the wall at the end of the distance wins. There are four strokes:
  freestyle, backstroke, breaststroke and butterfly. Freestyle means any
  style, and everyone swims the front crawl because it is fastest. The other
  three are defined by the rulebook, and a swimmer who breaks the definition
  is disqualified. Times are taken to one hundredth of a second by a pad the
  swimmer touches. Swimming underwater is faster than swimming on the surface,
  so the rules limit it to 15 metres after the start and after each turn.
