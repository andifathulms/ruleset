gap: >
  Low to high, and kurash is most interesting held directly against judo, which
  this site covers in depth.

  Judo was created in the 1880s by taking ju-jitsu and removing what could not
  be practised safely at full resistance. It has kept removing things since:
  leg grabs were restricted from 2010 and banned outright in 2013, and the
  ground phase has been repeatedly shortened. Each removal was argued as
  protecting judo's identity against wrestling.

  Kurash is what that process arrives at. Standing only, no leg grabs, no
  submissions, no ground. It did not get there by legislating; it was codified
  that way in 1998 from a tradition that had always been that way.

  So the site now holds three points on one line — ju-jitsu, which legislates
  that a bout pass through every range; judo, which has been narrowing towards
  one; and kurash, which starts there.

