sport: kurash
standing: editorial
summary: >
  The simplest grappling sport on this site to understand and to begin, because
  three-quarters of what a judoka or a wrestler must learn is not in it — and a
  ceiling that is narrow, deep and largely confined to one region.

entry:
  verdict: low
  claim: A jacket and a mat. There is no ground phase to learn and nothing that submits you.
  why: >
    Kurash removes the parts of grappling that beginners find hardest and most
    unpleasant. There is no groundwork, so nobody is pinned underneath anybody.
    There are no submissions, so nobody is choked or has a joint attacked. There
    are no leg grabs, so the technical vocabulary is narrower and can be taught
    faster.

    What is left — grips, movement, balance, throws — is learnable, and a
    beginner can contest a bout meaningfully within months rather than years.

    The barrier is finding a club. Outside Central Asia and a handful of other
    countries, kurash gyms are rare, and most people who want jacket wrestling
    will find judo instead.
  evidence:
    - { label: Kit to start, value: Jacket, trousers and belt, basis: observation }
    - { label: No groundwork, value: At all, basis: rule, rule: kurash-standing-only, note: The phase beginners find hardest is simply absent. }
    - { label: No submissions, value: None permitted, basis: rule, rule: kurash-standing-only }
    - { label: Clubs, value: Scarce outside Central Asia, basis: judgement }
    - { label: Time to a first bout, value: Months, basis: judgement }

mastery:
  verdict: high
  claim: One phase of grappling, contested with nowhere to hide and nothing to fall back on.
  why: >
    Narrowing a sport does not make its top easy; it makes it exposed. A kurash
    competitor has one way to win — the throw — and no ground phase to escape
    into, no submission to catch someone with, and no leg attack to change
    range with. Every bout is the same contest, and a competitor who cannot win
    grips cannot do anything else.

    Bouts end abruptly. A clean throw finishes the contest at once, so a single
    lapse at any moment in four minutes is the whole match, and there is no
    equivalent of judo's ground scramble to recover in.

    The ceiling is bounded by the sport's reach. Uzbekistan and its neighbours
    dominate, the Asian Games is the summit, and there is no professional
    structure. A world champion has reached the top of a sport that is twenty-
    five years old as a codified competition.
