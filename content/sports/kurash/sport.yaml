id: kurash
label: Kurash
tagline: "Jacket wrestling with no groundwork and no grabbing below the waist — everything judo has spent fifteen years removing, absent from the start."
governing_body: International Kurash Association
founded: >
  An Uzbek wrestling tradition of great antiquity, codified as an international
  sport in 1998 by Komil Yusupov, with the International Kurash Association
  formed in Tashkent the same year.
coverage: deep
family_colour: clay
classification:
  official: kurash
  game-category: outside-taxonomy
  adjudication: combat
summary: >
  Standing jacket wrestling: throw your opponent onto their back and the bout
  ends. There is no groundwork, no submission, no strangle and no grabbing
  below the waist — the contest exists entirely in the upright grappling phase.
  It was codified in 1998 as a deliberate national-heritage export by
  Uzbekistan, and reached the Asian Games twenty years later.
