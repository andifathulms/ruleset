summary: >
  Two wrestlers in jackets and belts, one in blue and one in green, face each
  other standing on a mat. Each grips the other's jacket or belt and tries to
  throw. A clean throw onto the back is called halal, and it ends the bout at
  once. A throw that falls short scores chala. Nothing happens on the ground:
  when the wrestlers go down, the referee stops them and stands them up
  again. There are no pins, no strangles and no locks, and no one may hold
  anything below the waist. The whole sport is the standing fight for a grip
  and a throw.
