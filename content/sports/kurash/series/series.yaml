id: kurash-series
label: A measurable series
unit: none
higher_is_better: true
absence_kind: impossible
cannot_exist: >
  Kurash produces nothing continuous to chart, and the reasons are the same
  ones every combat sport on this site gives, arriving faster because the sport
  is young.

  A bout is won by a clean throw, by accumulated partial scores, or by an
  opponent's penalties. There is no time, no margin and no aggregate. The
  quantitative output of a competition is a bracket.

  The codified sport is twenty-five years old. Even if a scoring rate were
  compiled, the series would begin in 1998 and would sit alongside a
  competitive record dominated by one region — Uzbekistan and its neighbours
  have won the great majority of what there is to win, so a rate would largely
  measure how often they met somebody else.

  What can be said without numbers is the comparison this site cares about.
  Kurash's rules exclude the ground phase, submissions and leg grabs entirely,
  which is where judo has been travelling since 2010. The two sports are not
  comparable statistically and they are directly comparable structurally, and
  the second is the more interesting of the two.
