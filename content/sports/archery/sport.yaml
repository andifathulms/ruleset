id: archery
label: Archery
tagline: Replaced the score with the scoreline in 2011, and made its own results incomparable overnight.
governing_body: World Archery Federation
founded: >
  Fédération Internationale de Tir à l'Arc founded 1931; renamed World Archery
  Federation in 2011.
coverage: deep
family_colour: pool
classification:
  official: archery
  game-category: target
  adjudication: measured
summary: >
  Archery is the purest measured sport on this site: a number produced by where
  an arrow landed, with no judgement and no opponent involved. Which makes what
  it did in 2011 remarkable. It stopped adding the numbers up. Head-to-head
  matches are now scored in sets, so the winner is not necessarily the archer
  who shot better — and every match score before that date is measured in a
  unit the sport no longer uses.
