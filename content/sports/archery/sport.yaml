summary: >
  An archer stands on a line and shoots arrows at a target 70 metres away. The
  target has ten rings, worth 10 points at the centre down to 1 at the edge.
  First every archer shoots 72 arrows and the points are added up to rank the
  field. Then two archers at a time meet in a match, shooting in turn with
  twenty seconds for each arrow. A match is played in sets of three arrows,
  and the first archer to six set points wins. Nothing one archer does can
  touch the other's arrow. The contest is against the target, the wind and
  your own nerves.
