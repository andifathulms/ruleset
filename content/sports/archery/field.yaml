# The target face, from the measurements in play.yaml. Shapes are in
# centimetres.
sport: archery
title: Ten rings, 70 metres away
caption: >
  The target face is 122 centimetres across and stands 70 metres from the
  archer. It has ten rings of equal width. The centre ring scores 10 and the
  outside ring scores 1. An arrow that touches a line scores the higher
  value. The small ring inside the ten is the inner ten, used to break ties.
alt: >
  A round archery target face 122 centimetres across, with ten rings of equal
  width. The centre ring, 12.2 centimetres across, is marked 10 and the
  outside ring is marked 1.
