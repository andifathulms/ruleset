summary: >
  Six crews line up side by side in separate lanes and race 2000 metres in a
  straight line. The rowers sit facing backwards and drive the boat with oars,
  two each in sculling and one each in sweep rowing. A boat carries one, two,
  four or eight rowers, and the eight also carries a coxswain who steers. The
  first boat across the line wins. Crews never touch, so the race is decided
  by power, timing and the wind and water of that day. Because the conditions
  are different every day, the fastest times are called world best times and
  are not called records.
