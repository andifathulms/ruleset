id: squash
label: Squash
tagline: The fifth sport in the broadcast scoring wave, and the only racket sport where both players stand in the same space.
governing_body: World Squash Federation
founded: >
  Codified at Harrow School in the nineteenth century; the international
  federation formed in 1967.
coverage: deep
family_colour: clay
classification:
  official: squash
  game-category: net-and-wall
  adjudication: decided-by-score
summary: >
  Volleyball rewrote its scoring in 1999, table tennis in 2001, squash in 2004
  and badminton in 2006 — four federations, one stated reason, inside seven
  years. Squash's version is the least known and among the cleanest: fifteen
  points with hand-in hand-out became eleven points with a point on every
  rally, and every match statistic before it stopped meaning the same thing.
  It also has an officiating problem no other racket sport has, because both
  players occupy the same court.
