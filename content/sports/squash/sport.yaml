summary: >
  Squash is played inside a room with four walls. The two players stand on the
  same floor and hit the ball in turn against the front wall, above a low
  strip called the tin. The ball may bounce once on the floor and may touch
  any wall on its way. A rally ends when a player cannot return it. Every
  rally scores a point, a game goes to 11, and a match is the best of five
  games. Because the players share the space, each must get out of the
  other's way, and the hardest rules in the sport are about what happens when
  one of them does not.
