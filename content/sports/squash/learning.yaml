sport: squash
standing: editorial
summary: >
  Among the easiest racket sports to have a real rally in, and among the
  hardest to be good at, for a reason peculiar to it: the difficulty is not
  hitting the ball but knowing where to stand, and a beginner cannot see that
  problem at all.

entry:
  verdict: low
  claim: A court, a racket and one other person. The walls return the ball for you.
  why: >
    Squash's court does the beginner a favour in the same way badminton's
    shuttle does. The ball comes back off the front wall whatever you do with
    it, the space is enclosed so nothing goes out of reach, and two novices can
    keep a rally going within minutes.

    It also needs less than tennis: a court a quarter the size, one other
    person, and no net to clear. Club and gym courts are widely available in
    the countries that play it.

    The barrier is the court itself, which is a building. A town either has
    squash courts or it does not, and they are steadily being converted to
    other uses in several countries.
  evidence:
    - { label: Players needed, value: "2", basis: observation }
    - { label: Kit to start, value: A racket and a ball, basis: observation }
    - { label: Facility, value: An enclosed court, basis: observation }
    - { label: Court size, value: 9.75 × 6.4 m, basis: observation, note: About a quarter of a tennis court. }
    - { label: Time to a real rally, value: One session, basis: judgement }

mastery:
  verdict: very-high
  claim: The decisive skill is where you stand, and you cannot see it happening.
  why: >
    Elite squash is a positional problem disguised as a hitting one. Because
    both players share the court, the whole sport is about controlling the
    centre — the T — and forcing your opponent away from it, and a player who
    holds it plays four fewer metres to every ball.

    That is invisible to a spectator and largely invisible to a beginner, which
    makes squash's gap unusually deceptive: the actions look the same at every
    level and the outcomes do not.

    The physical demand is at the top of racket sport. The rallies are long,
    the court is small, and the changes of direction are constant, which is why
    lowering the tin in 2001 and shortening the scoring in 2004 were both aimed
    at reducing attrition.
  evidence:
