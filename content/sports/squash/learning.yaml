      note: Shortened matches deliberately, and severed the sport's statistics.
    - label: Tin lowered
      value: 19 in to 17 in
      basis: rule
      rule: wsf-2001-ball-and-tin
      note: A larger target, to reward attacking play over attrition.
    - label: Interference decisions
      value: Let, stroke or no let
      basis: rule
      rule: wsf-2019-video-review
      note: A judgement about what would have happened, made several times a game.
    - { label: Typical peak age, value: 25–32, basis: judgement }

gap: >
  Squash is low to very high, and it belongs beside badminton and table tennis
  rather than beside tennis. In all three the implement or the court keeps a
  beginner's rally alive; in all three the elite version is about information a
  novice cannot perceive.

  What is particular here is the shared court. Every other racket sport
  separates the players with a net, so interference cannot happen and the
  officiating is about where the ball landed. Squash puts both players in the
  same nine metres, which produces the sport's central skill — holding the
  centre — and its central officiating problem, which is deciding what would
  have happened if somebody had not been in the way.

  It is also the fifth sport on this site to have rewritten its scoring for
  broadcast between 1999 and 2006, and the only one that did it while
  campaigning for Olympic admission it did not receive for another nineteen
  years.

