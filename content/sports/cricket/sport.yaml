summary: >
  Cricket is played by two teams of eleven on a large oval field with a narrow
  22-yard pitch at its centre. One team bats and the other bowls and fields. A
  bowler bowls the ball at a wicket of three wooden stumps, and a batter
  defends it with a bat and tries to score runs, by running between the
  wickets or by hitting the ball to the edge of the field. The fielding side
  tries to get ten batters out. Then the teams swap, and the side with more
  runs wins. The same laws are played in three lengths, from about three hours
  to five days.
