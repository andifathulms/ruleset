# The pitch, from the measurements in play.yaml. Shapes are in feet.
sport: cricket
title: The pitch, wicket to wicket
caption: >
  The pitch is the strip at the centre of the ground: 22 yards between the two
  wickets and 10 feet wide. A crease is marked 4 feet in front of each wicket.
  The bowler bowls from one end and must not step past that line. The batters
  score by running from one end to the other. The oval field around the pitch
  has no fixed size and is not drawn.
alt: >
  A cricket pitch seen from above: a long narrow rectangle 22 yards long and 10
  feet wide, with a wicket in the middle of each short end and a line across
  the pitch 4 feet in front of each wicket.
scale: to-scale
view: [-9, -10, 78, 23]
