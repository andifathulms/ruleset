gap: >
  Cricket's gap is unusual because the bottom of it is intellectual rather than
  physical. Nothing about swinging a bat excludes anyone; the rules, the
  duration and the twenty-two people do.

  The sport is also the only one here to have attacked its own entry barrier
  deliberately and successfully. Twenty20 was designed in 2003 around how long
  a person will stay after work, and it worked — it is the most commercially
  successful rule change in this collection. That it also fractured the sport's
  statistics into three incomparable sets was accepted from the start, and
  handled correctly by never merging them.

  Compare volleyball, which invented a position to widen its physical door.
  Cricket invented a format to widen its temporal one.

