summary: >
  Ju-jitsu is contested on a mat in three systems. In Fighting, two athletes
  in jackets, gloves and shin guards go through three phases in a fixed
  order: controlled strikes at a distance, then throws, then groundwork with
  holds, locks and strangles. Ne-waza is groundwork alone, won on points for
  position or by submission. In Duo there is no opponent: two team-mates show
  defences against attacks the referee calls, and judges mark them against
  another pair. What sets the sport apart is that its main contest makes a
  fighter compete at every range, one after another.
