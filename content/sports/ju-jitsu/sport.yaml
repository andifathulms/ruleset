id: ju-jitsu
label: Ju-jitsu
tagline: "A combat sport that legislates the sequence of ranges — strike, throw, ground — and another event where two athletes from the same team fight nobody at all."
governing_body: Ju-Jitsu International Federation
founded: >
  Descended from Japanese battlefield grappling systems; the modern competitive
  sport was assembled by European federations from the 1970s, with the
  Ju-Jitsu International Federation taking its present form in 1998.
coverage: deep
family_colour: clay
classification:
  official: ju-jitsu
  game-category: outside-taxonomy
  adjudication: combat
summary: >
  The Fighting system runs a bout through three phases in a fixed order —
  striking at distance, then throwing, then groundwork — which makes it the
  only combat sport covered here that legislates the range the fight happens
  at. The Duo system goes further: two athletes from the same team perform
  defences against called attacks, judged, with no opponent. It is the parent
  art of judo, competing as a sport younger than its own descendant.
