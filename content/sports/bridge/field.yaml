# The table at a top event, with its screen. Bridge's laws give no table
# measurements in play.yaml, so the drawing is schematic.
sport: bridge
title: A table for four, split by a screen
caption: >
  Partners sit facing each other: North with South, East with West. At top
  events a screen runs diagonally across the table. Each player can see one
  opponent and cannot see their partner. Bids are passed under the screen on
  a tray, and the board sits in the middle.
alt: >
  A square table seen from above, with North, East, South and West seated on
  its four sides and a screen running from one corner to the opposite corner,
  so that North and East are on one side and South and West on the other.
scale: schematic
view: [-4.5, -3, 14.5, 13.2]
shapes:
  - { type: rect, x: 0, y: 0, w: 10, h: 10, fill: area }
  - { type: polygon, points: [[0, 0], [10, 0], [10, 10]], fill: zone, line: none }
  - { type: line, x1: -0.6, y1: -0.6, x2: 10.6, y2: 10.6, line: heavy }
  - { type: rect, x: 4.2, y: 4.2, w: 1.6, h: 1.6, fill: target, line: none }
  - { type: label, x: 6.3, y: 4.6, text: "board", anchor: start, tone: chalk }
  - { type: label, x: 1.3, y: -1.1, text: "screen", anchor: end, tone: muted }
  - { type: dot, x: 5, y: -1.6, label: "North" }
  - { type: dot, x: 5, y: 11.2, label: "South" }
  - { type: dot, x: -1.6, y: 5, label: "West" }
  - { type: dot, x: 11.6, y: 5, label: "East" }
legend:
  - { swatch: zone, label: "North and East's side" }
  - { swatch: area, label: "South and West's side" }
  - { swatch: target, label: "the board, on the tray" }
  - { swatch: heavy, label: the screen }
