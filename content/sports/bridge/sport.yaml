summary: >
  Four players sit around a table, each facing a partner, and each is dealt
  thirteen cards. First comes the auction: the players bid in
  turn, and each bid is a coded message about a hand. The side that bids
  highest wins the contract, a promise to take a number of tricks, and then
  tries to keep it in the play of the cards. Two rules make the game what it
  is. Partners may tell each other things only through their bids and cards,
  never by a pause or a look. And a pair must explain what its bids mean to
  the opponents whenever they ask. In competition the same deals are played
  at every table, so a score says how well a pair played the cards it held.
