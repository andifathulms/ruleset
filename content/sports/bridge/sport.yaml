id: bridge
label: Contract bridge
tagline: "A partnership game in which telling your partner anything is an offence, and telling your opponents everything is compulsory."
governing_body: World Bridge Federation
founded: >
  Contract bridge was devised in 1925 from earlier whist and auction bridge
  games; the World Bridge Federation was formed in 1958, and bridge was
  contested at the Asian Games from 2018.
coverage: deep
family_colour: gold
classification:
  official: bridge
  game-category: outside-taxonomy
  adjudication: decided-by-score
summary: >
  Four players in two partnerships, bidding for a contract and then playing it
  out. Two rules make it unlike anything else here. You may not communicate
  with your partner except through the bids and cards themselves — a hesitation
  or a tone of voice is an ethical violation. And your partnership's private
  agreements must be fully disclosed to your opponents on request. The secret
  is kept from the person you are playing with.
