summary: >
  Carom, pool and snooker are played with a cue on a cloth-covered table, one
  player against one. In each, the player strikes the white cue ball so that
  it hits other balls. A carom table has no pockets, and a point is scored
  when the cue ball touches both of the other two balls. Pool and snooker
  tables have six pockets, and the aim is to knock balls into them. A player
  stays at the table for as long as each shot scores, so the real skill is
  leaving the cue ball in the right place for the next shot. The three tables
  differ in size, and a player of one game cannot simply compete at another.
