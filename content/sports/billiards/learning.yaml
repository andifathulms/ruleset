gap: >
  Very low to very high, and the perception gap is the point.

  A pub pool table has wide pockets, a short bed and a heavy ball, and it
  flatters everyone. A competition snooker table is twelve feet long with
  pockets cut tight enough that a ball struck a millimetre off line rattles out
  from distance. They are not the same activity, and almost nobody who has
  played the first has seen the second in person.

  This site records the same structure in bowling, where a recreational oil
  pattern funnels the ball towards the pocket and a competition pattern does
  not — and in both cases the sport's enormous popular base is playing a
  version engineered to be forgiving, which recruits people and teaches them
  the sport is easy.

  The other half of the gap has nothing to do with skill: three codes, three
  tables, no crossover, and a professional structure that sits outside the body
  holding the recognition.

