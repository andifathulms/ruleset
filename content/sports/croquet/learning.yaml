    - { label: Bisques, value: Free turns, spent when you choose, basis: rule, rule: croquet-bisque-handicap }
    - { label: Kit to start, value: Provided by the club, basis: observation }
    - { label: Facility, value: A mown, level lawn, basis: observation }
    - { label: Physical demand, value: Very low; playable at any age, basis: judgement }

mastery:
  verdict: very-high
  claim: Running the whole course in one turn, through hoops barely wider than the ball, using three balls you did not choose the position of.
  why: >
    Association croquet's ceiling is one of the least visible on this site. A
    top player wins by taking a **break** — using the other three balls as
    stepping stones, croqueting each into the position it will be needed in
    several strokes later, and running hoop after hoop without the opponent
    playing.

    That requires planning a sequence many strokes ahead while executing
    croquet strokes that must send two balls to two different places with one
    swing. The elite version, the **triple peel**, involves knocking your
    partner ball through its remaining hoops during your own break so that the
    game can be finished before an opponent gets in.

    The precision is unforgiving: championship hoops are set with a clearance
    over the ball measured in fractions of a millimetre, so a hoop that would
    be a formality at club level is a genuine shot.

    **Golf croquet's** ceiling is different and not lower — with no breaks, every
    stroke is a tactical decision made against three other balls, and elite
    golf croquet is a positional game of extreme accuracy over distance.
  evidence:
    - label: The break
      value: A turn can last the whole game
      basis: rule
      rule: croquet-1868-codification
      note: A skilled player wins without the opponent taking a meaningful turn.
    - label: Hoop clearance
      value: Fractions of a millimetre
      basis: observation
      note: Championship hoops are barely wider than the ball.
    - label: Two balls each
