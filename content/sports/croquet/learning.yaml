gap: >
  Low to very high — and croquet's handicap makes the gap unusually *crossable*
  rather than unusually narrow.

  This site has now found three deliberate comparability solutions: golf's
  stroke handicap, polo's awarded goals, and croquet's bisques. All three come
  from sports played across enormous ability ranges in club settings, and
  croquet's is the most powerful of the three, because the recipient chooses
  when to spend it. Golf adjusts your score afterwards and polo adds goals
  before play; a bisque lets you undo the moment your game fell apart.

  The other thing croquet demonstrates is what happens when a sport's central
  mechanism is also its barrier. The break is the reason association croquet is
  beautiful and the reason it is hard to take up, and the federation's answer
  was not to change it but to run a second code without it. Golf croquet is now
  the larger game.

