sport: croquet
standing: editorial
summary: >
  Golf croquet is understood in one turn and association croquet takes years —
  and the handicap means a beginner can play a competitive match against a
  champion in either, which almost nothing else on this site can offer.

entry:
  verdict: low
  claim: A club with a lawn. Golf croquet is playable properly within an hour, and bisques make you competitive at once.
  why: >
    **Golf croquet** is the easiest competitive entry on this site after
    pétanque. One stroke per turn, all four balls contesting the same hoop, no
    roquets and no breaks — the rules take two minutes and a beginner is
    playing the real game immediately, not a simplified version of it.

    **Association croquet** is much harder to begin, because the break is the
    game and a beginner cannot construct one. That is precisely what the
    **bisque** is for: free turns spent when your break collapses, which is
    every turn at first.

    Between them, croquet is unusually good at letting a novice compete
    honestly against an expert. The barrier is the lawn — mown, level, and
    belonging to a club — which is a real facility requirement and the reason
    the sport lives where clubs exist.
