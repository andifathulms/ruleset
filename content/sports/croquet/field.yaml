# The lawn, from the measurements in play.yaml. Shapes are in yards.
sport: croquet
title: Six hoops and a peg
caption: >
  The four outer hoops stand 7 yards in from the two nearest boundaries. The
  two inner hoops stand on the long centre line, 7 yards either side of the
  peg. A ball runs the hoops in the order numbered, going up the lawn through
  1, 2, 5 and 6 and down it through 3 and 4. Then it runs all six again in the
  reverse order and direction, and finishes on the peg.
alt: >
  A croquet lawn 35 yards long and 28 yards wide. Four hoops stand near the
  corners, two more stand on the centre line, and a peg stands in the middle.
  The hoops are numbered 1 to 6 in the order they are run.
scale: to-scale
view: [-7, -3, 35, 40.5]
