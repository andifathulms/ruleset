id: croquet
label: Croquet
tagline: "Its club became Wimbledon and the tennis players took the lawns; its one Olympic appearance drew a single paying spectator."
governing_body: World Croquet Federation
founded: >
  Codified in England in the 1860s, with the first championship in 1867 and the
  All England Croquet Club founded in 1868; the World Croquet Federation was
  formed in 1986.
coverage: deep
family_colour: pool
classification:
  official: croquet
  game-category: target
  adjudication: decided-by-score
summary: >
  Two codes under one name. **Association croquet** lets a good player run the
  entire course in a single turn, so the sport's central skill is constructing
  a break and its central problem is that an opponent may not get to play.
  **Golf croquet** removed all of that — one stroke each, all four balls
  contesting one hoop — and has become the larger game. Contested at one
  Olympic Games, in 1900, with women among the competitors.
