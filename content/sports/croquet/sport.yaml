summary: >
  Croquet is played on a level grass lawn with six hoops and a peg in the
  centre. There are four balls. One side plays blue and black, the other red
  and yellow, and players strike them with a mallet. Croquet has two forms. In
  association croquet a player earns extra strokes by running a hoop or by
  hitting another ball, so a skilled player can keep one turn going for a long
  time, and the first side to 26 points wins. In golf croquet every turn is
  one stroke, all four balls go for the same hoop, and whoever runs it wins
  the point.
