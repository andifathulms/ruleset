summary: >
  Esports is a group of different video games played as organised
  competition. Each game has its own aim: destroy the other team's base,
  plant or defuse a bomb, knock out an opponent, score more goals. Players
  compete alone or in teams, often of five, at identical machines on a stage.
  The software decides everything that happens in play, so no referee ever
  judges a shot. A match is a series of games, usually the best of three or
  five. Each game belongs to the company that published it, and the company
  updates it every few weeks, so players keep having to learn it again.
