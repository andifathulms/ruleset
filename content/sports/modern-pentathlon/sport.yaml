id: modern-pentathlon
label: Modern pentathlon
tagline: Deleted one of its five disciplines after a single televised minute, and stopped being the sport its founder designed.
governing_body: Union Internationale de Pentathlon Moderne
founded: >
  Devised by Pierre de Coubertin for the 1912 Games; UIPM founded 1948.
coverage: deep
family_colour: gold
classification:
  official: modern-pentathlon
  game-category: outside-taxonomy
  adjudication: measured
summary: >
  The most drastic rule change on this site. In August 2021 a coach struck a
  horse that had refused a fence, on camera, at the Olympic Games. Within a
  year the federation had voted to remove riding from a sport that had been
  built around it since 1912, replacing it with obstacle racing from 2028.
  No other federation here has deleted an entire discipline in response to a
  single incident.
