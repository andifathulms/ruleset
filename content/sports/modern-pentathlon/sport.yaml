summary: >
  Modern pentathlon joins several sports into one competition for one athlete.
  The athlete fences with an épée, swims 200 metres, jumps a course on a horse
  drawn by lot, and then runs a course with stops to shoot a laser pistol. Each
  result becomes points on a common table. The points decide the start of the
  last race: the leader starts first and the others follow, each as far behind
  as their points say. So the first athlete across the finish line is the
  winner. The sport is replacing the riding with an obstacle course.
