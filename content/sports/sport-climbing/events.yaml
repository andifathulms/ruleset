sport: sport-climbing
as_of: 2026-09
source: ifsc-rules
standing: primary-named
summary: >
  Four Olympic events since 2024, up from two in 2020 — and the change is the
  sport's story. One combined medal per sex became two, because the three
  disciplines could not honestly be reduced to a single champion.
disciplines:
  - id: speed
    label: Speed
    blurb: >
      Fifteen metres, identical route worldwide since 2007, about five seconds.
      Its times are comparable in a way almost nothing else on this site is.
    events:
      - { id: sm, label: "Men's speed", olympic: true }
      - { id: sw, label: "Women's speed", olympic: true }
    # count defaults to 1 each
  - id: boulder-lead
    label: Boulder and lead
    blurb: >
      Combined on a shared hundred-point scale from 2024. The two disciplines
      climbers actually train together.
    events:
      - { id: blm, label: "Men's boulder and lead", olympic: true }
      - { id: blw, label: "Women's boulder and lead", olympic: true }
  - id: former
    label: The format that was abandoned
    counts: false
    events:
      - { id: combined2020, label: Combined, all three disciplines, note: "Contested at 2020 only. Scored by multiplying ranks; dropped after one Games." }
  - id: outside
    label: Governed by the federation, not on the programme
    counts: false
    events:
      - { id: paraclimbing, label: Paraclimbing, olympic: false }
      - { id: ice, label: Ice climbing, note: Contested at world level, on the Winter programme's fringe. }
