# The speed wall, seen from the front. play.yaml gives its length and angle but
# not its width or the positions of the holds, so the drawing is a schematic.
sport: sport-climbing
title: The speed wall
caption: >
  Speed is the one discipline with a fixed playing area. Two climbers race
  side by side on a wall that leans five degrees towards them. The route is
  fifteen metres long, and the holds are in the same positions in both lanes
  and on every speed wall in the world. Boulder and lead walls have no fixed
  layout, because their routes are built new for each competition.
alt: >
  A front view of a speed climbing wall with two tall lanes side by side. Each
  lane has the same pattern of holds, a climber at the bottom and the finish
  at the top, 15 metres up.
scale: schematic
view: [-6.5, -2.4, 12.5, 17.6]
