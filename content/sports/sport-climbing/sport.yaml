summary: >
  Sport climbing is contested on artificial walls fitted with holds for the
  hands and feet. In speed, two climbers race side by side up the same
  fifteen-metre route, and a run takes about five seconds. In boulder,
  climbers work out short problems close to the ground, with no rope and mats
  below, in as few attempts as they can. In lead, a climber on a rope has one
  attempt to get as high as possible on a long route. Boulder and lead routes
  are built new for every competition, and the climbers see them for the first
  time on the day. Reading an unknown route is as much a part of the sport as
  strength.
