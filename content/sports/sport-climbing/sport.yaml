id: sport-climbing
label: Sport climbing
tagline: Multiplied three disciplines' ranks together to make one medal, then abandoned it after a single Games.
governing_body: International Federation of Sport Climbing
founded: IFSC founded 2007, having separated from the mountaineering federation.
coverage: deep
family_colour: gold
classification:
  official: sport-climbing
  game-category: performance
  adjudication: measured
summary: >
  The newest sport on this site and the one that has rewritten its Olympic
  format between every Games it has contested. For 2020 it combined three
  disciplines into one medal by multiplying the ranks together, which produced
  a scoring system nobody could follow and results that turned on arithmetic
  rather than climbing. It was abandoned after one Games. Underneath that,
  speed climbing has something almost nothing else here has: an identical route
  worldwide, so its times genuinely are comparable.
