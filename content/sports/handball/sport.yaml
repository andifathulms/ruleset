summary: >
  Handball is played indoors by two teams of seven, six court players and a
  goalkeeper. Players pass a ball small enough to hold in one hand and try to
  throw it into the other team's goal. A player with the ball may take three
  steps and hold it for three seconds. In front of each goal is an area six
  metres deep that only the goalkeeper may stand in. Attackers may jump into
  it if they let go of the ball before they land, so most shots are thrown in
  mid-air. Defenders may block with the body, the game is fast and physical,
  and each team usually scores between 25 and 35 goals.
