id: handball
label: Handball
tagline: Legalised playing without a goalkeeper, and produced the most extreme risk-reward tactic in team sport.
governing_body: International Handball Federation
founded: >
  Codified in northern Europe in the 1910s and 1920s; the IHF in its present
  form from 1946.
coverage: deep
family_colour: pitch
classification:
  official: handball
  game-category: invasion
  adjudication: decided-by-score
summary: >
  A rule change in 2016 let a team substitute its goalkeeper for an outfield
  player at any time without restriction, and elite handball responded by doing
  it constantly — attacking seven against six with an empty net. It is the
  clearest recent example on this site of a permissive rule change producing a
  tactic nobody predicted, and the federation has spent a decade deciding
  whether it likes what it made.
