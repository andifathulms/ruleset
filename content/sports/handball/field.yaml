# The court, from the measurements in play.yaml. Shapes are in metres.
sport: handball
title: The court and the goal area
caption: >
  Only the goalkeeper may stand in the shaded goal area. Its line is six
  metres from the goal: straight in front of the goal and curved around each
  post. The dashed line is the free-throw line, nine metres out, where the
  attackers restart after a foul. The dot marks seven metres, where the
  penalty throw is taken.
alt: >
  A handball court 40 metres long and 20 metres wide, with a goal in the
  middle of each end, a D-shaped goal area six metres deep in front of it and
  a dashed free-throw line nine metres out.
