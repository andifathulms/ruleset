summary: >
  Roller sports are three different contests that share wheels. In artistic
  skating, skaters perform routines of jumps, spins and dance on quad skates
  and a panel of judges marks them. In speed skating, racers on inline skates
  go round banked tracks and road circuits, over anything from 200 metres to a
  marathon, and the first across the line wins. Rink hockey is a team game:
  five a side on quad skates, in a rink with boards all round, hitting a hard
  ball with curved sticks into a goal. The three use different skates and
  different skills, and almost no skater competes in more than one.
