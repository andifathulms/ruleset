id: roller-sports
label: Roller sports
tagline: "Every discipline is the wheeled twin of a Winter Olympic sport, and none of them is Olympic — except the one with no ice equivalent, which got in."
governing_body: World Skate
founded: >
  The Fédération Internationale de Roller Sports was founded in 1924; it merged
  with the international skateboarding body in 2017 to become World Skate.
coverage: deep
family_colour: gold
classification:
  official: roller-sports
  game-category: outside-taxonomy
  adjudication: judged
summary: >
  Artistic roller skating is figure skating on wheels, judged the same way.
  Roller speed skating is speed skating without ice. Rink hockey is a stick and
  ball game on quad skates. Each has an ice counterpart on the Winter Olympic
  programme and none of them has ever been on a programme itself — while
  skateboarding, the one discipline under the same federation with no ice twin,
  reached the Games in 2021.
