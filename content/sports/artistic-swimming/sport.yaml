  - { value: "3 m", label: least depth of the pool }
summary: >
  One swimmer, two, or a team of eight perform a routine to music in a pool
  too deep to stand in. Much of it is done upside down, with the legs above
  the water and the head below it, and nobody may push off the bottom. Before
  the routine a team declares how hard each element will be. Officials check
  that the swimmers did what they declared, and two panels of judges mark how
  well it was done and how it looked. The highest total wins.
