id: artistic-swimming
label: Artistic swimming
tagline: A sport performed mostly upside down and underwater, judged from above it, and renamed by a vote most of its own experts did not cast.
governing_body: World Aquatics
founded: >
  Grew out of water ballet and aquatic shows in the 1920s and 1930s; on the
  world championship programme since 1973 and the Olympic one since 1984.
  Called synchronised swimming until 2017.
coverage: deep
family_colour: pool
classification:
  official: aquatics
  game-category: performance
  adjudication: judged
summary: >
  Routines set to music, in solo, duet or team, scored by two panels of
  judges and checked by six technical controllers. Since 2023 a team declares
  the difficulty of every element in advance, as divers do, and a controller
  who sees something different applies a base mark. The sport has long
  argued that it is athletic rather than theatrical, and changed its
  name in 2017 to one that says artistic.
cover: artistic-swimming-france-team
