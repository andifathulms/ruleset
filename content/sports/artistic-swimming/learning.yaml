    - { label: Olympic team, value: 8 swimmers, basis: rule, rule: ioc-2022-men-in-olympic-team }
    - { label: "Russian Olympic golds, 2000–2020", value: "12 of 12", basis: observation }

gap: >
  The gap is hidden. Most of what makes an elite routine — the eggbeater
  kick that holds a swimmer up, the breath held through a long underwater
  sequence — happens below the surface, so a beginner watching from the side
  sees the result and not the work.

