summary: >
  Pétanque is the most played of the boules games. A small wooden ball, the
  jack, is thrown six to ten metres from a circle on the ground. Players then
  stand in the circle with both feet on the ground and throw metal boules
  toward it. When all the boules are thrown, the side with the nearest boule
  scores one point for each boule it has closer than the other side's best,
  and the first side to thirteen wins. The ground is left rough on purpose,
  and the jack can be knocked to a new place, so a player may place a boule
  close or knock an opponent's boule away.
