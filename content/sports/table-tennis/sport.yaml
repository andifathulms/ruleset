summary: >
  Table tennis is played on a table 2.74 metres long with a net 15 centimetres
  high across the middle. The ball must bounce once on a player's own side
  before it is hit, and it must then land on the opponent's side. A point ends
  when someone fails to make a legal return. A game goes to 11 points, and a
  match is the best of five or seven games. The game is built on spin. The
  rubber on the bat can make the ball turn very fast, and the hard part is
  reading how the opponent's ball is spinning before it arrives.
