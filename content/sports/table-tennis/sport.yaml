id: table-tennis
label: Table tennis
tagline: Changed its ball twice and its scoring once, and every time the reason given was television.
governing_body: International Table Tennis Federation
founded: International Table Tennis Federation founded 1926.
coverage: deep
family_colour: clay
classification:
  official: table-tennis
  game-category: net-and-wall
  adjudication: decided-by-score
summary: >
  Badminton rewrote its scoring for broadcast in 2006. Table tennis did the
  same thing five years earlier and then went further, twice enlarging the ball
  to slow the game down for a camera. It is the clearest case on this site of a
  federation altering the physics of its own sport rather than its laws of
  play, and it did so knowing that every rally statistic before the change
  would stop being comparable.
