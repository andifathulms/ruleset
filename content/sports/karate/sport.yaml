summary: >
  Karate is contested in two ways. In kumite, two competitors in the same
  weight category spar on a square mat for three minutes. A punch scores one
  point, a kick to the body two and a kick to the head three, but only when
  the technique has good form, distance and timing and is kept under control.
  A strike that lands too hard is a penalty. In kata, one competitor performs
  a set sequence of movements alone and judges give it a score. What makes
  karate different from other striking sports is that control: the winning
  strike is the one that could have hurt and was held back.
