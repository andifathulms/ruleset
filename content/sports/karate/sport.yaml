id: karate
label: Karate
tagline: Waited a century for the Olympics, was contested once at a Games held in the country that invented it, and dropped.
governing_body: World Karate Federation
founded: >
  Developed in Okinawa from Chinese and indigenous traditions; codified in
  Japan from the 1920s. The WKF in its present form from 1990.
coverage: deep
family_colour: clay
classification:
  official: karate
  game-category: outside-taxonomy
  adjudication: combat
summary: >
  Karate appeared at exactly one Olympic Games, in Tokyo, and was not on the
  next programme — a decision taken before it was contested. Its rules are
  worth recording anyway, because it solved a problem taekwondo solved with
  sensors and boxing failed to solve with buttons: how to score a striking
  sport where the strikes are pulled on purpose.
