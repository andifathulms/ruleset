sport: karate
as_of: 2026-09
source: wkf-rules
standing: primary-named
summary: >
  Eight Olympic events, contested once, at Tokyo in 2021. Karate has not
  appeared on any programme since, and the decision to leave it off 2024 was
  taken in December 2020, before its only Games were held.
disciplines:
  - id: kumite
    label: Kumite
    blurb: Sparring, in weight categories, scored on controlled technique.
    events:
      - { id: m67, label: "Men −67 kg", olympic: true }
      - { id: m75, label: "Men −75 kg", olympic: true }
      - { id: m75p, label: "Men +75 kg", olympic: true }
      - { id: w55, label: "Women −55 kg", olympic: true }
      - { id: w61, label: "Women −61 kg", olympic: true }
      - { id: w61p, label: "Women +61 kg", olympic: true }
  - id: kata
    label: Kata
    blurb: A solo performance of a prescribed sequence, judged.
    events:
      - { id: km, label: "Men's kata", olympic: true }
      - { id: kw, label: "Women's kata", olympic: true }
  - id: other
    label: Governed by the federation, not on the programme
    counts: false
    events:
      - { id: team-kata, label: Team kata, note: Three competitors performing in synchrony. }
      - { id: team-kumite, label: Team kumite }
      - { id: para, label: Para karate, olympic: false }
      - { id: styles, label: Styles outside WKF competition, note: "Shotokan, Goju-ryu, Wado-ryu, Shito-ryu and others, with their own organisations and rules." }
