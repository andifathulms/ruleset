    - { label: Kit to start, value: A karategi, basis: observation }
    - { label: Facility, value: A hall, basis: observation }
    - { label: Partner required, value: Not for kata or basics, basis: observation }
    - { label: Time to first grading, value: Months, basis: judgement }
    - { label: Time to competitive kumite, value: A year or more, basis: judgement }

mastery:
  verdict: very-high
  claim: Scored on strikes you deliberately do not land, and judged by people rather than sensors.
  why: >
    Elite kumite demands a skill that sounds contradictory and is not: deliver a
    technique with the form, speed and distance to injure, and stop it. A strike
    that lands hard is penalised; a strike without the form to have worked does
    not score. The competitive margin sits between those two failures.

    That is also why karate could not follow taekwondo. A sensor measures force,
    and karate's whole premise is that the force was withheld. There is no
    instrument for a strike that was deliberately controlled, so the sport
    remains judged and always will be.

    The ceiling itself was then removed. Karate campaigned for Olympic
    inclusion for decades, appeared once, in Tokyo, and was left off the next
    programme by a decision taken before it was contested.
