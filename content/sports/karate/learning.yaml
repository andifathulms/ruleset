sport: karate
standing: editorial
summary: >
  One of the most widely taught martial arts in the world, with a graded
  syllabus designed for children, and an Olympic competitive form that most
  practitioners never enter. The gap between the two is the same one taekwondo
  has, and karate's ceiling was removed entirely after one Games.

entry:
  verdict: low
  claim: A dojo, a gi and a syllabus built for beginners.
  why: >
    Karate is organised worldwide as a graded curriculum with a belt structure,
    taught to children in ordinary halls, needing only a suit and an
    instructor. It is among the most accessible martial arts to begin and among
    the most widely available.

    There is no falling prerequisite as judo has, and much of the syllabus —
    kata, basics, conditioning — can be practised alone, which makes progress
    possible without a partner.

    What a beginner learns is largely not the Olympic sport. Kata is part of
    the syllabus; competitive kumite, with its controlled-contact scoring and
    weight categories, is a specialism within it.
