gap: >
  Karate sits low to very high and belongs directly beside taekwondo, which has
  almost the same shape and made the opposite technological choice.

  Both are striking sports taught worldwide as a graded syllabus to children,
  and in both the Olympic competitive form has diverged far from what most
  practitioners do. Taekwondo faced a judging crisis and solved it with sensors,
  crossing from judged to measured. Karate cannot make that crossing, because
  its scoring rewards a strike that was deliberately withheld and no instrument
  can detect restraint.

  So one of the two remains on the Olympic programme with a measured scoring
  system, and the other was contested once and dropped. Nothing about the
  scoring explains which — karate's exclusion was a host-city decision — but the
  contrast is the reason both are here.

