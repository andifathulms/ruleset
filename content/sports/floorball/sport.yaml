summary: >
  Floorball is played indoors on a rink forty metres by twenty with low boards
  around it. Each team has five outfield players and a goalkeeper, and tries to
  put a light plastic ball into a small goal with a stick. The stick may never
  go above the waist, players may not push or check each other, and there is
  no offside. The ball bounces off the boards and stays in play, so the game
  runs from end to end with few stops. The goalkeeper has no stick. They play
  on their knees, catch the ball with their hands and throw it back into play.
