    - { label: Players needed, value: "12", basis: rule, rule: floorball-1986-iff }
    - { label: Stick, value: About 350 g, basis: observation }
    - { label: Contact, value: Prohibited, basis: rule, rule: floorball-stick-below-waist }
    - { label: Stick height, value: Never above the waist, basis: rule, rule: floorball-stick-below-waist, note: Removes the swing that makes the other stick sports frightening to learn. }
    - { label: Time to a real game, value: One session, basis: judgement }

mastery:
  verdict: high
  claim: A continuous end-to-end game with no offside, played by full-time athletes in two countries.
  why: >
    Take away offside and the game never settles. Both teams can commit forward
    at any moment, the boards keep the ball live, and free hits restart play
    without letting a defence reorganise — so elite floorball is played at a
    sustained pace that requires rolling line changes to survive.

    The technical ceiling is higher than the light equipment suggests. A shot
    generated entirely below waist height has to come from wrist and blade
    control rather than from a swing, and the sport's best players do things
    with a 23-gram ball on a blade — dragging, lifting, shooting on the turn —
    that have no equivalent in the heavier stick sports.

    The goalkeeper is effectively a separate sport. No stick, kneeling, reading
    a shot that can come from anywhere and arrive with almost no wind-up.

    What caps the ceiling is the sport's concentration. Sweden and Finland have
    professional or semi-professional leagues and have won almost everything;
    for a player anywhere else, the pathway leads to one of those two countries
    or stops.
  evidence:
