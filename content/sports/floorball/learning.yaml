sport: floorball
standing: editorial
summary: >
  Probably the easiest stick sport in the world to begin — a light stick, a
  light ball, no contact and a flat indoor floor — and a fast, high-skill game
  at the top that only two countries have ever really won.

entry:
  verdict: very-low
  claim: A sports hall, twelve people and a stick that weighs a third of a kilo.
  why: >
    Floorball was designed into school halls and it shows. The stick is light
    enough for a child to swing accurately, the ball is 23 grams and does not
    hurt, the floor is flat and indoors, and body checking is banned outright,
    so a beginner is never hit.

    The rule that most helps beginners is the one capping the stick at waist
    height. It removes the dangerous swing that makes field hockey and ice
    hockey intimidating to learn, and it means a mixed-ability group can play
    together safely on the first attempt.

    It is a genuine mass-participation school sport in Sweden, Finland,
    Switzerland and the Czech Republic for exactly these reasons, and the
    equipment cost is among the lowest of any team sport covered here.
