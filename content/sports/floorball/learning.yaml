      value: Never adopted
      basis: rule
      rule: floorball-1986-iff
      note: The game runs end to end with no structural pause.
    - label: Shot generated below the waist
      value: Required
      basis: rule
      rule: floorball-stick-below-waist
      note: Power must come from blade and wrist control, not from a swing.
    - label: Goalkeeper without a stick
      value: Kneeling, catching by hand
      basis: rule
      rule: floorball-goalkeeper-no-stick
      note: A position with no counterpart in any other stick sport.
    - { label: Typical peak age, value: 23–31, basis: judgement }

gap: >
  Very low to high, and it is the sport on this site that most clearly gets
  both halves of the gap from the same decision.

  Field hockey and ice hockey are hard to start because of the stick — a hard
  swing, a hard ball or puck, and contact. Floorball capped the stick at the
  waist, banned checking and used a hollow plastic ball, which removed the
  danger and therefore the barrier. That same cap is what makes the elite game
  technical rather than powerful: if you cannot swing, everything has to come
  from touch.

  Set it against hockey, elsewhere on this site, which abolished its offside
  rule in 1998 to speed the game up. Floorball never had one to abolish, and
  arrived at the same continuous shape by not writing the rule in the first
  place.

