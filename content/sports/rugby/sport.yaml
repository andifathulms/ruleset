  game-category: invasion
  adjudication: decided-by-score
summary: >
  Rugby's Olympic sport is not the sport most people mean. It was contested as
  fifteens from 1900 to 1924 and returned in 2016 as sevens — same Laws,
  fifteen fewer players, fourteen minutes instead of eighty. It is also the
  clearest case on this site of a sport rewriting its central action for safety:
  the tackle has been progressively lowered by law since 2019 because of what
  the sport learned about repeated head impact.
