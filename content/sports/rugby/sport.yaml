tagline: Left the Olympics as a fifteen-a-side game in 1924 and came back in 2016 as a different one.
governing_body: World Rugby
founded: >
  Rugby Football Union founded 1871, after the 1863 split from association
  football; the international board from 1886.
coverage: deep
family_colour: pitch
classification:
