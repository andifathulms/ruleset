summary: >
  Rugby is played with an oval ball on a large grass pitch with tall posts at
  each end. A player may run with the ball or kick it forwards, but may only
  pass it backwards, so a team gains ground by running into the defence. The
  defence stops the carrier with a tackle, the tackled player must let go of
  the ball, and both teams fight for it on the ground. Grounding the ball over
  the goal line is a try, worth five points, and kicks between the posts add
  two or three. The main game has fifteen players a side and lasts eighty
  minutes. Sevens, the Olympic game, uses the same pitch with seven a side
  and lasts fourteen.
