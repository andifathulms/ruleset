gap: >
  Very low to very high — the widest gap on this site, and the only one where
  the top is not the top.

  Everything about starting is free, instant and open to anyone with a mind.
  Everything about excelling takes a decade and a childhood start. And above
  the very best human sits a machine that would beat them every time, which no
  other sport on this page has to accommodate.

  That fact has been absorbed rather than resisted, and the absorption is the
  interesting part. Chess did not diminish when engines passed it — participation
  grew enormously, because the same technology that beat everybody also made
  the game free, instantly available, and automatically matched to your exact
  strength. A sport that lost its claim to supremacy gained the largest playing
  population it has ever had.

