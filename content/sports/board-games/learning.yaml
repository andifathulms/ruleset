sport: board-games
standing: editorial
summary: >
  The rules of chess take ten minutes and the rules of go take five, and both
  are among the deepest competitive pursuits humans have. The gap between
  knowing how the pieces move and being any good is the largest on this site.

entry:
  verdict: very-low
  claim: A board, an opponent, and ten minutes to learn how the pieces move. It is free online.
  why: >
    Nothing here is cheaper to start. A chess set costs almost nothing and the
    game is free on any phone; go's rules are simpler than chess's — place a
    stone, surround to capture — and are learnable in five minutes.

    There is no physical requirement whatsoever. Age, size, strength, mobility
    and coordination are all irrelevant, which makes these the most genuinely
    open competitive activities covered on this site: an eight-year-old and an
    eighty-year-old can meet on equal terms and one of them will lose fairly.

    Online play removed the last barrier — an opponent of exactly your strength,
    available immediately, at any hour, rated automatically.
