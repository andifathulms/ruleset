    - { label: Kit to start, value: A board, or nothing at all online, basis: observation }
    - { label: Physical demand, value: None, basis: judgement }
    - { label: Rules to learn, value: Minutes, basis: observation }
    - { label: Opponent, value: Available online at your exact rating, basis: rule, rule: board-1924-fide }
    - { label: Time to a real game, value: Immediate, basis: judgement }

mastery:
  verdict: very-high
  claim: A decade of study to reach a level a phone exceeds, in a field where every position has an objectively correct answer.
  why: >
    The depth is not in dispute and it is very large. Reaching international
    master level in chess typically takes a decade of concentrated work started
    in childhood, and grandmaster is a substantial further step. Professional
    go in East Asia runs through insei systems that take children full-time from
    a young age.

    What makes the ceiling distinctive is what sits above it. In every other
    sport covered here, the best human is the best there is. In these, a
    consumer device plays better than the world champion, and has since 1997 in
    chess and 2016 in go. Elite preparation is now conducted by consulting a
    machine that would beat you, about a game you are better at than almost
    everyone alive.

    That also changed what mastery consists of. Opening preparation became
    memorisation of engine-verified lines, and the competitive edge moved
    towards positions engines evaluate as balanced but humans find hard — a
    player is no longer trying to find the best move so much as the move that
    is hardest for the person opposite.
  evidence:
