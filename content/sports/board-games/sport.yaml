summary: >
  Board games here means chess, go and xiangqi, three separate games grouped
  together at the Asian Games. In chess the aim is checkmate: an attack on the
  opponent's king that it cannot escape. Xiangqi, or Chinese chess, has the
  same aim against a general who may not leave a small palace. In go the
  players place stones on a grid to surround territory, and a stone never
  moves once it is placed. In all three, two players face each other across a
  board with a clock beside it. Both can see everything, and nothing depends
  on chance or on the body.
