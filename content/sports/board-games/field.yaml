# The three boards, from the counts in play.yaml. The unit is arbitrary: each
# board is drawn to a similar size, so the drawing is schematic.
sport: board-games
title: Three boards
caption: >
  Chess is played on the squares of an eight-by-eight board. Go is played on
  the points where the lines of a nineteen-by-nineteen grid cross. Xiangqi is
  also played on the points, on a grid of nine lines by ten. A river crosses
  the middle of the xiangqi board, and each general must stay inside the nine
  points of a palace.
alt: >
  Three boards side by side: a chess board of 64 squares, a go board with 19
  lines each way, and a xiangqi board of 9 lines by 10 with a river across the
  middle and a palace at each end.
scale: schematic
view: [-2, -2, 62, 24.5]
