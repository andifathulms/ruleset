id: dancesport
label: DanceSport
tagline: Competitive ballroom and Latin dancing, in which couples share one floor and a panel of judges compares them as they dance.
governing_body: World DanceSport Federation
founded: >
  Governed internationally since 1957, as the International Council of Amateur
  Dancers, renamed the International DanceSport Federation in 1990 and the
  World DanceSport Federation in 2011.
coverage: deep
family_colour: gold
classification:
  official: dancesport
  game-category: outside-taxonomy
  adjudication: judged
glance:
  - { value: "5", label: dances in a programme }
  - { value: "6", label: couples in a final }
  - { value: "1.5–2 min", label: length of each dance }
summary: >
  Two people dance as a couple, and the couple is the competitor. A
  competition is danced in one of two programmes, Standard or Latin, and each
  has five dances. Six or more couples are on the same unmarked floor at the
  same time, moving around each other, while the judges watch all of them.
  The judges mark technical quality, movement to music, partnering skill, and
  choreography and presentation. The marks from all five dances are added
  together, so one weak dance cannot be hidden. Lifts are not allowed.
cover: dancesport-shared-floor
