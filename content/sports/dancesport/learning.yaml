      value: Standard or Latin
      basis: rule
      rule: dancesport-1957-federation
      note: A weak dance cannot be hidden by a strong one.
    - label: Judged on components
      value: Since the WDSF's absolute system
      basis: rule
      rule: dancesport-absolute-judging
      note: Replaced ordinal placement, which scored a field rather than a performance.
    - { label: Couples on the floor at once, value: Six or more, basis: observation, note: Being seen is part of performing. }
    - { label: Typical peak age, value: 25–35, basis: judgement }

gap: >
  Low to very high, and the distinctive feature is that the ceiling is partly
  social rather than physical.

  Every other sport here asks an athlete to develop capacities in themselves. This
  one asks that too, and then makes the result depend on a second person's
  technique, commitment, availability and willingness to keep going. Partnerships
  end for reasons that have nothing to do with dancing, and when they do, two
  careers reset at once.

  The sport is also the site's clearest case of the "is it a sport" question
  being institutionally consequential rather than merely rhetorical. The
  federation renamed itself around the word, restructured its governance to look
  like an Olympic federation, and replaced a judging system that produced
  results a spectator could not read — all in pursuit of a place it has still
  not been given.

