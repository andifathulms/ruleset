sport: dancesport
standing: editorial
summary: >
  A social class in any town gets you started, and a competitive career depends
  on finding one specific other person and staying with them — which is a
  constraint no other sport on this site puts on an athlete.

entry:
  verdict: low
  claim: Ballroom classes exist nearly everywhere, and they are the sport's actual entry level.
  why: >
    Dancesport has the broadest amateur base of any sport covered here that
    isn't played with a ball. Social ballroom and Latin classes run in
    community halls, universities and studios across most of the world, teach
    the same dances the sport contests, and welcome complete beginners of any
    age.

    The equipment is shoes. The facility is a room with a floor. There is no
    contact risk, no fitness prerequisite to start, and the first competitive
    levels are graded so that beginners compete against beginners.

    What holds it at low rather than very low is the partner. You cannot start
    competing alone, and finding someone at a compatible level who wants the
    same commitment is a real barrier that has nothing to do with dancing.
