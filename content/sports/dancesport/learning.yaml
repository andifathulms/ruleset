    - { label: Kit to start, value: Shoes, basis: observation }
    - { label: Facility, value: A hall with a floor, basis: observation }
    - { label: Classes, value: Widely available worldwide, basis: observation }
    - { label: Time to a first competition, value: Months, basis: judgement }

mastery:
  verdict: very-high
  claim: Five dances at championship standard, in a partnership that must survive years.
  why: >
    A finalist must be excellent in five distinct dances with different rhythms,
    postures and technical demands, in one programme, on the same evening.
    Nothing else on this site asks for five disciplines at once except the
    combined events in athletics and modern pentathlon.

    The judged component is unusually hard to train against because of how the
    sport is watched. Six couples are on the floor simultaneously, so being seen
    is part of performing — floorcraft, the skill of navigating a crowded floor
    at speed without collision while dancing full out, is real and largely
    invisible to a spectator.

    And there is the partnership. A couple is the competitive unit, ranked
    together, and building one takes years of shared training. When a
    partnership ends, both athletes effectively restart. No other sport covered
    here makes an athlete's career contingent on one other person's continued
    availability in quite this way — equestrian's rider and horse is the closest
    parallel, and a horse does not leave.

    Costume, grooming and presentation are also judged components, which adds a
    cost dimension to the ceiling that the rules can constrain but not remove.
  evidence:
