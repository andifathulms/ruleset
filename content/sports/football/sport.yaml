summary: >
  Football is played by two teams of eleven on a large pitch with a goal at
  each end. Players move the ball with their feet, head and body, and only the
  goalkeeper may handle it. A goal counts when the whole ball crosses the goal
  line between the posts and under the bar, and every goal is worth one. A
  match is two halves of 45 minutes. The clock does not stop, so the referee
  adds time at the end of each half for stoppages. Goals are hard to score, so
  a single one can decide a match, and in league play a match may end level.
