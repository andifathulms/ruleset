summary: >
  A lifter squats with a loaded bar on the shoulders, presses a bar from the
  chest while lying on a bench, and pulls a bar from the floor until standing
  upright. Those are the three lifts, always in that order, with three
  attempts at each. Three referees judge every attempt, and a lift counts only
  if the movement met the standard and the lifter obeyed the referee's
  commands. The best good lift of each kind is added into a total, and the
  highest total in a bodyweight category wins. The lifts are slow and plain,
  and the contest is about strength held under control.
