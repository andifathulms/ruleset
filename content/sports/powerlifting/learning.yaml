gap: >
  Low to very high, and the interesting thing is that the gap is almost
  entirely time rather than talent or access.

  Set it against Olympic weightlifting, which this site also covers. The snatch
  and the clean and jerk are technically forbidding — a beginner cannot perform
  them at all without coaching, and the barrier is skill. Powerlifting's three
  lifts are approachable immediately, and the barrier is the decade it takes to
  make them heavy. Two strength sports, two completely different shapes of
  difficulty, constantly mistaken for each other.

  The institutional half of the ceiling has no equivalent anywhere else here.
  Every other sport on this site has one body that says what the record is, even
  where that body has annulled the book or refuses to call its marks records.
  Powerlifting has several, they do not recognise each other, and an athlete's
  standing depends on a choice made before they ever compete.

