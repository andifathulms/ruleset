sport: powerlifting
standing: editorial
summary: >
  The lowest genuine entry barrier of any strength sport — three movements
  most gyms already teach — and a very high ceiling that is reached slowly,
  over more years than almost anything else here.

entry:
  verdict: low
  claim: Three movements taught in every gym, and a first competition is realistic within a year.
  why: >
    The squat, bench press and deadlift are the standard vocabulary of
    resistance training worldwide, so most people who lift weights at all are
    already doing the sport's three events. Nothing has to be unlearned to
    compete.

    A first meet needs no club, no team, no facility of your own and no coach —
    entry-level competitions are open, run in ordinary gyms, and accept
    beginners in the same session as national champions. The equipment for the
    raw division is a belt and a singlet.

    What makes it low rather than very low is that the competition standards
    are stricter than gym practice: a paused bench, a squat judged below
    parallel, and commands to obey. A lifter's first meet total is almost
    always below what they thought they could lift.
  evidence:
    - { label: Kit to start, value: A belt and a singlet, basis: rule, rule: pl-2012-ipf-raw-division }
    - { label: Competitors needed, value: One, basis: observation, note: There is no opponent to find. }
    - { label: Movements, value: "3", basis: rule, rule: pl-1972-ipf-founded }
    - { label: Facility, value: Any gym with a rack and a bench, basis: observation }
    - { label: Time to a first meet, value: Months, basis: judgement }

mastery:
  verdict: very-high
  claim: A decade of accumulated strength, and a record book that will not tell you where you stand.
  why: >
    Strength at the top of this sport is built over a very long time. The peak
    age is later than almost anything else on this site, careers run into the
    forties, and there is no shortcut: the adaptations that let a lifter move
    an elite total accumulate over years rather than seasons.

    The technical ceiling is higher than it appears. A paused competition bench,
    a squat that must break parallel under maximal load, and a deadlift that
    cannot be hitched are all judged movements, and thousands of failed
    attempts at elite meets are technical rather than physical.

    Then there is the sport's institutional problem, which is unique on this
    site in its severity. Powerlifting has no single world record. Federations
    split over drug testing, equipment and judging standards, and each keeps
    its own book. A lifter must first decide which sport they are in, and the
    answer determines who they can be measured against for the rest of their
    career.
  evidence:
