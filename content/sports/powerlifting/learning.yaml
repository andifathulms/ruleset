      basis: rule
      rule: pl-federation-schism
      note: Different testing, equipment and depth standards; the numbers do not carry the conditions.
    - label: Categories redrawn
      value: "2011"
      basis: rule
      rule: pl-2020-weight-classes
      note: Annulled the records attached to the old classes, as weightlifting did in 1993 and 2018.
