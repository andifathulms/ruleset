# Skeleton layer (PRD §2). Olympic status per edition, for the Games of the
# Olympiad. This is structured data, not research: every row is sourced to
# Olympedia and the official IOC programme listings, and NOTHING here carries a
# cause or a rule citation. Rule 6 — the skeleton layer never borrows the deep
# layer's authority.
#
# `coverage: deep` means the sport has researched rule changes. `coverage:
# skeleton` means status and classification only, and the sport renders as
# not yet covered.

source: olympedia
last_reviewed: 2026-09

editions:
