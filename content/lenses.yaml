- id: game-category
  label: Game category
  blurb: >
    The invasion / net and wall / striking and fielding / target grouping from
    the Teaching Games for Understanding literature, where it originates. It
    was written to classify games, so it has nothing to say about combat sports,
    performance events or multi-discipline ones. Four of the sports here fall
    outside it entirely, and the board shows that lane rather than forcing them
    into a box.
  source: bunker-thorpe-1982
  groups:
    - id: net-and-wall
      label: Net and wall
      colour: clay
      members: [badminton, table-tennis, tennis, volleyball, squash, fistball,
                sepak-takraw, racquetball]
    - id: invasion
      label: Invasion
      colour: pitch
      members: [football, basketball, hockey, handball, rugby, lacrosse,
                flag-football, korfball, flying-disc, floorball, kabaddi]
    - id: striking-and-fielding
      label: Striking and fielding
      colour: pitch
      members: [cricket, baseball, softball]
    - id: target
      label: Target
      colour: pool
      members: [archery, shooting, golf]
    - id: performance
      label: Performance
      colour: gold
      members: [athletics, gymnastics, swimming, cycling, weightlifting, rowing,
                sailing, sport-climbing, equestrian, canoeing, triathlon,
                skateboarding, surfing, powerlifting, orienteering, lifesaving,
                finswimming]
    - id: outside-taxonomy
      label: Outside this taxonomy
      colour: unmarked
      members: [judo, taekwondo, boxing, modern-pentathlon, fencing, wrestling,
                karate, breaking, tug-of-war, sumo, dancesport, ju-jitsu,
                muaythai, wushu]

- id: adjudication
  label: Adjudication
  blurb: >
    How the winner is determined. This is the lens that answers the question
    the timeline exists to ask: do judged sports change their rules for
    different reasons than measured ones?
  source: null
  groups:
    - id: measured
      label: Measured
      colour: pool
      members: [athletics, swimming, cycling, archery, weightlifting, modern-pentathlon,
                rowing, sailing, shooting, golf, sport-climbing, canoeing, triathlon,
                powerlifting, orienteering, lifesaving, finswimming]
    - id: judged
      label: Judged
      colour: gold
      members: [gymnastics, equestrian, skateboarding, surfing, breaking, dancesport]
    - id: decided-by-score
      label: Decided by score
      colour: pitch
      members: [football, badminton, table-tennis, tennis, volleyball, basketball,
                cricket, baseball, hockey, handball, rugby, softball, lacrosse,
                squash, flag-football, korfball, tug-of-war, fistball, floorball,
                kabaddi, sepak-takraw, racquetball]
    - id: combat
      label: Combat
      colour: clay
      members: [judo, taekwondo, boxing, fencing, wrestling, karate, sumo,
                ju-jitsu, muaythai, wushu]
    # A fifth category the lens did not have until a sport arrived that needed
    # it. Every other sport here is adjudicated by someone who is not playing;
    # ultimate is adjudicated by the players, and that is a rule rather than an
    # absence of one.
    - id: self-officiated
      label: Self-officiated
      colour: unmarked
      members: [flying-disc]

# The fourth lens, and the only one derived from data on this site rather than
# from a published taxonomy: the groups are computed from content/programmes,
# and the members below are that computation written down.
#
# Both of the non-Olympic lanes now carry researched sports: tug of war, which
# was removed from the programme in the 1920s and built its competitive
# structure afterwards, and korfball, flying disc and powerlifting, which have
# never been on it. Until the World Games sports were added, those lanes were
# empty — the emptiness was a fact about this site's coverage, and filling
# them was the point of covering them.
- id: standing
  label: Standing
  blurb: >
    How a sport holds its place. Eighteen of the thirty-seven sports on the
    2028 programme have been removed from it and brought back at least once,
    which is the single most surprising number on this site: a place on the
    programme is not a settled thing, and the rule changes that follow a
    removal read differently once you know that.
  source: null
  groups:
    - id: never-off
      label: Never off
      colour: pool
      members: [athletics, cycling, fencing, gymnastics, rowing, swimming]
    - id: restored
      label: Removed, restored
      colour: gold
      members: [archery, baseball, boxing, cricket, equestrian, football, golf,
                handball, hockey, judo, lacrosse, rugby, sailing, shooting,
                softball, tennis, weightlifting, wrestling]
    - id: added
      label: Added and kept
      colour: pitch
      members: [badminton, basketball, canoeing, flag-football, modern-pentathlon,
                skateboarding, sport-climbing, squash, surfing, table-tennis,
                taekwondo, triathlon, volleyball]
    - id: dropped
      label: Admitted, dropped
      colour: clay
      members: [breaking, karate]
    - id: lapsed
      label: Lapsed pre-1940
      colour: unmarked
      members: [tug-of-war, polo, croquet, basque-pelota, roque, jeu-de-paume,
                rackets, motorboating]
    - id: elsewhere
      label: Never Olympic
      colour: unmarked
      members: [kabaddi, sepak-takraw, wushu, korfball, dragon-boat, esports,
                powerlifting, orienteering, ju-jitsu, kurash, sumo, fistball,
                floorball, flying-disc, lifesaving, muaythai, kickboxing,
                racquetball, soft-tennis, board-games, bridge, air-sports,
                billiards, boules, bowling, cheerleading, dancesport, duathlon,
                finswimming, roller-sports, underwater-sports, waterski-wakeboard]
