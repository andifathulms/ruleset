# Three switchable classification schemes (PRD §6). A lens re-lanes the whole
# board; it is not a tag on a page. Each lens cites the source of its taxonomy
# rather than inventing one.
#
# A group with no covered sport still appears, painted as uncovered. An empty
# lane is a fact about this site's coverage and belongs on the board.

- id: official
  label: Official
  blurb: >
    The IOC's own sport-level grouping, as published per Games. It is one sport
    to one lane and grows a lane for every sport added, which is the whole
    argument for the other two lenses: this one can tell you what a sport is
    called and nothing about what kind of thing it is. Switch to Adjudication
    and eighteen lanes become four.
  source: ioc-olympic-charter
  groups:
    - { id: aquatics, label: Aquatics, colour: pool, members: [swimming] }
    - { id: archery, label: Archery, colour: pool, members: [archery] }
    - { id: athletics, label: Athletics, colour: pool, members: [athletics] }
    - { id: badminton, label: Badminton, colour: clay, members: [badminton] }
    - { id: baseball, label: Baseball, colour: pitch, members: [baseball] }
    - { id: basketball, label: Basketball, colour: pitch, members: [basketball] }
    - { id: boxing, label: Boxing, colour: clay, members: [boxing] }
    - { id: cricket, label: Cricket, colour: pitch, members: [cricket] }
    - { id: cycling, label: Cycling, colour: pool, members: [cycling] }
    - { id: football, label: Football, colour: pitch, members: [football] }
    - { id: gymnastics, label: Gymnastics, colour: gold, members: [gymnastics] }
    - { id: judo, label: Judo, colour: clay, members: [judo] }
    - { id: modern-pentathlon, label: Modern pentathlon, colour: gold, members: [modern-pentathlon] }
    - { id: table-tennis, label: Table tennis, colour: clay, members: [table-tennis] }
    - { id: taekwondo, label: Taekwondo, colour: clay, members: [taekwondo] }
    - { id: tennis, label: Tennis, colour: clay, members: [tennis] }
    - { id: volleyball, label: Volleyball, colour: pitch, members: [volleyball] }
    - { id: weightlifting, label: Weightlifting, colour: pool, members: [weightlifting] }
    - { id: equestrian, label: Equestrian, colour: gold, members: [equestrian] }
    - { id: fencing, label: Fencing, colour: clay, members: [fencing] }
    - { id: golf, label: Golf, colour: pitch, members: [golf] }
    - { id: rowing, label: Rowing, colour: pool, members: [rowing] }
    - { id: sailing, label: Sailing, colour: pool, members: [sailing] }
    - { id: shooting, label: Shooting, colour: pool, members: [shooting] }
    - { id: sport-climbing, label: Sport climbing, colour: gold, members: [sport-climbing] }
    - { id: wrestling, label: Wrestling, colour: clay, members: [wrestling] }

- id: game-category
  label: Game category
  blurb: >
    The invasion / net and wall / striking and fielding / target grouping from
    the Teaching Games for Understanding literature, where it originates. It
    was written to classify games, so it has nothing to say about combat sports,
    performance events or multi-discipline ones. Four of the sports here fall
    outside it entirely, and the board shows that lane rather than forcing them
    into a box.
  source: bunker-thorpe-1982
  groups:
    - id: net-and-wall
      label: Net and wall
      colour: clay
      members: [badminton, table-tennis, tennis, volleyball]
    - id: invasion
      label: Invasion
      colour: pitch
      members: [football, basketball]
    - id: striking-and-fielding
      label: Striking and fielding
      colour: pitch
      members: [cricket, baseball]
    - id: target
      label: Target
      colour: pool
      members: [archery, shooting, golf]
    - id: performance
      label: Performance
      colour: gold
      members: [athletics, gymnastics, swimming, cycling, weightlifting, rowing,
                sailing, sport-climbing, equestrian]
    - id: outside-taxonomy
      label: Outside this taxonomy
      colour: unmarked
      members: [judo, taekwondo, boxing, modern-pentathlon, fencing, wrestling]

- id: adjudication
  label: Adjudication
  blurb: >
    How the winner is determined. This is the lens that answers the question
    the timeline exists to ask: do judged sports change their rules for
    different reasons than measured ones?
  source: null
  groups:
    - id: measured
      label: Measured
      colour: pool
      members: [athletics, swimming, cycling, archery, weightlifting, modern-pentathlon,
                rowing, sailing, shooting, golf, sport-climbing]
    - id: judged
      label: Judged
      colour: gold
      members: [gymnastics, equestrian]
    - id: decided-by-score
      label: Decided by score
      colour: pitch
      members: [football, badminton, table-tennis, tennis, volleyball, basketball,
                cricket, baseball]
    - id: combat
      label: Combat
      colour: clay
      members: [judo, taekwondo, boxing, fencing, wrestling]
