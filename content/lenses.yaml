# Three switchable classification schemes (PRD §6). A lens re-lanes the whole
# board; it is not a tag on a page. Each lens cites the source of its taxonomy
# rather than inventing one.
#
# A group with no covered sport still appears, painted as uncovered. An empty
# lane is a fact about this site's coverage and belongs on the board.

- id: official
  label: Official
  blurb: >
    The IOC's own sport-level grouping, as published per Games. It is one sport
    to one lane and grows a lane for every sport added, which is the whole
    argument for the other two lenses: this one can tell you what a sport is
    called and nothing about what kind of thing it is. Switch to Adjudication
    and eighteen lanes become four.
  source: ioc-olympic-charter
  groups:
